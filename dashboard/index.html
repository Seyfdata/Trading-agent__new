      {/* État initial (pas encore scanné) */}
      {!setupsData && !setupsLoading && (
        <div className="card" style={{ textAlign: 'center', padding: 40 }}>
          <div style={{ fontSize: 28, marginBottom: 12 }}>🎯</div>
          <div style={{ fontSize: 13, marginBottom: 6 }}>Aucun scan effectué</div>
          <div className="mc" style={{ fontSize: 11 }}>Clique sur "Scanner les setups" pour analyser la watchlist.</div>
          <div className="mc" style={{ fontSize: 11, marginTop: 4 }}>Le scan télécharge 1 an de données yfinance — compter ~30-60s.</div>
        </div>
      )}

      {/* Chargement */}
      {setupsLoading && (
        <div className="card" style={{ textAlign: 'center', padding: 40 }}>
          <div className="spin-anim" style={{ display: 'inline-block', fontSize: 28, marginBottom: 12 }}>⟳</div>
          <div className="mc" style={{ fontSize: 12 }}>Téléchargement des données de marché...</div>
          <div className="mc" style={{ fontSize: 11, marginTop: 4 }}>Patience — analyse de {22} tickers en cours.</div>
        </div>
      )}

      {/* Aucun résultat */}
      {setupsData && !setupsLoading && setups.length === 0 && (
        <div className="card" style={{ textAlign: 'center', padding: 40 }}>
          <div style={{ fontSize: 28, marginBottom: 12 }}>🧘</div>
          <div style={{ fontSize: 13, marginBottom: 6 }}>Aucun setup détecté.</div>
          <div className="mc" style={{ fontSize: 12 }}>Pas de setup = pas de trade forcé. Patience = edge.</div>
        </div>
      )}

      {/* Cartes de setups */}
      {setupsData && !setupsLoading && setups.length > 0 && (
        <div style={{ display: 'grid', gap: 12 }}>
          {setups.map(function(s, i) {
            var color = _SETUP_COLOR[s.setup_type] || '#64748b';
            var pos   = s.position || {};
            return (
              <div key={i} className="card" style={{ borderLeft: '3px solid ' + color }}>
                {/* En-tête */}
                <div className="rowb mb12">
                  <div className="row g10">
                    <a href={'https://www.tradingview.com/chart/?symbol=' + s.ticker}
                       target="_blank" rel="noopener"
                       className="tv-link" style={{ color: color, fontWeight: 700, fontSize: 15 }}>
                      {s.ticker} 📈
                    </a>
                    <span style={{ fontSize: 11, color: color, fontWeight: 600 }}>
                      {_SETUP_LABEL[s.setup_type] || s.setup_type}
                    </span>
                    {s.detected_at && (
                      <span className="mc" style={{ fontSize: 10 }}>{s.detected_at}</span>
                    )}
                  </div>
                  <span className={'badge ' + (_CONF_BADGE[s.confidence] || 'b-muted')}>
                    {s.confidence}
                  </span>
                </div>

                {/* Niveaux prix : grille 4 colonnes */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 12 }}>
                  {[
                    ['Entry',  '$' + fmt(s.entry),  'var(--text)'],
                    ['Stop',   '$' + fmt(s.stop),   'var(--bear)'],
                    ['Target', '$' + fmt(s.target), 'var(--bull)'],
                    ['R:R',    fmt(s.rr_ratio, 1) + 'x', color],
                  ].map(function(p) {
                    return (
                      <div key={p[0]} style={{ textAlign: 'center', background: 'rgba(0,0,0,.15)', borderRadius: 5, padding: '7px 4px' }}>
                        <div className="mc" style={{ fontSize: 9, letterSpacing: 1, textTransform: 'uppercase', marginBottom: 3 }}>{p[0]}</div>
                        <div style={{ fontWeight: 700, fontSize: 13, color: p[2] }}>{p[1]}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Position size */}
                {!pos.error && pos.shares > 0 && (
                  <div style={{ padding: '7px 10px', background: 'rgba(0,0,0,.2)', borderRadius: 5, marginBottom: 10, fontSize: 11 }}>
                    <span className="mc">Position : </span>
                    <span style={{ fontWeight: 600 }}>{pos.shares} actions</span>
                    <span className="mc"> | </span>
                    <span>${(pos.position_value || 0).toLocaleString()}</span>
                    <span className="mc"> | Risque </span>
                    <span style={{ color: 'var(--bear)', fontWeight: 600 }}>${pos.risk_dollars}</span>
                    <span className="mc"> ({pos.risk_pct_actual}%)</span>
                  </div>
                )}

                {/* Raisons */}
                <div>
                  {(s.reasons || []).map(function(r, ri) {
                    return (
                      <div key={ri} className="mc" style={{ fontSize: 11, marginBottom: 3 }}>• {r}</div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Journal de trading ─────────────────────────────────────────────────────

var _J_TICKERS  = ['AAPL','NVDA','TSLA','MSFT','META','AMZN','GOOGL','AMD','AVGO','QCOM','INTC','MU','ASML','TSM','MRVL','PLTR','SMCI','CRM','SNOW','TWLO','ZS','BABA'];
var _CAPITAL_J  = 10000;
var _RISK_PCT_J = 0.01;   // 1 %
var _STATUS_COLOR = { OPEN:'var(--accent)', CLOSED_WIN:'var(--bull)', CLOSED_LOSS:'var(--bear)', CLOSED_BE:'var(--neutral)' };
var _STATUS_LABEL = { OPEN:'OUVERT', CLOSED_WIN:'GAGNE', CLOSED_LOSS:'PERDU', CLOSED_BE:'BE' };
var _EMPTY_JFORM  = { ticker:'AAPL', entry_price:'', stop_price:'', target_price:'', setup_type:'MANUAL', direction:'LONG', notes:'' };

function _calcJLive(f) {
  var entry  = parseFloat(f.entry_price);
  var stop   = parseFloat(f.stop_price);
  var target = parseFloat(f.target_price);
  if (!entry || !stop || isNaN(entry) || isNaN(stop) || entry <= stop) {
    return { rr: null, shares: null, risk_dollars: null, valid: false, errors: entry && stop && entry <= stop ? ['Entry doit etre > Stop'] : [] };
  }
  var risk_dollars   = Math.round(_CAPITAL_J * _RISK_PCT_J);   // 100 $
  var risk_per_share = entry - stop;
  var shares         = Math.floor(risk_dollars / risk_per_share);
  var rr             = (target && !isNaN(target) && target > entry) ? (target - entry) / risk_per_share : null;
  var errors         = [];
  if (shares < 1)                    errors.push('Shares = 0 — stop trop proche du cours');
  if (rr !== null && rr < 2.5)       errors.push('R:R ' + rr.toFixed(2) + 'R < 2.5 minimum');
  var valid = errors.length === 0 && shares >= 1 && rr !== null && rr >= 2.5;
  return { rr: rr, shares: Math.max(shares, 0), risk_dollars: risk_dollars, valid: valid, errors: errors };
}

function JournalTab(props) {
  var posMonitor          = props.posMonitor           || { positions: [], alerts: [], checked_at: null };
  var inKillzone          = props.inKillzone            || false;
  var onRefreshPositions  = props.onRefreshPositions    || function() {};

  var ts = useState([]); var trades = ts[0]; var setTrades = ts[1];
  var ls = useState(true); var loading = ls[0]; var setLoading = ls[1];
  var ss = useState('form'); var section = ss[0]; var setSection = ss[1];
  var fs = useState(_EMPTY_JFORM); var form = fs[0]; var setForm = fs[1];
  var fes = useState(null); var formErr = fes[0]; var setFormErr = fes[1];
  var svs = useState(false); var saving = svs[0]; var setSaving = svs[1];
  var cs = useState(null); var closing = cs[0]; var setClosing = cs[1];
  var cvs = useState(false); var closeSaving = cvs[0]; var setCloseSaving = cvs[1];

  function loadTrades() {
    setLoading(true);
    fetch('/api/trades?limit=200')
      .then(function(r) { return r.json(); })
      .then(function(d) { setTrades(d.trades || []); })
      .catch(function() { setTrades([]); })
      .finally(function() { setLoading(false); });
  }
  useEffect(function() { loadTrades(); }, []);

  function setField(k, v) { setForm(function(f) { var n = Object.assign({}, f); n[k] = v; return n; }); }

  var live = _calcJLive(form);

  function submitTrade() {
    setFormErr(null);
    if (!form.entry_price || !form.stop_price || !form.target_price) { setFormErr('Entry, Stop et Target requis'); return; }
    if (!live.valid) { setFormErr(live.errors[0] || 'Parametres invalides'); return; }
    setSaving(true);
    fetch('/api/trades', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticker: form.ticker, entry_price: parseFloat(form.entry_price),
        stop_price: parseFloat(form.stop_price), target_price: parseFloat(form.target_price),
        shares: live.shares, setup_type: form.setup_type, direction: form.direction,
        notes: form.notes || null,
      }),
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.error) { setFormErr(d.error); return; }
        setForm(_EMPTY_JFORM);
        loadTrades();
        setSection('open');
      })
      .catch(function(e) { setFormErr(String(e)); })
      .finally(function() { setSaving(false); });
  }

  function startClose(t) { setClosing({ id: t.id, ticker: t.ticker, target: t.target_price, price: '', note: '' }); }
  function cancelClose() { setClosing(null); }
  function submitClose(trade_id) {
    if (!closing || !closing.price) return;
    setCloseSaving(true);
    fetch('/api/trades/' + trade_id + '/close', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ close_price: parseFloat(closing.price), notes: closing.note || null }),
    }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.error) { alert(d.error); return; }
        setClosing(null); loadTrades();
      })
      .catch(function(e) { alert(String(e)); })
      .finally(function() { setCloseSaving(false); });
  }

  function deleteTrade(id) {
    if (!confirm('Supprimer ce trade définitivement ?')) return;
    fetch('/api/trades/' + id, { method: 'DELETE' })
      .then(function() { loadTrades(); })
      .catch(function(e) { alert(String(e)); });
  }

  var openTrades  = trades.filter(function(t) { return t.status === 'OPEN'; });
  var closed      = trades.filter(function(t) { return t.status !== 'OPEN'; });
  var wins        = closed.filter(function(t) { return t.status === 'CLOSED_WIN'; });
  var losses      = closed.filter(function(t) { return t.status === 'CLOSED_LOSS'; });
  var winRate     = closed.length > 0 ? Math.round(wins.length / closed.length * 100) : null;
  var totalPnl    = closed.reduce(function(a, t) { return a + (t.pnl_dollars || 0); }, 0);
  var grossWin    = wins.reduce(function(a, t) { return a + (t.pnl_dollars || 0); }, 0);
  var grossLoss   = losses.reduce(function(a, t) { return a + Math.abs(t.pnl_dollars || 0); }, 0);
  var pf          = grossLoss > 0 ? (grossWin / grossLoss).toFixed(2) : null;

  var inp = { background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 6, padding: '6px 10px', color: 'var(--text)', fontFamily: 'JetBrains Mono,monospace', fontSize: 12 };

  return (
    <div>
      {/* Stats bar */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
        {[
          { label: 'Ouverts',    val: openTrades.length, color: 'var(--accent)' },
          { label: 'Clotures',   val: closed.length,     color: 'var(--muted)' },
          { label: 'Win Rate',   val: winRate !== null ? winRate + '%' : '—', color: winRate !== null && winRate >= 50 ? 'var(--bull)' : 'var(--bear)' },
          { label: 'Profit F.', val: pf ? pf + 'x' : '—', color: pf && parseFloat(pf) >= 1.5 ? 'var(--bull)' : 'var(--neutral)' },
          { label: 'PnL total', val: closed.length ? (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(0) + ' $' : '—', color: totalPnl >= 0 ? 'var(--bull)' : 'var(--bear)' },
        ].map(function(s) {
          return (
            <div key={s.label} className="card card-sm" style={{ flex: '1 1 100px', minWidth: 100 }}>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 3 }}>{s.label}</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: s.color }}>{s.val}</div>
            </div>
          );
        })}
      </div>

      {/* Section tabs */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 10, flexWrap: 'wrap' }}>
        {[
          { id: 'form',    label: '+ Nouveau trade' },
          { id: 'open',    label: 'Positions ouvertes (' + openTrades.length + ')' },
          { id: 'history', label: 'Historique (' + closed.length + ')' },
        ].map(function(s) {
          return (
            <button key={s.id} className={'btn' + (section === s.id ? ' btn-p' : '')} onClick={function() { setSection(s.id); }}>
              {s.label}
            </button>
          );
        })}
        <button className="btn" style={{ marginLeft: 'auto' }} onClick={loadTrades} disabled={loading}>
          {loading ? '...' : 'Actualiser'}
        </button>
      </div>

      {/* ── Section : Nouveau trade ─────────────────────────────── */}
      {section === 'form' && (
        <div className="card">
          <div className="stitle" style={{ marginBottom: 16 }}>Nouveau trade</div>

          {/* Row 1 : Ticker / Setup / Direction */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 14 }}>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Ticker</div>
              <select value={form.ticker} onChange={function(e) { setField('ticker', e.target.value); }} style={Object.assign({}, inp, { width: '100%' })}>
                {_J_TICKERS.map(function(tk) { return <option key={tk} value={tk}>{tk}</option>; })}
              </select>
            </div>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Setup type</div>
              <select value={form.setup_type} onChange={function(e) { setField('setup_type', e.target.value); }} style={Object.assign({}, inp, { width: '100%' })}>
                <option value="MANUAL">MANUAL</option>
                <option value="DISCOUNT_ZONE">DISCOUNT_ZONE</option>
                <option value="SMA200_BOUNCE">SMA200_BOUNCE</option>
                <option value="VOLUME_MOMENTUM">VOLUME_MOMENTUM</option>
              </select>
            </div>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Direction</div>
              <select value={form.direction} onChange={function(e) { setField('direction', e.target.value); }} style={Object.assign({}, inp, { width: '100%' })}>
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
              </select>
            </div>
          </div>

          {/* Row 2 : Entry / Stop / Target */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 14 }}>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Entry price ($)</div>
              <input type="number" step="0.01" placeholder="150.00" value={form.entry_price}
                onChange={function(e) { setField('entry_price', e.target.value); }}
                style={Object.assign({}, inp, { width: '100%' })} />
            </div>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--bear)', marginBottom: 4 }}>Stop price ($)</div>
              <input type="number" step="0.01" placeholder="147.00" value={form.stop_price}
                onChange={function(e) { setField('stop_price', e.target.value); }}
                style={Object.assign({}, inp, { width: '100%', borderColor: 'rgba(239,68,68,.4)' })} />
            </div>
            <div>
              <div className="mc" style={{ fontSize: 10, color: 'var(--bull)', marginBottom: 4 }}>Target price ($)</div>
              <input type="number" step="0.01" placeholder="157.50" value={form.target_price}
                onChange={function(e) { setField('target_price', e.target.value); }}
                style={Object.assign({}, inp, { width: '100%', borderColor: 'rgba(16,185,129,.4)' })} />
            </div>
          </div>

          {/* Row 3 : Live computed */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 14 }}>
            <div className="card card-sm" style={{ background: 'rgba(59,130,246,.06)', borderColor: 'rgba(59,130,246,.2)' }}>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 2 }}>R:R calcule</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: live.rr === null ? 'var(--muted)' : live.rr >= 2.5 ? 'var(--bull)' : 'var(--bear)' }}>
                {live.rr !== null ? live.rr.toFixed(2) + 'R' : '—'}
              </div>
              {live.rr !== null && live.rr < 2.5 && <div style={{ fontSize: 10, color: 'var(--bear)' }}>min 2.5R requis</div>}
            </div>
            <div className="card card-sm" style={{ background: 'rgba(59,130,246,.06)', borderColor: 'rgba(59,130,246,.2)' }}>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 2 }}>Shares (1% risque)</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--text)' }}>
                {live.shares !== null ? live.shares : '—'}
              </div>
              {live.risk_dollars !== null && <div style={{ fontSize: 10, color: 'var(--muted)' }}>Risque: {live.risk_dollars} $ sur {_CAPITAL_J.toLocaleString()} $</div>}
            </div>
            <div className="card card-sm" style={{ background: 'rgba(59,130,246,.06)', borderColor: 'rgba(59,130,246,.2)' }}>
              <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 2 }}>Capital expose</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--text)' }}>
                {live.shares && form.entry_price ? Math.round(live.shares * parseFloat(form.entry_price)).toLocaleString() + ' $' : '—'}
              </div>
              {live.shares && form.entry_price && <div style={{ fontSize: 10, color: 'var(--muted)' }}>{live.shares} shares x {parseFloat(form.entry_price).toFixed(2)}</div>}
            </div>
          </div>

          {/* Erreurs de validation */}
          {live.errors.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              {live.errors.map(function(err, i) {
                return <div key={i} style={{ fontSize: 11, color: 'var(--bear)', marginBottom: 2 }}>! {err}</div>;
              })}
            </div>
          )}

          {/* Notes */}
          <div style={{ marginBottom: 14 }}>
            <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Notes</div>
            <textarea rows={2} placeholder="Setup confluences, contexte marche, catalyseur..."
              value={form.notes} onChange={function(e) { setField('notes', e.target.value); }}
              style={Object.assign({}, inp, { width: '100%', resize: 'vertical' })} />
          </div>

          {formErr && <div style={{ color: 'var(--bear)', fontSize: 12, marginBottom: 10 }}>! {formErr}</div>}
          <button className="btn btn-p" onClick={submitTrade} disabled={saving || !live.valid}>
            {saving ? 'Enregistrement...' : 'Enregistrer le trade'}
          </button>
          {!live.valid && form.entry_price && form.stop_price && form.target_price && (
            <span style={{ fontSize: 11, color: 'var(--muted)', marginLeft: 12 }}>Corrigez les erreurs ci-dessus pour activer.</span>
          )}
        </div>
      )}

      {/* ── Section : Positions ouvertes ────────────────────────── */}
      {section === 'open' && (
        <div>
          {/* Barre de vérification positions */}
          <div className="rowb mb12" style={{ fontSize: 11, color: 'var(--muted)' }}>
            <span>
              {posMonitor.checked_at
                ? 'Dernière vérification : ' + posMonitor.checked_at
                : 'PnL temps réel disponible pendant la killzone'}
            </span>
            {!inKillzone && (
              <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={onRefreshPositions}>
                📊 Vérifier maintenant
              </button>
            )}
            {inKillzone && posMonitor.checked_at && (
              <span className="mc" style={{ fontSize: 10 }}>auto-refresh 5 min</span>
            )}
          </div>

          {loading ? (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>Chargement...</div>
          ) : openTrades.length === 0 ? (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>
              Aucune position ouverte.
              <div style={{ marginTop: 12 }}>
                <button className="btn" onClick={function() { setSection('form'); }}>+ Nouveau trade</button>
              </div>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(300px,1fr))', gap: 12 }}>
              {openTrades.map(function(t) {
                var isClosing = closing && closing.id === t.id;
                // Recherche des données de position temps réel
                var pm = null;
                if (posMonitor && posMonitor.positions) {
                  for (var pi = 0; pi < posMonitor.positions.length; pi++) {
                    if (posMonitor.positions[pi].id === t.id) { pm = posMonitor.positions[pi]; break; }
                  }
                }
                // Calcul barre de progression
                var barRange = (t.target_price && t.stop_price) ? t.target_price - t.stop_price : 0;
                var entryPct  = barRange > 0 ? Math.max(0, Math.min(100, (t.entry_price - t.stop_price) / barRange * 100)) : 50;
                var currPct   = (pm && barRange > 0) ? Math.max(0, Math.min(100, (pm.current_price - t.stop_price) / barRange * 100)) : null;
                var barGrad   = 'linear-gradient(to right, #ef4444 0%, #ef4444 ' + Math.max(0, entryPct - 4) + '%, #334155 ' + entryPct + '%, #10b981 100%)';
                var markerClr = pm ? (pm.current_price >= t.entry_price ? '#10b981' : '#ef4444') : '#94a3b8';
                return (
                  <div key={t.id} className="card">
                    {/* Bandeau status_alert (clignotant si critique) */}
                    {pm && pm.status_alert && (
                      <div className={'pos-alert ' + (pm.status_alert === 'TARGET_HIT' ? 'pos-alert-crit-win' : pm.status_alert === 'STOP_HIT' ? 'pos-alert-crit' : pm.status_alert === 'NEAR_TARGET' ? 'pos-alert-warn-win' : 'pos-alert-warn')}
                        style={{ marginBottom: 10 }}>
                        {pm.status_alert === 'TARGET_HIT'   && '🎯 TARGET ATTEINT — ' + pm.current_price.toFixed(2)}
                        {pm.status_alert === 'STOP_HIT'     && '🛑 STOP TOUCHÉ — ' + pm.current_price.toFixed(2)}
                        {pm.status_alert === 'NEAR_TARGET'  && '⚠️ Proche target — ' + pm.distance_target_pct + '% restant'}
                        {pm.status_alert === 'NEAR_STOP'    && '⚠️ Proche stop — ' + pm.distance_stop_pct + '% marge'}
                        {pm.status_alert === 'BREAKEVEN'    && '↔️ Au breakeven'}
                      </div>
                    )}

                    {/* Card header */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                      <div>
                        <span style={{ fontSize: 18, fontWeight: 700, color: 'var(--accent)' }}>{t.ticker}</span>
                        <span className="badge b-muted" style={{ marginLeft: 8, fontSize: 9 }}>{t.direction}</span>
                        <span className="badge b-accent" style={{ marginLeft: 6, fontSize: 9 }}>{t.setup_type}</span>
                      </div>
                      <div className="mc" style={{ fontSize: 10, color: 'var(--muted)' }}>{(t.date_open || '').slice(0, 10)}</div>
                    </div>

                    {/* PnL temps réel */}
                    {pm && (
                      <div style={{ background: 'rgba(30,41,59,.4)', borderRadius: 6, padding: '8px 10px', marginBottom: 10 }}>
                        <div className="rowb" style={{ marginBottom: 6 }}>
                          <div className="row g8">
                            <span className="mc" style={{ fontSize: 10 }}>CURRENT</span>
                            <span style={{ fontWeight: 700, fontSize: 14 }}>{pm.current_price.toFixed(2)}</span>
                            <span style={{ fontWeight: 700, fontSize: 12, color: pm.r_current >= 0 ? 'var(--bull)' : 'var(--bear)' }}>
                              {(pm.r_current >= 0 ? '+' : '') + pm.r_current.toFixed(1) + 'R'}
                            </span>
                          </div>
                          <div style={{ textAlign: 'right' }}>
                            <div style={{ fontWeight: 700, fontSize: 14, color: pm.pnl_latent >= 0 ? 'var(--bull)' : 'var(--bear)' }}>
                              {(pm.pnl_latent >= 0 ? '+' : '') + '$' + Math.abs(pm.pnl_latent).toFixed(0)}
                            </div>
                            <div className="mc" style={{ fontSize: 10 }}>
                              {(pm.pnl_pct >= 0 ? '+' : '') + pm.pnl_pct.toFixed(2) + '%'}
                            </div>
                          </div>
                        </div>
                        {/* Barre stop↔target */}
                        {barRange > 0 && currPct !== null && (
                          <div>
                            <div className="pos-bar" style={{ background: barGrad }}>
                              <div className="pos-marker" style={{ left: currPct + '%', background: markerClr }} />
                            </div>
                            <div className="rowb" style={{ fontSize: 9, color: 'var(--muted)', marginTop: 4 }}>
                              <span style={{ color: 'var(--bear)' }}>STOP {t.stop_price.toFixed(2)}</span>
                              <span>ENTRY {t.entry_price.toFixed(2)}</span>
                              <span style={{ color: 'var(--bull)' }}>TARGET {t.target_price.toFixed(2)}</span>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {/* Price grid (toujours visible) */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 0, marginBottom: 10, border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden' }}>
                      {[
                        { label: 'ENTRY',  val: t.entry_price,  color: 'var(--text)' },
                        { label: 'STOP',   val: t.stop_price,   color: 'var(--bear)' },
                        { label: 'TARGET', val: t.target_price, color: 'var(--bull)' },
                      ].map(function(p, pi) {
                        return (
                          <div key={p.label} style={{ textAlign: 'center', padding: '8px 4px', borderLeft: pi > 0 ? '1px solid var(--border)' : 'none' }}>
                            <div className="mc" style={{ fontSize: 9, color: p.color, marginBottom: 3 }}>{p.label}</div>
                            <div style={{ fontWeight: 700, color: p.color }}>{p.val ? p.val.toFixed(2) : '—'}</div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Metrics */}
                    <div style={{ display: 'flex', gap: 14, fontSize: 11, color: 'var(--muted)', marginBottom: 10, flexWrap: 'wrap' }}>
                      <span>Shares: <b style={{ color: 'var(--text)' }}>{t.shares}</b></span>
                      <span>Risque: <b style={{ color: 'var(--text)' }}>{t.risk_dollars != null ? t.risk_dollars.toFixed(0) + ' $' : '—'}</b></span>
                      <span>R:R plan: <b style={{ color: 'var(--neutral)' }}>{t.rr_planned != null ? t.rr_planned.toFixed(2) + 'R' : '—'}</b></span>
                    </div>

                    {t.notes && (
                      <div style={{ fontSize: 11, color: 'var(--muted)', fontStyle: 'italic', marginBottom: 10, borderLeft: '2px solid var(--border)', paddingLeft: 8 }}>
                        {t.notes}
                      </div>
                    )}

                    {/* Clôture inline */}
                    {isClosing ? (
                      <div style={{ background: 'rgba(16,185,129,.06)', border: '1px solid rgba(16,185,129,.2)', borderRadius: 6, padding: 10 }}>
                        <div className="mc" style={{ fontSize: 10, color: 'var(--bull)', marginBottom: 6 }}>Prix de cloture</div>
                        <input type="number" step="0.01" placeholder={t.target_price ? t.target_price.toFixed(2) : ''}
                          value={closing.price}
                          onChange={function(e) { setClosing(Object.assign({}, closing, { price: e.target.value })); }}
                          style={Object.assign({}, inp, { width: '100%', marginBottom: 6 })} autoFocus />
                        <textarea rows={1} placeholder="Notes (optionnel)"
                          value={closing.note}
                          onChange={function(e) { setClosing(Object.assign({}, closing, { note: e.target.value })); }}
                          style={Object.assign({}, inp, { width: '100%', resize: 'none', marginBottom: 8 })} />
                        <div style={{ display: 'flex', gap: 6 }}>
                          <button className="btn btn-p" style={{ fontSize: 11 }} onClick={function() { submitClose(t.id); }} disabled={closeSaving || !closing.price}>
                            {closeSaving ? '...' : 'Confirmer'}
                          </button>
                          <button className="btn" style={{ fontSize: 11 }} onClick={cancelClose}>Annuler</button>
                        </div>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button className="btn" style={{ flex: 1, justifyContent: 'center', color: 'var(--bull)', borderColor: 'rgba(16,185,129,.4)' }}
                          onClick={function() { startClose(t); }}>
                          Cloturer
                        </button>
                        <button className="btn" style={{ color: 'var(--bear)', borderColor: 'rgba(239,68,68,.3)' }}
                          onClick={function() { deleteTrade(t.id); }}>
                          Suppr.
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ── Section : Historique ──────────────────────────────────── */}
      {section === 'history' && (
        <div>
          {/* Mini stats */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: 10, marginBottom: 16 }}>
            {[
              { label: 'Win Rate',      val: winRate !== null ? winRate + '%' : '—', color: winRate !== null && winRate >= 50 ? 'var(--bull)' : 'var(--bear)' },
              { label: 'Profit Factor', val: pf ? pf + 'x' : '—', color: pf && parseFloat(pf) >= 1.5 ? 'var(--bull)' : 'var(--neutral)' },
              { label: 'PnL total',     val: closed.length ? (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(0) + ' $' : '—', color: totalPnl >= 0 ? 'var(--bull)' : 'var(--bear)' },
              { label: 'Gains bruts',   val: grossWin > 0 ? '+' + grossWin.toFixed(0) + ' $' : '—', color: 'var(--bull)' },
              { label: 'Pertes brutes', val: grossLoss > 0 ? '-' + grossLoss.toFixed(0) + ' $' : '—', color: 'var(--bear)' },
              { label: 'Trades clot.',  val: closed.length, color: 'var(--muted)' },
            ].map(function(s) {
              return (
                <div key={s.label} className="card card-sm">
                  <div className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 3 }}>{s.label}</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: s.color }}>{s.val}</div>
                </div>
              );
            })}
          </div>

          {loading ? (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>Chargement...</div>
          ) : closed.length === 0 ? (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>Aucun trade cloture pour l'instant.</div>
          ) : (
            <div className="card" style={{ padding: 0, overflowX: 'auto' }}>
              <table className="tbl">
                <thead>
                  <tr>
                    <th>Date</th><th>Ticker</th><th>Type</th>
                    <th style={{ textAlign: 'right' }}>Entry</th>
                    <th style={{ textAlign: 'right' }}>Close</th>
                    <th style={{ textAlign: 'right' }}>R:R plan.</th>
                    <th style={{ textAlign: 'right' }}>R:R real.</th>
                    <th style={{ textAlign: 'right' }}>PnL</th>
                    <th>Statut</th><th></th>
                  </tr>
                </thead>
                <tbody>
                  {closed.map(function(t) {
                    var sc = _STATUS_COLOR[t.status] || 'var(--muted)';
                    return (
                      <tr key={t.id}>
                        <td className="mc" style={{ fontSize: 11, color: 'var(--muted)' }}>{(t.date_open || '').slice(0, 10)}</td>
                        <td>
                          <span style={{ fontWeight: 700, color: 'var(--accent)' }}>{t.ticker}</span>
                          <span className="mc" style={{ fontSize: 10, color: 'var(--muted)', marginLeft: 5 }}>{t.direction}</span>
                        </td>
                        <td><span className="badge b-muted" style={{ fontSize: 9 }}>{t.setup_type}</span></td>
                        <td style={{ textAlign: 'right' }}>{t.entry_price != null ? t.entry_price.toFixed(2) : '—'}</td>
                        <td style={{ textAlign: 'right' }}>{t.close_price != null ? t.close_price.toFixed(2) : '—'}</td>
                        <td style={{ textAlign: 'right', color: 'var(--muted)' }}>{t.rr_planned != null ? t.rr_planned.toFixed(2) + 'R' : '—'}</td>
                        <td style={{ textAlign: 'right', fontWeight: 700, color: t.rr_realized != null && t.rr_realized >= 0 ? 'var(--bull)' : 'var(--bear)' }}>
                          {t.rr_realized != null ? (t.rr_realized >= 0 ? '+' : '') + t.rr_realized.toFixed(2) + 'R' : '—'}
                        </td>
                        <td style={{ textAlign: 'right', fontWeight: 700, color: t.pnl_dollars == null ? 'var(--muted)' : t.pnl_dollars >= 0 ? 'var(--bull)' : 'var(--bear)' }}>
                          {t.pnl_dollars != null ? (t.pnl_dollars >= 0 ? '+' : '') + t.pnl_dollars.toFixed(0) + ' $' : '—'}
                        </td>
                        <td><span style={{ color: sc, fontWeight: 700, fontSize: 11 }}>{_STATUS_LABEL[t.status] || t.status}</span></td>
                        <td>
                          <button className="btn" style={{ fontSize: 10, padding: '2px 7px', color: 'var(--bear)', borderColor: 'rgba(239,68,68,.3)' }}
                            onClick={function() { deleteTrade(t.id); }}>x</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

var TABS = [
  { id: 'overview',  label: '📊 Vue d\'ensemble' },
  { id: 'watchlist', label: '📈 Watchlist'        },
  { id: 'reddit',    label: '🔴 Reddit'           },
  { id: 'news',      label: '📰 News'             },
  { id: 'alerts',    label: '⚡ Alertes'          },
  { id: 'setups',    label: '🎯 Setups'           },
  { id: 'journal',   label: '📝 Journal'          },
  { id: 'history',   label: '📊 Performance'      }
];

// Ref module-level pour éviter les stale closures dans setInterval
var _testModeRef = { active: false, expiry: null };
var _kzRef       = { active: false };

function TradingDashboard() {
  var tabState  = useState('overview');
  var tab       = tabState[0];
  var setTab    = tabState[1];

  var timeState = useState(new Date());
  var time      = timeState[0];
  var setTime   = timeState[1];

  var dataState = useState(DEMO);
  var data      = dataState[0];
  var setData   = dataState[1];

  var refreshMsgState = useState('idle');   // 'idle' | 'scanning' | 'done:Xs' | 'error'
  var refreshMsg      = refreshMsgState[0];
  var setRefreshMsg   = refreshMsgState[1];
  var loading         = refreshMsg === 'scanning';

  var lastUpdState = useState(null);
  var lastUpd      = lastUpdState[0];
  var setLastUpd   = lastUpdState[1];

  var alertDataState  = useState({ in_killzone: false, alerts: [], next_killzone: '—', scanned_at: null });
  var alertData       = alertDataState[0];
  var setAlertData    = alertDataState[1];

  var liveNewsState   = useState([]);
  var liveNews        = liveNewsState[0];
  var setLiveNews     = liveNewsState[1];

  var unreadState     = useState(0);
  var unread          = unreadState[0];
  var setUnread       = unreadState[1];

  var countdownState  = useState(null);
  var countdown       = countdownState[0];
  var setCountdown    = countdownState[1];

  var testModeState   = useState(false);
  var testMode        = testModeState[0];
  var setTestMode     = testModeState[1];

  var testExpiryState = useState(null);   // timestamp ms d'expiration du test mode
  var testExpiry      = testExpiryState[0];
  var setTestExpiry   = testExpiryState[1];

  var pmDataState    = useState(null);
  var pmData         = pmDataState[0];
  var setPmData      = pmDataState[1];

  var pmLoadingState = useState(false);
  var pmLoading      = pmLoadingState[0];
  var setPmLoading   = pmLoadingState[1];

  var setupsDataState    = useState(null);
  var setupsData         = setupsDataState[0];
  var setSetupsData      = setupsDataState[1];

  var setupsLoadingState = useState(false);
  var setupsLoading      = setupsLoadingState[0];
  var setSetupsLoading   = setupsLoadingState[1];

  var posMonitorState = useState({ positions: [], alerts: [], checked_at: null, count: 0 });
  var posMonitor      = posMonitorState[0];
  var setPosMonitor   = posMonitorState[1];

  useEffect(function() {
    // Charger chaque endpoint indépendamment — mise à jour dès réception, timeout 15s
    var eps = ['market', 'tickers', 'reddit', 'news', 'macro', 'history'];
    eps.forEach(function(ep) {
      var ctrl = new AbortController();
      var tid  = setTimeout(function() { ctrl.abort(); }, 15000);
      fetch('/api/' + ep, { signal: ctrl.signal })
        .then(function(r) { return r.json(); })
        .then(function(json) {
          clearTimeout(tid);
          setData(function(prev) {
            var next = Object.assign({}, prev);
            next[ep] = json;
            return next;
          });
          setLastUpd(new Date());
        })
        .catch(function() { clearTimeout(tid); /* garde données démo */ });
    });

    // Horloge
    var clk = setInterval(function() { setTime(new Date()); }, 1000);

    // ── Alerts auto-refresh ──────────────────────────────────────────────
    var ALERT_INTERVAL  = 5 * 60;   // 5 min en secondes
    var NEWS_INTERVAL   = 15 * 60;  // 15 min en secondes
    var alertTick       = ALERT_INTERVAL;
    var newsTick        = NEWS_INTERVAL;
    var posTick         = ALERT_INTERVAL;

    function fetchAlerts(force) {
      var url = force ? '/api/alerts?force=true' : '/api/alerts';
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(json) {
          _kzRef.active = !!json.in_killzone;
          setAlertData(function(prev) {
            var prevCount = (prev.alerts || []).length;
            var newCount  = (json.alerts || []).length;
            if (newCount > prevCount) {
              setUnread(function(u) { return u + (newCount - prevCount); });
            }
            return json;
          });
        })
        .catch(function() {});
    }

    function fetchPositions() {
      fetch('/api/positions/monitor')
        .then(function(r) { return r.json(); })
        .then(function(json) { setPosMonitor(json); })
        .catch(function() {});
    }

    function fetchAlertNews() {
      fetch('/api/alerts/news')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          if (json.new_news && json.new_news.length > 0) {
            setLiveNews(function(prev) { return json.new_news.concat(prev).slice(0, 30); });
            setUnread(function(u) { return u + json.new_news.length; });
          }
        })
        .catch(function() {});
    }

    // Premier appel immédiat
    fetchAlerts();
    fetchAlertNews();
    fetchPositions();

    // Auto-load résumé post-market si on est après 16h30 CET
    if (isCETAfterKillzone()) {
      fetch('/api/postmarket')
        .then(function(r) { return r.json(); })
        .then(function(json) { setPmData(json); })
        .catch(function() {});
    }

    var alertTimer = setInterval(function() {
      alertTick--;
      newsTick--;
      posTick--;
      setCountdown(alertTick);
      // Expiration du test mode (via ref pour éviter stale closure)
      if (_testModeRef.active && _testModeRef.expiry && Date.now() >= _testModeRef.expiry) {
        _testModeRef.active = false;
        _testModeRef.expiry = null;
        setTestMode(false);
        setTestExpiry(null);
      }
      if (alertTick <= 0) {
        fetchAlerts(_testModeRef.active);
        alertTick = ALERT_INTERVAL;
      }
      if (newsTick <= 0) {
        fetchAlertNews();
        newsTick = NEWS_INTERVAL;
      }
      if (posTick <= 0) {
        if (_testModeRef.active || _kzRef.active) { fetchPositions(); }
        posTick = ALERT_INTERVAL;
      }
    }, 1000);

    return function() { clearInterval(clk); clearInterval(alertTimer); };
  }, []);

  function activateTestMode() {
    var expiry = Date.now() + 5 * 60 * 1000;   // 5 min
    _testModeRef.active = true;
    _testModeRef.expiry = expiry;
    setTestMode(true);
    setTestExpiry(expiry);
    fetch('/api/alerts?force=true')
      .then(function(r) { return r.json(); })
      .then(function(json) {
        setAlertData(function(prev) {
          var prevCount = (prev.alerts || []).length;
          var newCount  = (json.alerts || []).length;
          if (newCount > prevCount) { setUnread(function(u) { return u + (newCount - prevCount); }); }
          return json;
        });
      })
      .catch(function() {});
  }

  function handleRefresh() {
    if (loading) return;
    setRefreshMsg('scanning');
    fetch('/api/refresh', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        var dur = json.duration != null ? Math.round(json.duration) : '?';
        // Recharger chaque endpoint indépendamment
        var eps = ['market', 'tickers', 'reddit', 'news', 'macro', 'history'];
        eps.forEach(function(ep) {
          var ctrl = new AbortController();
          var tid  = setTimeout(function() { ctrl.abort(); }, 15000);
          fetch('/api/' + ep, { signal: ctrl.signal })
            .then(function(r) { return r.json(); })
            .then(function(edata) {
              clearTimeout(tid);
              setData(function(prev) { var n = Object.assign({}, prev); n[ep] = edata; return n; });
              setLastUpd(new Date());
            })
            .catch(function() { clearTimeout(tid); });
        });
        setRefreshMsg('done:' + dur + 's');
        setTimeout(function() { setRefreshMsg('idle'); }, 3000);
      })
      .catch(function() {
        setRefreshMsg('error');
        setTimeout(function() { setRefreshMsg('idle'); }, 3000);
      });
  }

  function loadPostmarket() {
    if (pmLoading) return;
    setPmLoading(true);
    fetch('/api/postmarket')
      .then(function(r) { return r.json(); })
      .then(function(json) { setPmData(json); setPmLoading(false); })
      .catch(function() { setPmLoading(false); });
  }

  function loadSetups() {
    if (setupsLoading) return;
    setSetupsLoading(true);
    fetch('/api/setups')
      .then(function(r) { return r.json(); })
      .then(function(json) { setSetupsData(json); setSetupsLoading(false); })
      .catch(function() { setSetupsLoading(false); });
  }

  function loadPositionMonitor() {
    fetch('/api/positions/monitor')
      .then(function(r) { return r.json(); })
      .then(function(json) { setPosMonitor(json); })
      .catch(function() {});
  }

  var fmtTime = function(d) { return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
  var fmtDate = function(d) { return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };

  var regime  = data.market ? data.market.regime  : null;
  var verdict = data.macro  ? data.macro.verdict   : null;
  var verdictCls = verdict === 'GO' ? 'b-bull' : verdict === 'NO TRADE' ? 'b-bear' : 'b-neutral';

  return (
    <div className="app">
      <header className="header">
        <div>
          <div className="header-title">SMC-AI MORNING BRIEF v2</div>
          <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{fmtDate(time)}</div>
        </div>
        <div className="header-right">
          {regime  && <span className={'rpill rp-' + regime}>{regime}</span>}
          {verdict && <span className={'badge ' + verdictCls}>{verdict}</span>}
          {testMode
            ? <span className="kz-live" style={{ background: 'rgba(249,115,22,.15)', color: '#f97316', borderColor: 'rgba(249,115,22,.4)' }}>🧪 TEST MODE</span>
            : alertData.in_killzone
              ? <span className="kz-live">🔴 LIVE 14h30-16h30</span>
              : <span className="kz-off">⏸️ Hors session</span>
          }
          <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--muted)' }}>{fmtTime(time)}</span>
          <button
            className={'btn btn-scan' + (loading ? ' is-scanning' : '')}
            onClick={handleRefresh}
            disabled={loading}
            style={refreshMsg === 'error' ? { color: '#ef4444', borderColor: '#ef4444' } : {}}
          >
            {loading
              ? <span><span className="spin-anim">⟳</span> Scan en cours...</span>
              : refreshMsg.startsWith('done:') ? ('✅ Scan terminé en ' + refreshMsg.slice(5))
              : refreshMsg === 'error' ? '❌ Erreur'
              : '🔄 Rafraîchir'}
          </button>
        </div>
      </header>

      <nav className="tabs" style={{ justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex' }}>
          {TABS.map(function(t) {
            return (
              <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')} onClick={function() {
                setTab(t.id);
                if (t.id === 'alerts') { setUnread(0); }
              }}>
                {t.label}
                {t.id === 'alerts' && unread > 0 && (
                  <span className="tab-badge">{unread > 9 ? '9+' : unread}</span>
                )}
              </button>
            );
          })}
        </div>
        {lastUpd && (
          <span className="mc" style={{ fontSize: 10, padding: '0 16px', flexShrink: 0 }}>
            Dernière MAJ : {lastUpd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
          </span>
        )}
      </nav>

      <main className="content">
        {tab === 'overview'  && <OverviewTab  data={data} postmarketData={pmData} pmLoading={pmLoading} onLoadPostmarket={loadPostmarket} setupsData={setupsData} onGoToSetups={function() { setTab('setups'); }} posMonitor={posMonitor} />}
        {tab === 'watchlist' && <WatchlistTab data={data} />}
        {tab === 'reddit'    && <RedditTab    data={data} />}
        {tab === 'news'      && <NewsTab      data={data} />}
        {tab === 'alerts'    && <AlertsTab alertData={alertData} liveNews={liveNews} countdown={(alertData.in_killzone || testMode) ? countdown : null} testMode={testMode} onSimulate={activateTestMode} posMonitor={posMonitor} />}
        {tab === 'setups'    && <SetupsTab    setupsData={setupsData} setupsLoading={setupsLoading} onScan={loadSetups} />}
        {tab === 'journal'   && <ErrorBoundary><JournalTab posMonitor={posMonitor} inKillzone={alertData.in_killzone || testMode} onRefreshPositions={loadPositionMonitor} /></ErrorBoundary>}
        {tab === 'history'   && <ErrorBoundary><PerformanceTab /></ErrorBoundary>}
      </main>
      <footer style={{ padding: '8px 24px', borderTop: '1px solid var(--border)', background: 'var(--card)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span className="mc" style={{ fontSize: 10 }}>Données live — Killzone 14h30-16h30 CET</span>
        <span className="mc" style={{ fontSize: 10 }}>SMC-AI Trading Agent v2</span>
      </footer>
    </div>
  );
}

// ── Rendu ─────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(TradingDashboard, null)
);
</script>
</body>
</html>
