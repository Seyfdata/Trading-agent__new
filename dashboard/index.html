    html.light body { background: #f0f4f8; color: #0f172a; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tabs { display: flex; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { padding: 10px 16px; cursor: pointer; border: none; background: transparent; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; border-bottom: 2px solid transparent; white-space: nowrap; }

    .tab:hover { color: var(--text); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card-sm { padding: 10px 14px; }
    /* Grid */
    .g5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
    .g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    /* Section title */
    .stitle { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }
    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .8px; }
    .b-bull    { background: rgba(16,185,129,.15); color: var(--bull);    border: 1px solid rgba(16,185,129,.3); }
    .b-bear    { background: rgba(239,68,68,.15);  color: var(--bear);    border: 1px solid rgba(239,68,68,.3); }
    .b-neutral { background: rgba(245,158,11,.15); color: var(--neutral); border: 1px solid rgba(245,158,11,.3); }
    .b-accent  { background: rgba(59,130,246,.15); color: var(--accent);  border: 1px solid rgba(59,130,246,.3); }
    .b-purple  { background: rgba(139,92,246,.15); color: var(--purple);  border: 1px solid rgba(139,92,246,.3); }
    .b-muted   { background: rgba(100,116,139,.1); color: var(--muted);   border: 1px solid rgba(100,116,139,.25); }
    /* Table */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 9px 12px; border-bottom: 1px solid rgba(30,41,59,.4); font-size: 12px; white-space: nowrap; }
    .tbl tbody tr:hover td { background: rgba(30,41,59,.4); }
    /* Score bar */
    .strack { height: 5px; background: rgba(30,41,59,.8); border-radius: 3px; overflow: hidden; flex: 1; }
    .sfill  { height: 100%; border-radius: 3px; }
    /* Button */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-p { background: rgba(59,130,246,.12); border-color: var(--accent); color: var(--accent); }
    /* Refresh button */
    .btn-scan { background: transparent; border-color: #334155; color: #94a3b8; transition: border-color .2s, color .2s; }

    /* TradingView link */

    /* Score cell with bg bar */

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        style: { padding: 24, background: '#1a0000', border: '1px solid #ef4444', borderRadius: 8, color: '#ef4444', fontFamily: 'monospace', fontSize: 12 }
      }, 'ERREUR COMPOSANT: ' + (this.state.error && this.state.error.message ? this.state.error.message : String(this.state.error)));
    }
    return this.props.children;
  }
}

// ── Utilitaires ───────────────────────────────────────────────────────────

const fmt    = function(n, d) { d = d == null ? 2 : d; return n != null ? Number(n).toFixed(d) : '—'; };
const fmtPct = function(n) { return n != null ? (n > 0 ? '+' : '') + fmt(n) + '%' : '—'; };
const chgClr = function(n) { return n > 0 ? '#10b981' : n < 0 ? '#ef4444' : '#64748b'; };
const sntClr = function(s) { return s === 'BULL' ? '#10b981' : s === 'BEAR' ? '#ef4444' : '#f59e0b'; };
const scrClr = function(s) { return s >= 70 ? '#10b981' : s >= 50 ? '#3b82f6' : s >= 30 ? '#f59e0b' : '#ef4444'; };

const CHART_COLORS = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444'];
const RANK_COLORS  = { 1: '#3b82f6', 2: '#8b5cf6', 3: '#10b981' };
const STYLE_COLORS = { SWING: '#3b82f6', PUMP: '#ef4444', MIXED: '#f59e0b', DAY: '#8b5cf6' };

function isCETAfterKillzone() {
  try {
    var d = new Date();
    var formatter = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', hour12: false });
    var parts = formatter.formatToParts(d);
    var h = parseInt(parts.find(function(p) { return p.type === 'hour';   }).value, 10);
    var m = parseInt(parts.find(function(p) { return p.type === 'minute'; }).value, 10);
    return h * 60 + m >= 16 * 60 + 30;
  } catch(e) { return false; }
}

// ── Composants de base ────────────────────────────────────────────────────

function ScoreBar(props) {
  var val = props.val || 0;
  var max = props.max || 25;
  var color = props.color || '#3b82f6';
  return React.createElement('div', { className: 'strack' },
    React.createElement('div', { className: 'sfill', style: { width: (val / max * 100) + '%', background: color } })
  );
}

// ── Instrument Card ───────────────────────────────────────────────────────

function InstrumentCard(props) {
  var name = props.name;
  var data = props.data || {};
  var price = data.price;
  var chg   = data.change;
  var color = chgClr(chg);
  var arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '—';
  return (
    <div className="card card-sm">
      <div className="inst-name">{name}</div>
      <div className="inst-price" style={{ color: price != null ? 'var(--text)' : 'var(--muted)' }}>
        {price != null ? fmt(price) : '—'}
      </div>
      <div className="inst-chg" style={{ color: color }}>
        {price != null ? arrow + ' ' + fmtPct(chg) : 'N/A'}
      </div>
    </div>
  );
}

// ── Barre régime + verdict ────────────────────────────────────────────────

function RegimeBar(props) {
  var market = props.market || {};
  var macro  = props.macro  || {};
  var regime  = market.regime;
  var score   = market.score;
  var sizing  = market.sizing_recommendation;
  var verdict = macro.verdict;
  var events  = macro.events || [];
  var earnings = macro.earnings_today || [];

  var verdictCls = verdict === 'GO' ? 'b-bull' : verdict === 'NO TRADE' ? 'b-bear' : 'b-neutral';

  return (
    <div className="card mb16 row wrap g12" style={{ padding: '10px 16px' }}>
      {regime && (
        <div className="row g8">
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>RÉGIME</span>
          <span className={'rpill rp-' + regime}>{regime}</span>
          {score != null && <span style={{ fontWeight: 700, color: sntClr(regime) }}>{score}/100</span>}
        </div>
      )}
      {sizing && (
        <div className="row g8">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>SIZING</span>
          <span style={{ fontWeight: 700 }}>{sizing}</span>
        </div>
      )}
      {verdict && (
        <div className="row g8">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>VERDICT</span>
          <span className={'badge ' + verdictCls}>{verdict}</span>
          {macro.risque && <span className="mc" style={{ fontSize: 10 }}>{macro.risque}</span>}
        </div>
      )}
      {events.length > 0 && (
        <div className="row g6 wrap">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>EVENTS</span>
          {events.map(function(e, i) {
            return <span key={i} className={'badge ' + (e.impact === 'FORT' ? 'b-bear' : 'b-neutral')}>{e.name}</span>;
          })}
        </div>
      )}
      {earnings.length > 0 && (
        <div className="row g6 wrap">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>EARNINGS</span>
          {earnings.map(function(t) { return <span key={t} className="badge b-bear">{t}</span>; })}
        </div>
      )}
    </div>
  );
}

// ── SHAP-style Score Breakdown ────────────────────────────────────────────

function ShapBar(props) {
  var label    = props.label;
  var score    = props.score != null ? props.score : 0;
  var baseline = props.baseline != null ? props.baseline : 12.5;
  var maxDev   = props.maxDev   != null ? props.maxDev   : 12.5;
  var isKey    = props.isKey;
  var dev      = score - baseline;
  var pct      = Math.min(Math.abs(dev) / maxDev * 50, 50);
  var barColor = dev >= 0 ? '#10b981' : '#ef4444';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
      <div style={{ width: 72, fontSize: 10, color: 'var(--muted)', textAlign: 'right', flexShrink: 0 }}>{label}</div>
      <div style={{ flex: 1, position: 'relative', height: 8 }}>
        <div style={{ position: 'absolute', left: '50%', top: 0, bottom: 0, width: 1, background: 'rgba(100,116,139,0.25)' }} />
        {dev >= 0
          ? <div style={{ position: 'absolute', left: '50%', top: 0, height: 8, width: pct + '%', background: barColor, borderRadius: '0 4px 4px 0', opacity: 0.85 }} />
          : <div style={{ position: 'absolute', right: '50%', top: 0, height: 8, width: pct + '%', background: barColor, borderRadius: '4px 0 0 4px', opacity: 0.85 }} />
        }
      </div>
      <div style={{ width: 30, fontSize: 11, fontWeight: 700, color: barColor, textAlign: 'right', flexShrink: 0 }}>{score}</div>
      <div style={{ width: 14, flexShrink: 0 }}>{isKey && <span title="Key Driver" style={{ fontSize: 11 }}>🔑</span>}</div>
    </div>
  );
}

function ShapScoreBreakdown(props) {
  var t = props.ticker;
  var comps = [
    { label: 'SMA200', score: t.sma200_score || 0 },
    { label: 'Volume', score: t.volume_score  || 0 },
    { label: 'Reddit', score: t.reddit_score  || 0 },
    { label: 'News',   score: t.news_score    || 0 },
  ];
  var maxScore  = Math.max.apply(null, comps.map(function(c) { return c.score; }));
  var hasCross  = t.cross_validation_score != null;
  return (
    <div>
      <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, marginBottom: 8 }}>
        SHAP — CONTRIBUTION / 25 <span style={{ opacity: 0.5, marginLeft: 4 }}>baseline 12.5</span>
      </div>
      {comps.map(function(c) {
        return <ShapBar key={c.label} label={c.label} score={c.score} isKey={c.score === maxScore} />;
      })}
      {hasCross && (
        <div style={{ marginTop: 6, borderTop: '1px solid rgba(100,116,139,0.2)', paddingTop: 6 }}>
          <ShapBar label="Cross-val" score={t.cross_validation_score} baseline={0} maxDev={10}
            isKey={false} />
          <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 2, paddingLeft: 80 }}>
            fiabilité du signal — échelle –10 / +10
          </div>
        </div>
      )}
    </div>
  );
}

// ── Top 3 ─────────────────────────────────────────────────────────────────

function Top3Section(props) {
  var tickers = props.tickers || [];
  var top3 = tickers.filter(function(t) { return t.top3; });
  if (!top3.length) return <div className="error-box mc">Pas encore de scores calculés</div>;

  return (
    <div className="g3 mb16">
      {top3.map(function(t) {
        var color = RANK_COLORS[t.rank] || '#64748b';
        var m = t.market || {};
        return (
          <div key={t.ticker} className={'t3card r' + t.rank}>
            <div className="t3bg">#{t.rank}</div>
            <div className="rowb mb12">
              <div>
                <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                   className="tv-link t3ticker" style={{ color: color }}>
                  {t.ticker} 📈
                </a>
                <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 3 }}>
                  {m.price != null ? '$' + fmt(m.price) : ''}
                  {m.change_day != null && (
                    <span style={{ color: chgClr(m.change_day), marginLeft: 6 }}>{fmtPct(m.change_day)}</span>
                  )}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="t3score" style={{ color: color }}>{Math.round(t.total_score || 0)}</div>
                <div className="t3lbl">/ 100</div>
              </div>
            </div>
            {(function() {
              var comps = [
                { label: 'SMA200', score: t.sma200_score || 0 },
                { label: 'Volume', score: t.volume_score  || 0 },
                { label: 'Reddit', score: t.reddit_score  || 0 },
                { label: 'News',   score: t.news_score    || 0 },
              ].sort(function(a, b) { return b.score - a.score; });
              var volStr = (comps[0].label === 'Volume' || comps[1].label === 'Volume') && m.vol_relative
                ? function(c) { return c.label === 'Volume' ? 'Volume ×' + fmt(m.vol_relative, 1) : c.label + ' ' + c.score + '/25'; }
                : function(c) { return c.label + ' ' + c.score + '/25'; };
              return (
                <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 10, lineHeight: 1.5 }}>
                  <span style={{ color: '#f59e0b', marginRight: 4 }}>🔑</span>
                  <span style={{ color: 'var(--text)' }}>{volStr(comps[0])}</span>
                  <span style={{ margin: '0 4px', opacity: 0.4 }}>·</span>
                  <span style={{ color: 'var(--text)' }}>{volStr(comps[1])}</span>
                </div>
              );
            })()}
            <div className="row g6 wrap">
              {m.dist_sma200 != null && (
                <span className={'badge ' + (m.dist_sma200 < 0 ? 'b-bull' : 'b-accent')}>
                  SMA200 {fmtPct(m.dist_sma200)}
                </span>
              )}
              {m.vol_relative != null && m.vol_relative >= 1.5 && (
                <span className="badge b-purple">VOL ×{fmt(m.vol_relative, 1)}</span>
              )}
              {t.reddit && t.reddit.mentions > 4 && (
                <span className="badge b-accent">Reddit ×{t.reddit.mentions}</span>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

    return (
      <div className="card" style={{ marginTop: 16, textAlign: 'center', padding: 24 }}>
        <span className="mc" style={{ fontSize: 12 }}>Chargement du résumé du jour...</span>
      </div>
    );
  }

  if (postmarketData && postmarketData.error) {
    return (
      <div className="card" style={{ marginTop: 16 }}>
        <div className="stitle">RÉSUMÉ DU JOUR</div>
        <div className="mc" style={{ fontSize: 11 }}>Données indisponibles — {postmarketData.error}</div>
      </div>
    );
  }

  var gainers = (postmarketData && postmarketData.top_gainers) || [];
  var losers  = (postmarketData && postmarketData.top_losers)  || [];
  var mc      = (postmarketData && postmarketData.market_close) || {};
  var kzCount = (postmarketData && postmarketData.killzone_alerts_count) || 0;

  function MoverRow(mp) {
    var item  = mp.item;
    var bull  = mp.bull;
    var color = bull ? 'var(--bull)' : 'var(--bear)';
    var sign  = item.change_pct >= 0 ? '+' : '';
    return (
      <div className="rowb" style={{ padding: '6px 0', borderBottom: '1px solid rgba(30,41,59,.3)' }}>
        <div className="row g8">
          <a href={'https://www.tradingview.com/chart/?symbol=' + item.ticker} target="_blank" rel="noopener"
             className="tv-link" style={{ color: color, fontWeight: 700, minWidth: 44 }}>
            {item.ticker}
          </a>
          <span style={{ color: color, fontWeight: 600 }}>{sign}{fmt(item.change_pct)}%</span>
        </div>
        <span className="mc" style={{ fontSize: 11 }}>Vol ×{fmt(item.vol_ratio, 1)}</span>
      </div>
    );
  }

  return (
    <div className="card" style={{ marginTop: 16 }}>
      <div className="rowb mb12">
        <div className="stitle" style={{ marginBottom: 0 }}>📊 RÉSUMÉ DU JOUR</div>
        {kzCount > 0 && (
          <span className="badge b-bear" style={{ fontSize: 10 }}>⚡ {kzCount} alerte{kzCount > 1 ? 's' : ''} session</span>
        )}
      </div>
      <div className="g2" style={{ marginBottom: 12 }}>
        <div>
          <div style={{ fontSize: 10, color: 'var(--bull)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 6, fontWeight: 700 }}>🟢 TOP GAINS</div>
          {gainers.length > 0
            ? gainers.map(function(g) { return <MoverRow key={g.ticker} item={g} bull={true} />; })
            : <div className="mc" style={{ fontSize: 11 }}>—</div>}
        </div>
        <div>
          <div style={{ fontSize: 10, color: 'var(--bear)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 6, fontWeight: 700 }}>🔴 TOP PERTES</div>
          {losers.length > 0
            ? losers.map(function(l) { return <MoverRow key={l.ticker} item={l} bull={false} />; })
            : <div className="mc" style={{ fontSize: 11 }}>—</div>}
        </div>
      </div>
      {Object.keys(mc).length > 0 && (
        <div style={{ padding: '8px 12px', background: 'rgba(0,0,0,.2)', borderRadius: 6, border: '1px solid rgba(30,41,59,.5)' }}>
          <div className="row g12 wrap">
            {mc.spy && <span><span className="mc" style={{ fontSize: 10 }}>SPY </span><span style={{ color: chgClr(mc.spy.change_pct), fontWeight: 600 }}>{mc.spy.change_pct >= 0 ? '+' : ''}{fmt(mc.spy.change_pct)}%</span></span>}
            {mc.qqq && <span><span className="mc" style={{ fontSize: 10 }}>QQQ </span><span style={{ color: chgClr(mc.qqq.change_pct), fontWeight: 600 }}>{mc.qqq.change_pct >= 0 ? '+' : ''}{fmt(mc.qqq.change_pct)}%</span></span>}
            {mc.vix && <span><span className="mc" style={{ fontSize: 10 }}>VIX </span><span style={{ fontWeight: 600 }}>{fmt(mc.vix.price)}</span><span style={{ color: chgClr(mc.vix.change_pct), fontSize: 11 }}> ({mc.vix.change_pct >= 0 ? '+' : ''}{fmt(mc.vix.change_pct)}%)</span></span>}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Overview Tab ──────────────────────────────────────────────────────────

function MacroIndicatorsSection(props) {
  var indicators = props.indicators || [];
  if (indicators.length === 0) return null;
  return (
    <div style={{ marginBottom: 16 }}>
      <div className="stitle">INDICATEURS MACRO</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
        {indicators.map(function(ind) {
          var chg   = ind.change_pct;
          var color = chgClr(chg);
          var arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '—';
          return (
            <div key={ind.symbol} className="card" style={{ padding: '8px 12px' }}>
              <div style={{ fontSize: 9, color: 'var(--muted)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 3 }}>
                {ind.name}
              </div>
              <div style={{ fontSize: 16, fontWeight: 700, color: ind.price != null ? 'var(--text)' : 'var(--muted)' }}>
                {ind.price != null ? fmt(ind.price) : '—'}
              </div>
              <div style={{ fontSize: 11, color: color, marginTop: 2 }}>
                {ind.price != null ? arrow + ' ' + fmtPct(chg) : 'N/A'}

            </div>
          );
        })}
      </div>
    </div>
  );
}

function OverviewTab(props) {
  var data             = props.data;
  var postmarketData   = props.postmarketData;
  var pmLoading        = props.pmLoading;
  var onLoadPostmarket = props.onLoadPostmarket || function() {};
  var setupsData       = props.setupsData;
  var onGoToSetups     = props.onGoToSetups     || function() {};
  var posMonitor       = props.posMonitor        || { positions: [], count: 0 };
  var tradesProgress   = props.tradesProgress    || { total_closed: 0, target: 50, progress_pct: 0, next_milestone: 10, milestone_message: '' };
  var scanResults      = props.scanResults       || [];
  var onGoToSmc        = props.onGoToSmc         || function() {};
  var onGoToReddit     = props.onGoToReddit      || function() {};
  var inst = (data.market && data.market.instruments) ? data.market.instruments : {};
  var macroInds = (data.market && data.market.macro_indicators) ? data.market.macro_indicators : [];
  var redditItems = (data.reddit && data.reddit.data) ? data.reddit.data.filter(function(r) { return r.in_watchlist; }).slice(0, 5) : [];
  // Trouvailles Reddit : tickers hors watchlist vérifiés ≥ 3 mentions
  var discItems = (data.reddit && data.reddit.data) ?
    data.reddit.data.filter(function(r) { return !r.in_watchlist && r.mentions >= 3 && r.verified; })
    .sort(function(a, b) { return b.mentions - a.mentions; }).slice(0, 5) : [];
  var newsItems = data.news ? [].concat(data.news.ticker_news || [], data.news.market_news || []).slice(0, 5) : [];
  var onGoToProposals = props.onGoToProposals || function() {};

  var qpState = useState({ data: null, loading: false, error: null });
  var qp = qpState[0]; var setQp = qpState[1];

  useEffect(function() {
    setQp(function(prev) { return Object.assign({}, prev, { loading: true, error: null }); });
    fetch('/api/proposals?capital=10000')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var top = d.proposals && d.proposals.length > 0 ? d.proposals[0] : null;
        setQp({ data: top, loading: false, error: null });
      })
      .catch(function() { setQp({ data: null, loading: false, error: true }); });
  }, []);

  var qpTop     = qp.data;
  var qpLoading = qp.loading;
  var qpError   = qp.error;

  return (
    <div>
      {qpLoading && (
        <div className="card mb16" style={{ padding: '14px 18px', borderLeft: '4px solid var(--accent)' }}>
          <div className="row g8">
            <span className="spin-anim">⟳</span>
            <span style={{ fontSize: 12, color: 'var(--muted)' }}>Calcul de la proposition du jour...</span>
          </div>
        </div>
      )}
      {!qpLoading && qpError && (
        <div className="card mb16" style={{ padding: '12px 16px', borderLeft: '4px solid var(--border)' }}>
          <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 8 }}>Lance une analyse pour voir la meilleure opportunite du jour</div>
          <button className="btn btn-p" style={{ fontSize: 11 }} onClick={onGoToProposals}>Propositions</button>
        </div>
      )}
      {!qpLoading && qpTop && (
        <div className="card mb16" style={{ borderLeft: '4px solid var(--accent)', padding: '16px 20px' }}>
          <div className="rowb" style={{ marginBottom: 10 }}>
            <div className="row g8">
              <span style={{ fontWeight: 700, fontSize: 13 }}>PROPOSITION DU JOUR</span>
              <span style={{ fontSize: 11, fontWeight: 700, color: _gradeColor(qpTop.grade), background: _gradeColor(qpTop.grade) + '18', padding: '2px 8px', borderRadius: 4 }}>{qpTop.grade}</span>
            </div>
            <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={onGoToProposals}>Voir toutes</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 24px', fontSize: 13, marginBottom: 8 }}>
            <div><div className="mc" style={{ fontSize: 10 }}>Ticker</div><div style={{ fontWeight: 700, fontSize: 22, color: 'var(--accent)' }}>{qpTop.ticker}</div></div>
            <div><div className="mc" style={{ fontSize: 10 }}>R:R</div><div style={{ fontWeight: 700, fontSize: 20, color: 'var(--bull)' }}>{qpTop.rr_ratio}x</div></div>
            <div><div className="mc" style={{ fontSize: 10 }}>Entree</div><div style={{ fontWeight: 600 }}>${qpTop.entry}</div></div>
            <div><div className="mc" style={{ fontSize: 10 }}>Stop loss</div><div style={{ fontWeight: 600, color: 'var(--bear)' }}>${qpTop.stop}</div></div>
            <div><div className="mc" style={{ fontSize: 10 }}>Cible TP2</div><div style={{ fontWeight: 600, color: 'var(--bull)' }}>${qpTop.tp2}</div></div>
            <div><div className="mc" style={{ fontSize: 10 }}>Quantite</div><div style={{ fontWeight: 600 }}>{qpTop.shares} actions</div></div>
          </div>
          {qpTop.reason && (
            <div className="mc" style={{ fontSize: 11, paddingTop: 8, borderTop: '1px solid var(--border)' }}>{qpTop.reason}</div>
          )}
        </div>
      )}
      <div className="stitle">INDICATEURS MARCHE</div>
      <div className="g5 mb16">
        <InstrumentCard name="S&amp;P 500"    data={inst.spy}   />
        <InstrumentCard name="NASDAQ 100"     data={inst.qqq}   />
        <InstrumentCard name="VIX"            data={inst.vix}   />
        <InstrumentCard name="DOLLAR (DXY)"   data={inst.dxy}   />
        <InstrumentCard name="US 10Y YIELD"   data={inst.us10y} />
      </div>

      <MacroIndicatorsSection indicators={macroInds} />

      <RegimeBar market={data.market} macro={data.macro} />

      <div className="stitle">TOP 3 DU JOUR</div>
      <Top3Section tickers={data.tickers ? data.tickers.tickers : []} />

      {scanResults.length > 0 && (
        <div className="card mb16" style={{ padding: '10px 16px' }}>
          <div className="rowb" style={{ marginBottom: 8 }}>
            <div className="row g8">
              <span className="stitle" style={{ marginBottom: 0 }}>🧠 TOP SETUPS (SCORE UNIFIÉ)</span>
              <span className="badge b-accent">{scanResults.length}</span>
            </div>
            <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={onGoToSmc}>
              Voir analyse →
            </button>
          </div>
          {scanResults.slice(0, 3).map(function(r, i) {
            var gc = _gradeColor(r.grade);
            return (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '5px 0', borderBottom: i < 2 && i < scanResults.slice(0,3).length - 1 ? '1px solid rgba(30,41,59,.3)' : 'none' }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <span style={{ fontWeight: 700, minWidth: 48 }}>{r.ticker}</span>
                  <span style={{ fontSize: 10, fontWeight: 700, color: gc, background: gc + '15', padding: '1px 6px', borderRadius: 3, border: '1px solid ' + gc + '30', boxShadow: r.grade === 'A+' ? '0 0 6px ' + gc + '40' : 'none' }}>{r.grade}</span>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, color: gc }}>{r.unified_score}/10</span>
              </div>
            );
          })}
        </div>
      )}

      {posMonitor.positions && posMonitor.positions.length > 0 && (
        <div className="card mb16" style={{ padding: '10px 16px' }}>
          <div className="rowb mb8">
            <div className="row g8">
              <span className="stitle" style={{ marginBottom: 0 }}>📊 POSITIONS OUVERTES</span>
              <span className="badge b-accent">{posMonitor.count || posMonitor.positions.length}</span>
            </div>
            {posMonitor.checked_at && (
              <span className="mc" style={{ fontSize: 10 }}>Vérif: {posMonitor.checked_at}</span>
            )}
          </div>
          {posMonitor.positions.map(function(p) {
            var pnlColor = p.pnl_latent >= 0 ? 'var(--bull)' : 'var(--bear)';
            var pnlStr   = (p.pnl_latent >= 0 ? '+' : '') + '$' + Math.abs(p.pnl_latent).toFixed(0);
            var rStr     = (p.r_current >= 0 ? '+' : '') + p.r_current.toFixed(1) + 'R';
            var alertBadge = null;
            if (p.status_alert === 'TARGET_HIT')  { alertBadge = { cls: 'b-bull', txt: '🎯 TARGET' }; }
            if (p.status_alert === 'STOP_HIT')    { alertBadge = { cls: 'b-bear', txt: '🛑 STOP' }; }
            if (p.status_alert === 'NEAR_TARGET') { alertBadge = { cls: 'b-neutral', txt: '↗ TARGET' }; }
            if (p.status_alert === 'NEAR_STOP')   { alertBadge = { cls: 'b-neutral', txt: '↘ STOP' }; }
            return (
              <div key={p.id} className="rowb" style={{ padding: '5px 0', borderBottom: '1px solid rgba(30,41,59,.3)' }}>
                <div className="row g8">
                  <span style={{ fontWeight: 700, minWidth: 48 }}>{p.ticker}</span>
                  {alertBadge && <span className={'badge ' + alertBadge.cls} style={{ fontSize: 9 }}>{alertBadge.txt}</span>}
                </div>
                <span style={{ fontWeight: 700, color: pnlColor, fontSize: 12 }}>{rStr} ({pnlStr})</span>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Compteur 50 trades ── */}
      {(function() {
        var tc  = tradesProgress.total_closed;
        var pct = tradesProgress.progress_pct;
        var barColor = tc >= 50 ? '#10b981' : tc >= 20 ? '#3b82f6' : tc >= 10 ? '#f59e0b' : '#ef4444';
        var STEPS = [
          { n: 10, label: 'Sharpe' },
          { n: 20, label: 'Monte Carlo' },
          { n: 50, label: 'Stats fiables' },
        ];
        return (
          <div className="card mb16" style={{ padding: '10px 16px' }}>
            <div className="rowb mb6">
              <span className="stitle" style={{ marginBottom: 0 }}>🎯 PROGRESSION</span>
              <span style={{ fontSize: 11, color: 'var(--muted)' }}>{tc}/{tradesProgress.target} trades clôturés</span>
            </div>
            <div style={{ background: 'rgba(30,41,59,.6)', borderRadius: 4, height: 6, marginBottom: 8, overflow: 'hidden' }}>
              <div style={{ width: pct + '%', height: '100%', background: barColor, borderRadius: 4, transition: 'width .4s ease' }} />
            </div>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 8 }}>{tradesProgress.milestone_message}</div>
            <div style={{ display: 'flex', gap: 10 }}>
              {STEPS.map(function(s) {
                var done = tc >= s.n;
                return (
                  <div key={s.n} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 10, color: done ? '#10b981' : 'var(--muted)' }}>
                    <span>{done ? '✅' : '🔲'}</span>
                    <span>{s.n} ({s.label})</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {discItems.length > 0 && (
        <div className="card mb16" style={{ padding: '10px 16px' }}>
          <div className="rowb mb8">
            <span className="stitle" style={{ marginBottom: 0 }}>🔍 Trouvailles Reddit</span>
            <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={onGoToReddit}>
              Voir détails →
            </button>
          </div>
          <div className="mc" style={{ fontSize: 11 }}>
            {discItems.map(function(d, i) {
              return <span key={d.ticker}>{i > 0 ? '  ·  ' : ''}<span style={{ fontWeight: 600, color: 'var(--text)' }}>{d.ticker}</span> ({d.mentions} ment.)</span>;
            })}
          </div>
        </div>
      )}

      <div className="g2">
        <div>
          <div className="stitle">REDDIT BUZZ (watchlist)</div>
          <div className="card">
            {redditItems.map(function(r) {
              return (
                <div key={r.ticker} className="rowb" style={{ padding: '7px 0', borderBottom: '1px solid rgba(30,41,59,.35)' }}>
                  <div className="row g8">
                    <span style={{ fontWeight: 700, width: 48 }}>{r.ticker}</span>
                    <span className="mc" style={{ fontSize: 11 }}>{r.mentions} mentions</span>
                  </div>
                  <span className={'badge ' + (r.sentiment_label === 'BULL' ? 'b-bull' : r.sentiment_label === 'BEAR' ? 'b-bear' : 'b-neutral')}>{r.sentiment_label}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div className="stitle">NEWS RÉCENTES</div>
          <div className="card">
            {newsItems.map(function(n, i) {
              return (
                <div key={i} style={{ padding: '7px 0', borderBottom: '1px solid rgba(30,41,59,.35)' }}>
                  <div className="row g6 mb8" style={{ alignItems: 'flex-start' }}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: sntClr(n.sentiment), flexShrink: 0, marginTop: 3 }} />
                    <span style={{ fontSize: 11, lineHeight: 1.5 }}>{n.title}</span>
                  </div>
                  <div className="row g6" style={{ paddingLeft: 14 }}>
                    <span className="mc" style={{ fontSize: 10 }}>{n.source}</span>
                    {(n.matched_tickers || []).slice(0, 2).map(function(t) {
                      return <span key={t} className="badge b-accent" style={{ fontSize: 9, padding: '1px 5px' }}>{t}</span>;
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <PostMarketSection postmarketData={postmarketData} pmLoading={pmLoading} onLoadPostmarket={onLoadPostmarket} />
    </div>
  );
}

// ── Propositions Tab ──────────────────────────────────────────────────────

function PropositionsTab(props) {
  var onGoToSmc     = props.onGoToSmc     || function() {};
  var onGoToJournal = props.onGoToJournal || function() {};

  var capState = useState(10000);
  var capital  = capState[0]; var setCapital = capState[1];

  var dataState = useState(null);
  var propData  = dataState[0]; var setPropData = dataState[1];

  var loadState = useState(false);
  var loading   = loadState[0]; var setLoading = loadState[1];

  function loadProposals() {
    setLoading(true);
    fetch('/api/proposals?capital=' + capital)
      .then(function(r) { return r.json(); })
      .then(function(d) { setPropData(d); setLoading(false); })
      .catch(function() { setLoading(false); });
  }

  function gradeFromStars(s) {
    return ['', 'C', 'C+', 'B', 'A', 'A+'][s] || 'B';
  }
  function starColor(s) {
    return s >= 4 ? '#10b981' : s >= 3 ? '#f59e0b' : '#ef4444';
  }
  function pbLabel(status) {
    return status === 'alert' ? '📉 Pullback fort' : status === 'watch' ? '👀 Pullback léger' : '';
  }

  var proposals = propData && propData.proposals ? propData.proposals : [];
  var regime    = propData ? propData.regime : null;

  return (
    <div>
      {/* Header */}
      <div className="card mb16" style={{ padding: '14px 18px' }}>
        <div className="rowb" style={{ marginBottom: 8 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>🎯 Propositions de Trade</div>
            <div className="mc" style={{ fontSize: 11 }}>Convergence score + pullback + momentum — jusqu'à 3 opportunités actionnables. L'humain décide toujours.</div>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0 }}>
            <span className="mc" style={{ fontSize: 11 }}>Capital $</span>
            <input
              type="number"
              value={capital}
              onChange={function(e) { setCapital(Number(e.target.value)); }}
              style={{ width: 90, background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 6, padding: '5px 8px', color: 'var(--text)', fontFamily: 'inherit', fontSize: 12 }} />
            <button className={'btn' + (loading ? '' : ' btn-p')} onClick={loadProposals} disabled={loading}>
              {loading ? <span><span className="spin-anim">⟳</span> Analyse...</span> : '🔍 Analyser'}
            </button>
          </div>
        </div>
        <div style={{ fontSize: 10, color: 'var(--muted)', borderTop: '1px solid var(--border)', paddingTop: 8 }}>
          ⚠️ Ces propositions sont indicatives — pas des conseils financiers. Le trading comporte des risques de perte en capital.
        </div>
      </div>

      {/* État initial */}
      {!propData && !loading && (
        <div className="card" style={{ textAlign: 'center', padding: 48 }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>🎯</div>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Aucune analyse effectuée</div>
          <div className="mc" style={{ fontSize: 11, marginBottom: 4 }}>Entre ton capital puis clique "Analyser".</div>
          <div className="mc" style={{ fontSize: 11 }}>L'outil croise : score composite, pullback, RSI, MACD, SMA200.</div>
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="card" style={{ textAlign: 'center', padding: 48 }}>
          <div className="spin-anim" style={{ display: 'inline-block', fontSize: 32, marginBottom: 12 }}>⟳</div>
          <div className="mc" style={{ fontSize: 12 }}>Calcul des propositions...</div>
          <div className="mc" style={{ fontSize: 11, marginTop: 4 }}>Analyse des 22 tickers en cours.</div>
        </div>
      )}

      {/* Régime BEAR */}
      {propData && regime === 'BEAR' && (
        <div className="card" style={{ textAlign: 'center', padding: 40, borderLeft: '3px solid #ef4444' }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>🚫</div>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 6 }}>Régime BEAR — Aucun trade LONG recommandé</div>
          <div className="mc" style={{ fontSize: 12 }}>{propData.message}</div>
        </div>
      )}

      {/* Cartes de trade */}
      {proposals.map(function(p, idx) {
        var col   = starColor(p.stars);
        var grade = gradeFromStars(p.stars);
        var rr_tp1 = p.entry ? ((p.tp1 - p.entry) / (p.entry - p.stop_loss)).toFixed(1) : '1.5';
        return (
          <div key={p.ticker} className="card mb16" style={{ borderLeft: '3px solid ' + col }}>
            {/* Titre */}
            <div className="rowb" style={{ marginBottom: 12 }}>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: 22, fontWeight: 800, color: col }}>{p.ticker}</span>
                <span style={{ fontSize: 13 }}>{'⭐'.repeat(p.stars) + '☆'.repeat(5 - p.stars)}</span>
                <span style={{ fontSize: 11, background: col + '22', color: col, borderRadius: 4, padding: '2px 8px', fontWeight: 700 }}>Grade {grade}</span>
                {pbLabel(p.pb_status) && <span style={{ fontSize: 10, background: 'rgba(99,102,241,.15)', color: '#818cf8', borderRadius: 4, padding: '2px 8px' }}>{pbLabel(p.pb_status)}</span>}
                <span className="mc" style={{ fontSize: 10 }}>Score {p.score}/100</span>
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="btn" style={{ fontSize: 11 }} onClick={function() { onGoToSmc(p.ticker); }}>🧠 SMC</button>
                <a href={'https://www.tradingview.com/chart/?symbol=' + p.ticker} target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>
                  <button className="btn" style={{ fontSize: 11 }}>📈 TV</button>
                </a>
              </div>
            </div>

            {/* Explication */}
            <div style={{ fontSize: 12, lineHeight: 1.7, padding: '8px 12px', background: 'rgba(99,102,241,.07)', borderRadius: 6, marginBottom: 14 }}>
              💡 {p.explanation}
            </div>

            {/* Niveaux */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 12 }}>
              {[
                { label: 'ENTRÉE',          val: '$' + p.entry,     sub: null,                     highlight: false },
                { label: 'STOP LOSS',       val: '$' + p.stop_loss, sub: '–' + p.risk_pct + '%',   highlight: false, danger: true },
                { label: 'TP1  (1:' + rr_tp1 + ')', val: '$' + p.tp1, sub: null,                  highlight: false, green: true },
                { label: 'TP2  (1:2.5) ✅', val: '$' + p.tp2,      sub: null,                     highlight: true,  green: true },
              ].map(function(cell) {
                return (
                  <div key={cell.label} style={{ textAlign: 'center', padding: '10px 6px', background: 'var(--bg)', borderRadius: 6, border: cell.highlight ? '1px solid #10b98144' : 'none' }}>
                    <div style={{ fontSize: 9, color: 'var(--muted)', marginBottom: 4, letterSpacing: .5 }}>{cell.label}</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: cell.danger ? '#ef4444' : cell.green ? '#10b981' : 'var(--text)' }}>{cell.val}</div>
                    {cell.sub && <div style={{ fontSize: 9, color: '#ef4444' }}>{cell.sub}</div>}
                  </div>
                );
              })}
            </div>

            {/* Position sizing */}
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', padding: '8px 12px', background: 'var(--bg)', borderRadius: 6, marginBottom: 12, fontSize: 12 }}>
              <span>💰 Capital {Number(p.entry > 0 ? (propData.capital || 10000) : 10000).toLocaleString('fr-FR')} $</span>
              <span style={{ color: 'var(--muted)' }}>→</span>
              <span style={{ fontWeight: 700 }}>{p.shares} actions</span>
              <span style={{ color: 'var(--muted)' }}>→ Risque max :</span>
              <span style={{ fontWeight: 700, color: '#ef4444' }}>{p.total_risk_usd} $ (1%)</span>
            </div>

            {/* Règles */}
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {p.rules && [
                { key: 'regime_ok',    label: 'Régime OK' },
                { key: 'above_sma200', label: 'Au-dessus SMA200' },
                { key: 'rr_ok',        label: 'R:R ≥ 2.5' },
              ].map(function(rule) {
                var ok = p.rules[rule.key];
                return (
                  <span key={rule.key} style={{ fontSize: 10, padding: '2px 8px', borderRadius: 4, background: ok ? '#10b98120' : '#ef444420', color: ok ? '#10b981' : '#ef4444' }}>
                    {ok ? '✅' : '⚠️'} {rule.label}
                  </span>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Aucun setup */}
      {propData && !loading && proposals.length === 0 && regime !== 'BEAR' && (
        <div className="card" style={{ textAlign: 'center', padding: 48 }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>🧘</div>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Aucune opportunité convaincante</div>
          <div className="mc" style={{ fontSize: 12 }}>Pas de trade = pas de perte. Patience = edge.</div>
        </div>
      )}
    </div>
  );
}

// ── Watchlist Tab ─────────────────────────────────────────────────────────

function WatchlistTab(props) {
  var onGoToSmc = props.onGoToSmc || function() {};
  var tickers = (props.data.tickers && props.data.tickers.tickers) ? props.data.tickers.tickers : [];
  var expanded = useState(null);
  var openRow = expanded[0];
  var setOpen = expanded[1];

  function toggle(tk) { setOpen(openRow === tk ? null : tk); }

  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <table className="tbl">
        <thead>
          <tr>
            <th style={{ width: 36 }}>#</th>
            <th>Ticker</th>
            <th>Prix</th>
            <th>Jour %</th>
            <th>Sem. %</th>
            <th>SMA200</th>
            <th>Volume</th>
            <th style={{ textAlign: 'right', paddingRight: 16 }}>Score</th>
          </tr>
        </thead>
        <tbody>
          {tickers.map(function(t) {
            var m = t.market || {};
            var col = t.top3 ? (RANK_COLORS[t.rank] || null) : null;
            var isOpen = openRow === t.ticker;
            return [
              <tr key={t.ticker} onClick={function() { toggle(t.ticker); }} style={{ cursor: 'pointer', background: isOpen ? 'rgba(30,41,59,.25)' : undefined }}>
                <td style={{ borderLeft: col ? '3px solid ' + col : '3px solid transparent' }}>
                  <span className="mc">{t.rank}</span>
                </td>
                <td>
                  <div className="row g6">
                    <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                       className="tv-link" style={{ color: col || '#3b82f6' }}
                       onClick={function(e) { e.stopPropagation(); }}>
                      {t.ticker}
                    </a>
                    {t.top3 && <span style={{ fontSize: 9, color: col }}>★</span>}
                    <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                       style={{ fontSize: 11, textDecoration: 'none', lineHeight: 1 }}
                       onClick={function(e) { e.stopPropagation(); }}>📈</a>
                  </div>
                </td>
                <td>{m.price != null ? '$' + fmt(m.price) : '—'}</td>
                <td><span style={{ color: chgClr(m.change_day) }}>{fmtPct(m.change_day)}</span></td>
                <td><span style={{ color: chgClr(m.change_week) }}>{fmtPct(m.change_week)}</span></td>
                <td>
                  {m.dist_sma200 != null
                    ? <span style={{ color: m.above_sma200 ? 'var(--bull)' : 'var(--neutral)' }}>{m.above_sma200 ? '✓' : '▽'} {fmtPct(m.dist_sma200)}</span>
                    : <span className="mc">—</span>
                  }
                </td>
                <td>
                  <div className="row g6">
                    {m.vol_relative != null
                      ? <span style={{ color: m.vol_relative >= 1.5 ? 'var(--purple)' : m.vol_relative >= 1.2 ? 'var(--accent)' : 'var(--muted)' }}>×{fmt(m.vol_relative, 1)}</span>
                      : <span className="mc">—</span>
                    }
                    {m.vol_relative != null && m.vol_relative > 2.0 && (
                      <span className="badge b-bear badge-hot" style={{ fontSize: 9, padding: '1px 5px' }}>🔥 HOT</span>
                    )}
                  </div>
                </td>
                <td style={{ textAlign: 'right', paddingRight: 16 }}>
                  <div className="score-cell">
                    <div className="score-bar-bg" style={{ width: (t.total_score || 0) + '%', background: scrClr(t.total_score || 0) + '30' }} />
                    <span style={{ position: 'relative', fontWeight: 700, color: scrClr(t.total_score || 0), fontSize: 12 }}>{Math.round(t.total_score || 0)}</span>
                  </div>
                </td>
              </tr>,
              isOpen && (
                <tr key={t.ticker + '-x'} className="xrow">
                  <td colSpan={8}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
                      <div>
                        <ShapScoreBreakdown ticker={t} />
                      </div>
                      <div>
                        <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, marginBottom: 10 }}>DÉTAILS</div>
                        {m.sma200 && <div style={{ fontSize: 11, marginBottom: 5 }}><span className="mc">SMA200 : </span>${fmt(m.sma200)} ({fmtPct(m.dist_sma200)}) {m.above_sma200 ? '✓' : '▽'}</div>}
                        {t.reddit && t.reddit.mentions > 0 && <div style={{ fontSize: 11, marginBottom: 5 }}><span className="mc">Reddit : </span>{t.reddit.mentions} mentions</div>}
                        {t.news_count && <div style={{ fontSize: 11 }}><span className="mc">News : </span>{t.news_count.ticker_matches} ticker + {t.news_count.keyword_matches} keyword</div>}
                        <div style={{ marginTop: 10 }}>
                          <button className="btn btn-p" style={{ fontSize: 11 }} onClick={function(e) { e.stopPropagation(); onGoToSmc(t.ticker); }}>🧠 Analyser SMC →</button>
                        </div>
                      </div>
                    </div>
                  </td>
                </tr>
              )
            ];
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Reddit Tab ────────────────────────────────────────────────────────────

function RedditTab(props) {
  var items         = (props.data.reddit && props.data.reddit.data) ? props.data.reddit.data : [];
  var discoveries   = props.discoveries   || [];
  var discLoading   = props.discLoading   || false;
  var onLoadDisc    = props.onLoadDisc    || function() {};
  var onAnalyzeTk   = props.onAnalyzeTk   || function() {};
  var onGoToSetups  = props.onGoToSetups  || function() {};
  var onAddTemp     = props.onAddTemp     || function() {};
  var tempWatchlist = props.tempWatchlist || [];
  var tempSet = {};
  tempWatchlist.forEach(function(t) { tempSet[t.ticker] = true; });

  var showZeroState = useState(false);
  var showZero      = showZeroState[0];
  var setShowZero   = showZeroState[1];

  // ── Métriques watchlist (parseInt pour éviter bugs string/NaN) ────────────
  var totalMent      = items.reduce(function(s, r) { return s + (parseInt(r.mentions) || 0); }, 0);
  var netSent        = items.reduce(function(s, r) { return s + (parseInt(r.net_sentiment) || 0); }, 0);
  var activeCount    = items.filter(function(r) { return (parseInt(r.mentions) || 0) > 0; }).length;
  var risingCount    = items.filter(function(r) { return r.trend === 'RISING'; }).length;
  var confirmedCount = items.filter(function(r) { return r.verified && r.cross_validated; }).length;

  // ── Graphique : seulement les tickers avec mentions > 0, triés ───────────
  var chartData = items
    .filter(function(r) { return (parseInt(r.mentions) || 0) > 0; })
    .sort(function(a, b) { return (parseInt(b.mentions) || 0) - (parseInt(a.mentions) || 0); })
    .slice(0, 12)
    .map(function(r) {
      return { ticker: r.ticker, mentions: parseInt(r.mentions) || 0, fill: sntClr(r.sentiment_label) };
    });

  function trendBadge(r) {
    var trend = r.trend || 'NEW';
    var pct = r.trend_pct;
    var pctStr = (pct !== null && pct !== undefined) ? (pct > 0 ? ' +' + pct + '%' : ' ' + pct + '%') : '';
    if (trend === 'RISING')  return <span style={{ color: 'var(--bull)', fontWeight: 700, fontSize: 11, whiteSpace: 'nowrap' }}>{'📈 RISING' + pctStr}</span>;
    if (trend === 'FALLING') return <span style={{ color: 'var(--bear)', fontWeight: 700, fontSize: 11, whiteSpace: 'nowrap' }}>{'📉 FALLING' + pctStr}</span>;
    if (trend === 'STABLE')  return <span style={{ color: 'var(--muted)', fontSize: 11, whiteSpace: 'nowrap' }}>{'➡️ STABLE' + pctStr}</span>;
    return <span style={{ color: 'var(--dim)', fontSize: 11 }}>🆕 NEW</span>;
  }

  function sourceBadge(source) {
    if (source === 'both')        return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(239,68,68,.15)', color: '#ef4444', border: '1px solid rgba(239,68,68,.35)', borderRadius: 4, padding: '1px 6px' }}>🔥 Double source</span>;
    if (source === 'buzztickers') return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(139,92,246,.15)', color: '#8b5cf6', border: '1px solid rgba(139,92,246,.35)', borderRadius: 4, padding: '1px 6px' }}>📡 buzztickr</span>;
    return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(59,130,246,.12)', color: '#3b82f6', border: '1px solid rgba(59,130,246,.25)', borderRadius: 4, padding: '1px 6px' }}>💬 Reddit</span>;
  }

  function mentionBadge(mentions) {
    var m = parseInt(mentions) || 0;
    if (m > 10) return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(239,68,68,.18)', color: '#ef4444', border: '1px solid rgba(239,68,68,.35)', borderRadius: 4, padding: '1px 6px' }}>🔥 HOT {m}</span>;
    if (m > 5)  return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(245,158,11,.15)', color: '#f59e0b', border: '1px solid rgba(245,158,11,.3)', borderRadius: 4, padding: '1px 6px' }}>🔶 {m}</span>;
    return <span style={{ fontSize: 9, fontWeight: 700, background: 'rgba(59,130,246,.12)', color: '#3b82f6', border: '1px solid rgba(59,130,246,.25)', borderRadius: 4, padding: '1px 6px' }}>{m}</span>;
  }

  return (
    <div>

      {/* ═══ ZONE 1 — WATCHLIST REDDIT ══════════════════════════════════════ */}
      <div className="stitle mb12">📊 WATCHLIST REDDIT</div>

      {/* Métriques */}
      <div className="g3 mb16" style={{ gridTemplateColumns: 'repeat(5, 1fr)' }}>
        <div className="metric"><div className="mval ac">{totalMent}</div><div className="mlbl">Total Mentions</div></div>
        <div className="metric">
          <div className="mval" style={{ color: netSent > 0 ? 'var(--bull)' : netSent < 0 ? 'var(--bear)' : 'var(--text)' }}>
            {netSent > 0 ? '+' : ''}{netSent}
          </div>
          <div className="mlbl">Sentiment Net</div>
        </div>
        <div className="metric"><div className="mval pc">{activeCount}/{items.length}</div><div className="mlbl">Tickers Actifs</div></div>
        <div className="metric"><div className="mval" style={{ color: 'var(--bull)' }}>{risingCount}</div><div className="mlbl">En Hausse</div></div>
        <div className="metric"><div className="mval" style={{ color: 'var(--bull)' }}>{confirmedCount}</div><div className="mlbl">Confirmés</div></div>
      </div>

      {/* Graphique barres — masqué si aucune mention */}
      {chartData.length === 0 ? (
        <div className="card mb16" style={{ textAlign: 'center', padding: '18px 0', color: 'var(--muted)', fontSize: 12 }}>
          Aucune mention Reddit sur la watchlist aujourd'hui
        </div>
      ) : chartData.length <= 2 ? (
        <div className="card mb16" style={{ padding: '12px 16px' }}>
          <div className="stitle mb8">MENTIONS PAR TICKER</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {chartData.map(function(d) {
              var sntLabel = items.find(function(r) { return r.ticker === d.ticker; });
              var sent = sntLabel ? sntLabel.net_sentiment : 0;
              var sentStr = sent > 0 ? ' (+' + sent + ' BULL)' : sent < 0 ? ' (' + sent + ' BEAR)' : '';
              return (
                <div key={d.ticker} className="row g8" style={{ alignItems: 'center' }}>
                  <span style={{ fontWeight: 700, minWidth: 52, color: 'var(--text)' }}>{d.ticker}</span>
                  <div style={{ flex: 1, height: 8, borderRadius: 4, background: 'var(--border)' }}>
                    <div style={{ width: '100%', height: '100%', borderRadius: 4, background: d.fill }}></div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--muted)', whiteSpace: 'nowrap' }}>{d.mentions} mention{d.mentions > 1 ? 's' : ''}{sentStr}</span>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div className="card mb16" style={{ background: 'transparent' }}>
          <div className="stitle" style={{ marginBottom: 14 }}>MENTIONS PAR TICKER</div>
          <ResponsiveContainer width="100%" height={190}>
            <BarChart data={chartData} margin={{ top: 0, right: 0, left: -20, bottom: 0 }} style={{ background: 'transparent' }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" vertical={false} />
              <XAxis dataKey="ticker" tick={{ fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' }} axisLine={false} tickLine={false} allowDecimals={false} />
              <Tooltip contentStyle={{ background: '#111827', border: '1px solid #1e293b', borderRadius: 6, fontFamily: 'JetBrains Mono', fontSize: 11 }} cursor={{ fill: 'rgba(255,255,255,.04)' }} />
              <Bar dataKey="mentions" radius={[3, 3, 0, 0]} maxBarSize={40}>
                {chartData.map(function(d, i) { return <Cell key={i} fill={d.fill} />; })}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}

      {/* Tableau watchlist — filtré par défaut (0 mentions masqués) */}
      {(function() {
        var activeItems = items.filter(function(r) { return (parseInt(r.mentions) || 0) > 0; });
        var zeroCount   = items.length - activeItems.length;
        var displayItems = showZero ? items : activeItems;
        return (
          <div>
            <div className="card mb8" style={{ padding: 0, overflow: 'hidden' }}>
              <table className="tbl">
                <thead>
                  <tr><th>Ticker</th><th>Tendance</th><th>Mentions</th><th>Sentiment</th><th>Actions</th></tr>
                </thead>
                <tbody>
                  {displayItems.map(function(r) {
                    var hasM = (parseInt(r.mentions) || 0) > 0;
                    return (
                      <tr key={r.ticker} style={{ opacity: hasM ? 1 : 0.35 }}>
                        <td>
                          <div className="row g6">
                            <span style={{ fontWeight: hasM ? 700 : 400, color: hasM ? 'var(--text)' : 'var(--muted)' }}>
                              {r.ticker}
                              {r.in_watchlist && <span style={{ marginLeft: 5, fontSize: 9, color: 'var(--accent)' }}>●</span>}
                            </span>
                            {r.cross_validated && r.verified && (
                              <span style={{ fontSize: 9, background: '#10b98120', color: 'var(--bull)', border: '1px solid #10b98140', borderRadius: 4, padding: '1px 5px', fontWeight: 700 }}>✅</span>
                            )}
                          </div>
                        </td>
                        <td>{trendBadge(r)}</td>
                        <td>
                          <span style={{ fontWeight: 600, color: hasM ? 'var(--text)' : 'var(--dim)' }}>{parseInt(r.mentions) || 0}</span>
                          {r.mentions_avg_5d != null && (
                            <span className="mc" style={{ marginLeft: 5, fontSize: 10 }}>moy {r.mentions_avg_5d}</span>
                          )}
                          {hasM && (
                            <span style={{ marginLeft: 5, color: sntClr(r.sentiment_label), fontSize: 10 }}>
                              {(parseInt(r.net_sentiment) || 0) > 0 ? '+' : ''}{parseInt(r.net_sentiment) || 0}
                            </span>
                          )}
                        </td>
                        <td>
                          <span style={{ color: sntClr(r.sentiment_label), fontWeight: 600, fontSize: 11 }}>{r.sentiment_label}</span>
                        </td>
                        <td>
                          {hasM && (
                            <div className="row g4">
                              <button className="btn btn-p" style={{ fontSize: 9, padding: '2px 7px' }}
                                onClick={function() { onAnalyzeTk(r.ticker); }}>
                                🧠 SMC
                              </button>
                              <button className="btn" style={{ fontSize: 9, padding: '2px 7px' }}
                                onClick={function() { onGoToSetups(r.ticker); }}>
                                🎯 Setup
                              </button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {/* Résumé + toggle */}
            <div className="mb24" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 2px' }}>
              <span className="mc" style={{ fontSize: 11 }}>
                📊 {activeItems.length}/{items.length} tickers mentionnés sur Reddit aujourd'hui.
                {zeroCount > 0 && !showZero && ` Les ${zeroCount} autres n'ont aucune mention.`}
              </span>
              {zeroCount > 0 && (
                <button className="btn" style={{ fontSize: 10, padding: '2px 10px' }}
                  onClick={function() { setShowZero(function(v) { return !v; }); }}>
                  {showZero ? 'Masquer les sans mention' : 'Voir tous (' + zeroCount + ' sans mention)'}
                </button>
              )}
            </div>
          </div>
        );
      })()}

      {/* ═══ ZONE 2 — TROUVAILLES ════════════════════════════════════════════ */}
      <div style={{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
        <div className="rowb mb12">
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>🔍 Trouvailles — Tickers hors watchlist</div>
            <div className="mc" style={{ fontSize: 11, marginTop: 2 }}>Reddit + r/buzztickr — scan manuel (~20s)</div>
          </div>
          <button className={'btn' + (discLoading ? '' : ' btn-p')} onClick={onLoadDisc} disabled={discLoading}
            style={discLoading ? { opacity: 0.65, cursor: 'not-allowed' } : {}}>
            {discLoading ? <span><span className="spin-anim">⟳</span> Scan en cours...</span> : '🔍 Scanner les trouvailles'}
          </button>
        </div>

        {!discLoading && discoveries.length === 0 && (
          <div className="mc" style={{ textAlign: 'center', padding: '24px 0', fontSize: 12, borderRadius: 8, background: 'var(--bg)', border: '1px solid var(--border)' }}>
            Clique sur "Scanner les trouvailles" pour découvrir des tickers en tendance hors watchlist
          </div>
        )}

        {discLoading && (
          <div style={{ textAlign: 'center', padding: '24px 0', background: 'var(--bg)', borderRadius: 8, border: '1px solid var(--border)' }}>
            <span className="spin-anim" style={{ fontSize: 22 }}>⟳</span>
            <div className="mc" style={{ fontSize: 11, marginTop: 8 }}>Récupération Reddit + r/buzztickr + enrichissement prix...</div>
          </div>
        )}

        {discoveries.length > 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
            {discoveries.slice(0, 15).map(function(d) {
              var isAdded  = !!tempSet[d.ticker];
              var chgColor = d.change_pct == null ? 'var(--muted)' : d.change_pct >= 0 ? 'var(--bull)' : 'var(--bear)';
              var chgStr   = d.change_pct != null ? ((d.change_pct >= 0 ? '+' : '') + d.change_pct + '%') : '';
              var priceStr = d.price != null ? '$' + d.price : '—';
              return (
                <div key={d.ticker} style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {/* Ligne 1 : ticker + source + mentions */}
                  <div className="row g6" style={{ flexWrap: 'wrap' }}>
                    <span style={{ fontWeight: 700, fontSize: 14 }}>{d.ticker}</span>
                    {sourceBadge(d.source)}
                    {mentionBadge(d.mentions)}
                  </div>
                  {/* Ligne 2 : prix + variation */}
                  <div style={{ fontSize: 13, fontWeight: 600 }}>
                    <span style={{ color: priceStr === '—' ? 'var(--muted)' : 'var(--text)' }}>{priceStr}</span>
                    {chgStr && <span style={{ marginLeft: 8, color: chgColor, fontSize: 12 }}>{chgStr}</span>}
                    {d.vol_relative != null && (
                      <span className="mc" style={{ marginLeft: 8, fontSize: 10 }}>vol ×{d.vol_relative}</span>
                    )}
                  </div>
                  {/* Ligne 3 : actions */}
                  <div className="row g6" style={{ flexWrap: 'wrap', marginTop: 'auto' }}>
                    <button className="btn btn-p" style={{ fontSize: 10, padding: '3px 8px' }}
                      onClick={function() { onAnalyzeTk(d.ticker, d.sector); }}>
                      🧠 Analyser
                    </button>
                    <button className="btn" style={{ fontSize: 10, padding: '3px 8px',
                      background: isAdded ? 'rgba(16,185,129,.15)' : '',
                      color:      isAdded ? '#10b981' : '',
                      border:     isAdded ? '1px solid rgba(16,185,129,.4)' : '' }}
                      onClick={function() { if (!isAdded) { onAddTemp(d.ticker, d.ticker, d.sector); } }}>
                      {isAdded ? '📌 Ajouté' : '➕ Watchlist'}
                    </button>
                    <a href={'https://www.tradingview.com/chart/?symbol=' + d.ticker}
                       target="_blank" rel="noopener" className="btn"
                       style={{ fontSize: 10, padding: '3px 8px', textDecoration: 'none' }}>
                      📈 Chart
                    </a>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

    </div>
  );
}
