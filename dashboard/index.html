// ── Performance Tab ────────────────────────────────────────────────────────

var _MONTH_NAMES = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
var _TOOLTIP_STYLE = { background: '#111827', border: '1px solid #1e293b', borderRadius: 6, fontFamily: 'JetBrains Mono', fontSize: 11 };
var _TICK_STYLE    = { fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' };
var _fmtD          = function(d) { return d ? d.slice(5).replace('-', '/') : ''; };

function PerfMetricCard(props) {
  var label = props.label;
  var value = props.value;
  var color = props.color || 'var(--text)';
  var sub   = props.sub;
  return (
    <div className="card" style={{ textAlign: 'center', padding: '16px 12px' }}>
      <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 8 }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700, lineHeight: 1, color: color }}>{value}</div>
      {sub && <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 6 }}>{sub}</div>}
    </div>
  );
}

function EquityCurve(props) {
  var data = props.data || [];
  if (!data.length) return null;
  var vals     = data.map(function(d) { return d.pnl; });
  var eMax     = Math.max.apply(null, vals.concat([0]));
  var eMin     = Math.min.apply(null, vals.concat([0]));
  var zeroOff  = (eMax > 0 && eMin < 0) ? (eMax / (eMax - eMin) * 100).toFixed(1) + '%' : (eMin >= 0 ? '0%' : '100%');
  var lastVal  = vals[vals.length - 1] || 0;
  var lineClr  = lastVal >= 0 ? '#10b981' : '#ef4444';
  return (
    <div className="card mb16">
      <div className="stitle" style={{ marginBottom: 14 }}>COURBE D'EQUITY</div>
      <ResponsiveContainer width="100%" height={220}>
        <AreaChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%"     stopColor="#10b981" stopOpacity={0.35} />
              <stop offset={zeroOff} stopColor="#10b981" stopOpacity={0.05} />
              <stop offset={zeroOff} stopColor="#ef4444" stopOpacity={0.05} />
              <stop offset="95%"    stopColor="#ef4444" stopOpacity={0.35} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" />
          <XAxis dataKey="date" tickFormatter={_fmtD} tick={_TICK_STYLE} axisLine={false} tickLine={false} />
          <YAxis tick={_TICK_STYLE} axisLine={false} tickLine={false} tickFormatter={function(v) { return '$' + v; }} />
          <Tooltip contentStyle={_TOOLTIP_STYLE} formatter={function(v) { return ['$' + v, 'PnL cumulé']; }} labelFormatter={_fmtD} />
          <Area type="monotone" dataKey="pnl" stroke={lineClr} strokeWidth={2} fill="url(#eqGrad)" dot={false} activeDot={{ r: 4, strokeWidth: 0 }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function MonthlyHeatmap(props) {
  var data = props.data || [];
  if (!data.length) return null;
  var monthMap = {};
  data.forEach(function(m) { monthMap[m.month] = m; });
  var years = [];
  data.forEach(function(m) { var y = m.month.slice(0, 4); if (years.indexOf(y) === -1) years.push(y); });
  years.sort();
  var allAbs = data.map(function(m) { return Math.abs(m.pnl); });
  var maxAbs = Math.max.apply(null, allAbs.concat([1]));
  return (
    <div className="card mb16">
      <div className="stitle" style={{ marginBottom: 14 }}>RETOURS MENSUELS</div>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'separate', borderSpacing: 4 }}>
          <thead>
            <tr>
              <th style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'left', paddingRight: 8, width: 40 }}>Année</th>
              {_MONTH_NAMES.map(function(mn) {
                return <th key={mn} style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'center', width: 60 }}>{mn}</th>;
              })}
              <th style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'right', paddingLeft: 8 }}>Total</th>
            </tr>
          </thead>
          <tbody>
            {years.map(function(year) {
              var yearTotal = 0;
              return (
                <tr key={year}>
                  <td style={{ fontSize: 11, fontWeight: 700, color: 'var(--muted)', paddingRight: 8 }}>{year}</td>
                  {_MONTH_NAMES.map(function(_, mi) {
                    var key  = year + '-' + String(mi + 1).padStart(2, '0');
                    var cell = monthMap[key];
                    if (cell) yearTotal += cell.pnl;
                    var intensity = cell ? Math.min(0.8, 0.15 + Math.abs(cell.pnl) / maxAbs * 0.65) : 0;
                    var bg = cell
                      ? (cell.pnl >= 0 ? 'rgba(16,185,129,' + intensity + ')' : 'rgba(239,68,68,' + intensity + ')')
                      : 'rgba(30,41,59,0.3)';
                    return (
                      <td key={mi} style={{ textAlign: 'center', padding: '5px 2px' }}>
                        <div style={{ background: bg, borderRadius: 4, padding: '5px 2px', minHeight: 36, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                          {cell ? (
                            <>
                              <div style={{ fontSize: 11, fontWeight: 700, color: cell.pnl >= 0 ? '#10b981' : '#ef4444' }}>
                                {cell.pnl >= 0 ? '+' : ''}{Math.round(cell.pnl)}$
                              </div>
                              <div style={{ fontSize: 9, color: 'var(--muted)' }}>{cell.winrate}%</div>
                            </>
                          ) : <span style={{ color: 'var(--dim)', fontSize: 10 }}>—</span>}
                        </div>
                      </td>
                    );
                  })}
                  <td style={{ textAlign: 'right', paddingLeft: 8, fontSize: 11, fontWeight: 700, color: yearTotal >= 0 ? '#10b981' : '#ef4444' }}>
                    {yearTotal >= 0 ? '+' : ''}{Math.round(yearTotal)}$
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DrawdownChart(props) {
  var data = props.data || [];
  var maxDD = props.maxDrawdown || 0;
  if (!data.length) return null;
  var vals   = data.map(function(d) { return d.drawdown; });
  var minVal = Math.min.apply(null, vals.concat([0]));
  var domain = [Math.floor(minVal * 1.1), 0];
  return (
    <div className="card mb16">
      <div className="rowb" style={{ marginBottom: 14 }}>
        <div className="stitle" style={{ marginBottom: 0 }}>ANALYSE DRAWDOWN</div>
        <div style={{ fontSize: 11 }}>
          <span style={{ color: 'var(--muted)' }}>Max DD : </span>
          <span style={{ color: '#ef4444', fontWeight: 700 }}>${Math.abs(maxDD).toFixed(0)}</span>
        </div>
      </div>
      <ResponsiveContainer width="100%" height={160}>
        <AreaChart data={data} margin={{ top: 5, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="ddGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%"  stopColor="#ef4444" stopOpacity={0.5} />
              <stop offset="95%" stopColor="#ef4444" stopOpacity={0.05} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" />
          <XAxis dataKey="date" tickFormatter={_fmtD} tick={_TICK_STYLE} axisLine={false} tickLine={false} />
          <YAxis domain={domain} tick={_TICK_STYLE} axisLine={false} tickLine={false} tickFormatter={function(v) { return '$' + v; }} />
          <Tooltip contentStyle={_TOOLTIP_STYLE} formatter={function(v) { return ['$' + v, 'Drawdown']; }} labelFormatter={_fmtD} />
          <Area type="monotone" dataKey="drawdown" stroke="#ef4444" strokeWidth={2} fill="url(#ddGrad)" dot={false} activeDot={{ r: 3, strokeWidth: 0 }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function EdgeTable(props) {
  var title   = props.title;
  var rows    = props.rows || [];
  var columns = props.columns || [];
  if (!rows.length) return (
    <div className="card"><div className="stitle" style={{ marginBottom: 8 }}>{title}</div><div style={{ color: 'var(--muted)', fontSize: 11, textAlign: 'center', padding: 16 }}>Aucune donnée</div></div>
  );
  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <div className="stitle" style={{ padding: '12px 16px 10px' }}>{title}</div>
      <table className="tbl">
        <thead>
          <tr>{columns.map(function(c) { return <th key={c.key}>{c.label}</th>; })}</tr>
        </thead>
        <tbody>
          {rows.map(function(row, i) {
            return (
              <tr key={i}>
                {columns.map(function(c) {
                  var val = row[c.key];
                  var color = c.color ? c.color(val, row) : 'var(--text)';
                  return <td key={c.key} style={{ color: color, fontWeight: c.bold ? 700 : 400 }}>{c.fmt ? c.fmt(val) : val}</td>;
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function PerformanceTab(props) {
  var lightMode = props.lightMode || false;
  var chartTextColor = lightMode ? '#475569' : '#94a3b8';
  var chartGridColor = lightMode ? '#e2e8f0' : '#1e293b';
  // ── TOUS les hooks en premier (règle React) ──────────────────────────────
  var ps = useState(null);  var perf = ps[0];     var setPerf = ps[1];
  var ls = useState(true);  var loading = ls[0];  var setLoading = ls[1];
  var es = useState(null);  var err = es[0];      var setErr = es[1];

  var advState     = useState(null);  var adv = advState[0];         var setAdv = advState[1];
  var advLoadState = useState(false); var advLoading = advLoadState[0]; var setAdvLoading = advLoadState[1];
  var advDoneState = useState(false); var advDone = advDoneState[0];    var setAdvDone = advDoneState[1];

  // Hooks backtest (doivent être ici, PAS dans une IIFE ni sous un return conditionnel)
  var btTickerState = useState('NVDA'); var btTicker = btTickerState[0]; var setBtTicker = btTickerState[1];
  var btStratState  = useState('ALL');  var btStrat  = btStratState[0];  var setBtStrat  = btStratState[1];
  var btPeriodState = useState('3y');   var btPeriod = btPeriodState[0]; var setBtPeriod = btPeriodState[1];
  var btLoadState   = useState(false);  var btLoad   = btLoadState[0];   var setBtLoad   = btLoadState[1];
  var btDataState   = useState(null);   var btData   = btDataState[0];   var setBtData   = btDataState[1];
  var btErrState    = useState(null);   var btErr    = btErrState[0];    var setBtErr    = btErrState[1];

  useEffect(function() {
    setLoading(true);
    fetch('/api/performance')
      .then(function(r) { return r.json(); })
      .then(function(d) { setPerf(d); setLoading(false); })
      .catch(function(e) { setErr(String(e)); setLoading(false); });
  }, []);

  // ── Fonctions (après les hooks) ───────────────────────────────────────────
  function loadAdvanced() {
    if (advLoading) return;
    setAdvLoading(true);
    fetch('/api/performance/advanced')
      .then(function(r) { return r.json(); })
      .then(function(d) { setAdv(d); setAdvLoading(false); setAdvDone(true); })
      .catch(function(e) { setAdvLoading(false); });
  }

  function launchBacktest() {
    if (btLoad) return;
    setBtLoad(true); setBtErr(null); setBtData(null);
    var url = '/api/backtest/' + encodeURIComponent(btTicker) + '?strategy=' + btStrat + '&period=' + btPeriod;
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(d) { setBtData(d); setBtLoad(false); })
      .catch(function(e) { setBtErr(String(e)); setBtLoad(false); });
  }

  var STRAT_COLORS = { DISCOUNT_ZONE: '#3b82f6', SMA200_BOUNCE: '#10b981', VOLUME_MOMENTUM: '#f59e0b' };
  var STRAT_LABELS = { DISCOUNT_ZONE: 'Discount Zone', SMA200_BOUNCE: 'SMA200 Bounce', VOLUME_MOMENTUM: 'Vol Momentum' };
  var watchTickers = typeof _J_TICKERS !== 'undefined' ? _J_TICKERS : [];

  // ── Returns conditionnels APRÈS tous les hooks ────────────────────────────
  if (loading) return <div className="card" style={{ textAlign: 'center', padding: 48, color: 'var(--muted)' }}>Chargement des statistiques...</div>;
  if (err)     return <div className="card" style={{ color: 'var(--bear)', padding: 20 }}>Erreur : {err}</div>;
  if (!perf)   return null;

  var isEmpty = perf.total_trades === 0;

  var pnlColor = isEmpty ? 'var(--muted)' : (perf.total_pnl >= 0 ? '#10b981' : '#ef4444');
  var wrColor  = isEmpty ? 'var(--muted)' : (perf.winrate >= 50   ? '#10b981' : '#ef4444');
  var pfColor  = isEmpty ? 'var(--muted)' : (perf.profit_factor != null && perf.profit_factor >= 1.5 ? '#10b981' : 'var(--neutral)');
  var ddColor  = '#ef4444';
  var exColor  = isEmpty ? 'var(--muted)' : (perf.expectancy >= 0 ? '#10b981' : '#ef4444');

  var _tc  = perf.total_trades || 0;
  var _pct = Math.min(Math.round(_tc / 50 * 100), 100);
  var _barC = _tc >= 50 ? '#10b981' : _tc >= 20 ? '#3b82f6' : _tc >= 10 ? '#f59e0b' : '#ef4444';

  return (
    <div>
      {/* ── Bannière progression 50 trades ── */}
      <div className="card mb16" style={{ padding: '10px 16px', borderLeft: '3px solid ' + (_tc >= 50 ? '#10b981' : '#f59e0b') }}>
        <div className="rowb mb6">
          <span style={{ fontSize: 12, fontWeight: 700, color: _tc >= 50 ? '#10b981' : '#f59e0b' }}>
            {_tc >= 50 ? '✅ 50+ trades — métriques fiables' : '⚠️ ' + _tc + '/50 trades — les métriques ne sont pas encore significatives'}
          </span>
          <span style={{ fontSize: 11, color: 'var(--muted)' }}>{_pct}%</span>
        </div>
        <div style={{ background: 'rgba(30,41,59,.6)', borderRadius: 4, height: 5, overflow: 'hidden' }}>
          <div style={{ width: _pct + '%', height: '100%', background: _barC, borderRadius: 4, transition: 'width .4s ease' }} />
        </div>
      </div>

      {isEmpty && (
        <div className="card mb16" style={{ textAlign: 'center', padding: '32px 24px' }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>📊</div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>Aucun trade enregistré</div>
          <div style={{ color: 'var(--muted)', fontSize: 12, maxWidth: 440, margin: '0 auto' }}>
            Utilise l'onglet Journal pour enregistrer tes premiers trades et voir tes statistiques ici !
          </div>
        </div>
      )}

      {/* ── 6 Métriques ── */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginBottom: 16 }}>
        <PerfMetricCard label="Total PnL"    value={isEmpty ? '—' : (perf.total_pnl >= 0 ? '+' : '') + '$' + Math.abs(perf.total_pnl).toFixed(0)} color={pnlColor}
          sub={isEmpty ? null : (perf.best_trade ? '↑ ' + perf.best_trade.ticker : null)} />
        <PerfMetricCard label="Winrate"      value={isEmpty ? '—' : perf.winrate + '%'} color={wrColor}
          sub={isEmpty ? null : perf.wins + 'W / ' + perf.losses + 'L' + (perf.be ? ' / ' + perf.be + 'BE' : '')} />
        <PerfMetricCard label="Profit Factor" value={isEmpty ? '—' : (perf.profit_factor != null ? perf.profit_factor + 'x' : 'N/A')} color={pfColor}
          sub={isEmpty ? null : '≥ 1.5 conseillé'} />
        <PerfMetricCard label="Max Drawdown" value={isEmpty ? '—' : '-$' + Math.abs(perf.max_drawdown).toFixed(0)} color={isEmpty ? 'var(--muted)' : ddColor}
          sub={null} />
        <PerfMetricCard label="Expectancy"   value={isEmpty ? '—' : (perf.expectancy >= 0 ? '+' : '') + '$' + perf.expectancy.toFixed(0)} color={exColor}
          sub="par trade" />
        <PerfMetricCard label="Trades"       value={isEmpty ? '0' : perf.total_trades} color="var(--accent)"
          sub={isEmpty ? null : (perf.avg_rr_realized != null ? 'Avg RR ' + perf.avg_rr_realized + 'R' : null)} />
      </div>

      {!isEmpty && (
        <>
          <EquityCurve data={perf.equity_curve} />

          <div className="g2 mb16">
            <MonthlyHeatmap data={perf.monthly_returns} />
            <DrawdownChart  data={perf.drawdown_curve} maxDrawdown={perf.max_drawdown} />
          </div>

          {/* ── Edge Tracker ── */}
          <div className="stitle">EDGE TRACKER</div>
          <div className="g2">
            <EdgeTable
              title="Par Ticker"
              rows={perf.by_ticker}
              columns={[
                { key: 'ticker',  label: 'Ticker',  bold: true },
                { key: 'trades',  label: 'Trades' },
                { key: 'winrate', label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                { key: 'pnl',     label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                { key: 'avg_rr',  label: 'Avg RR', fmt: function(v) { return v != null ? v + 'R' : '—'; }, color: function(v) { return v != null && v >= 2 ? '#10b981' : 'var(--muted)'; } },
              ]}
            />
            <EdgeTable
              title="Par Setup"
              rows={perf.by_setup}
              columns={[
                { key: 'type',          label: 'Setup',  bold: true, fmt: function(v) { return v.replace('_', ' '); } },
                { key: 'trades',        label: 'Trades' },
                { key: 'winrate',       label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                { key: 'pnl',           label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                { key: 'profit_factor', label: 'PF',     fmt: function(v) { return v != null ? v + 'x' : '—'; }, color: function(v) { return v != null && v >= 1.5 ? '#10b981' : 'var(--muted)'; } },
              ]}
            />
          </div>

          {perf.by_regime && perf.by_regime.length > 0 && (
            <div style={{ marginTop: 12 }}>
              <EdgeTable
                title="Par Régime de Marché"
                rows={perf.by_regime}
                columns={[
                  { key: 'regime',  label: 'Régime', bold: true },
                  { key: 'trades',  label: 'Trades' },
                  { key: 'winrate', label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                  { key: 'pnl',     label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                ]}
              />
            </div>
          )}
        </>
      )}

      {/* ── Métriques Avancées ── */}
      <div style={{ marginTop: 24, borderTop: '1px solid var(--border)', paddingTop: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div className="stitle" style={{ margin: 0 }}>MÉTRIQUES AVANCÉES</div>
          {!advDone && (
            <button className="btn btn-p" onClick={loadAdvanced} disabled={advLoading} style={{ fontSize: 12 }}>
              {advLoading
                ? <span><span className="spin-anim">⟳</span> Simulation en cours... (1000 scénarios)</span>
                : '📈 Calculer métriques avancées'}
            </button>
          )}
        </div>

        {!advDone && !advLoading && (
          <div className="card" style={{ textAlign: 'center', padding: '28px 24px', color: 'var(--muted)' }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>📈</div>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Sharpe · Sortino · Calmar · Kelly · Monte Carlo</div>
            <div style={{ fontSize: 12 }}>Clique "Calculer métriques avancées" pour lancer l'analyse (Monte Carlo = ~2s).</div>
          </div>
        )}

        {advLoading && (
          <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--muted)' }}>
            <span className="spin-anim" style={{ fontSize: 24 }}>⟳</span>
            <div style={{ marginTop: 10, fontSize: 12 }}>Simulation Monte Carlo en cours... (1000 scénarios)</div>
          </div>
        )}

        {advDone && adv && (function() {
          var n = adv.n_trades || 0;
          var enoughBasic = n >= 10;
          var enoughMC    = n >= 20;
          var muted = 'var(--muted)';

          function ratioColor(v, threshGreen, threshOrange) {
            if (v == null) return muted;
            if (v >= threshGreen)  return '#10b981';
            if (v >= threshOrange) return '#f59e0b';
            return '#ef4444';
          }

          var sharpe  = adv.sharpe_ratio;
          var sortino = adv.sortino_ratio;
          var calmar  = adv.calmar_ratio;
          var kelly   = adv.kelly_criterion;
          var kellyPct = kelly != null ? Math.round(kelly * 100 * 10) / 10 : null;
          var safeKellyPct = kellyPct != null ? Math.round(kellyPct * 0.25 * 10) / 10 : null;
          var exp = adv.expectancy || {};
          var er  = exp.edge_ratio;
          var epr = exp.expectancy_per_r;
          var mc  = adv.monte_carlo;
          var rdist = adv.r_distribution || {};

          var metrics6 = [
            { label: 'Sharpe Ratio',  val: sharpe,  fmt: function(v) { return String(v); }, color: ratioColor(sharpe,  1.5, 0.5), sub: '≥1.5 excellent' },
            { label: 'Sortino Ratio', val: sortino, fmt: function(v) { return String(v); }, color: ratioColor(sortino, 2.0, 1.0), sub: '≥2.0 excellent' },
            { label: 'Calmar Ratio',  val: calmar,  fmt: function(v) { return String(v); }, color: ratioColor(calmar,  3.0, 1.0), sub: '≥3.0 excellent' },
            { label: 'Kelly %',       val: kellyPct, fmt: function(v) { return v + '%'; }, color: kellyPct != null && kellyPct > 0 ? '#f59e0b' : muted, sub: safeKellyPct != null ? '25% Kelly = ' + safeKellyPct + '%' : null },
            { label: 'Edge Ratio',    val: er,       fmt: function(v) { return v + 'x'; }, color: ratioColor(er,    2.0, 1.5), sub: 'avg win / avg loss' },
            { label: 'Exp / R',       val: epr,      fmt: function(v) { return v + 'R'; }, color: epr != null && epr > 0 ? '#10b981' : '#ef4444', sub: 'gain moyen par R' },
          ];

          return (
            <div>
              {adv.message && (
                <div style={{ fontSize: 12, color: '#f59e0b', background: 'rgba(245,158,11,.08)', border: '1px solid rgba(245,158,11,.2)', borderRadius: 6, padding: '8px 14px', marginBottom: 12 }}>
                  📊 {adv.message}
                </div>
              )}

              {/* 6 cartes métriques */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginBottom: 16 }}>
                {metrics6.map(function(m, i) {
                  var hasVal = m.val != null && enoughBasic;
                  return (
                    <div key={i} className="card" style={{ padding: '12px 10px', textAlign: 'center', opacity: hasVal ? 1 : 0.45 }}>
                      <div style={{ fontSize: 9, color: muted, letterSpacing: 1, marginBottom: 6 }}>{m.label}</div>
                      <div style={{ fontSize: 20, fontWeight: 700, color: hasVal ? m.color : muted }}>{hasVal ? m.fmt(m.val) : '—'}</div>
                      {m.sub && <div style={{ fontSize: 9, color: muted, marginTop: 4 }}>{m.sub}</div>}
                    </div>
                  );
                })}
              </div>

              {/* Warning Kelly */}
              {kellyPct != null && enoughBasic && safeKellyPct != null && (
                <div style={{ fontSize: 11, color: '#f59e0b', background: 'rgba(245,158,11,.07)', border: '1px solid rgba(245,158,11,.2)', borderRadius: 6, padding: '8px 14px', marginBottom: 16 }}>
                  ⚠️ Kelly Criterion ({kellyPct}%) est agressif. En pratique, utilise max 25% du Kelly, soit <strong>{safeKellyPct}%</strong> du capital par trade.
                </div>
              )}

              {/* Séries + distribution R */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
                <div className="card" style={{ padding: '14px 16px' }}>
                  <div style={{ fontSize: 10, color: muted, letterSpacing: 1, marginBottom: 10 }}>STATISTIQUES DÉTAILLÉES</div>
                  <div style={{ fontSize: 12, marginBottom: 6 }}>
                    🔥 Max wins consécutifs : <strong style={{ color: '#10b981' }}>{adv.max_consecutive_wins != null ? adv.max_consecutive_wins : '—'}</strong>
                    {'   '}💀 Max losses : <strong style={{ color: '#ef4444' }}>{adv.max_consecutive_losses != null ? adv.max_consecutive_losses : '—'}</strong>
                  </div>
                  {adv.profit_factor != null && (
                    <div style={{ fontSize: 12 }}>Profit Factor : <strong style={{ color: adv.profit_factor >= 1.5 ? '#10b981' : '#f59e0b' }}>{adv.profit_factor}x</strong></div>
                  )}
                </div>

                <div className="card" style={{ padding: '14px 16px' }}>
                  <div style={{ fontSize: 10, color: muted, letterSpacing: 1, marginBottom: 10 }}>DISTRIBUTION DES R</div>
                  {Object.keys(rdist).length > 0 ? (
                    <div style={{ display: 'flex', gap: 6, alignItems: 'flex-end', height: 50 }}>
                      {Object.entries(rdist).map(function(entry, i) {
                        var label = entry[0]; var cnt = entry[1];
                        var maxCnt = Math.max.apply(null, Object.values(rdist)) || 1;
                        var h = Math.round(cnt / maxCnt * 44);
                        var isPos = label.startsWith('+');
                        var isNeg = label.startsWith('-');
                        var barColor = isPos ? '#10b981' : isNeg ? '#ef4444' : 'var(--muted)';
                        return (
                          <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1 }}>
                            <div style={{ fontSize: 9, color: barColor, marginBottom: 2 }}>{cnt}</div>
                            <div style={{ width: '100%', height: h + 'px', background: barColor, borderRadius: '2px 2px 0 0', opacity: 0.8 }} />
                            <div style={{ fontSize: 8, color: muted, marginTop: 3 }}>{label}</div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{ fontSize: 11, color: muted }}>Pas de données R disponibles</div>
                  )}
                </div>
              </div>

              {/* Monte Carlo */}
              {enoughMC && mc ? (
                <div className="card" style={{ padding: '16px' }}>
                  <div style={{ fontSize: 10, color: muted, letterSpacing: 1, marginBottom: 14 }}>
                    SIMULATION MONTE CARLO — {mc.n_simulations} scénarios · {mc.n_trades} trades simulés
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 16, alignItems: 'start' }}>
                    {/* Graphique equity curves */}
                    <div style={{ height: 160, position: 'relative' }}>
                      {(function() {
                        var curves = mc.equity_curves || [];
                        if (!curves.length) return null;
                        var nPts = curves[0].length;
                        var allVals = curves.reduce(function(acc, c) { return acc.concat(c); }, []);
                        var minV = Math.min.apply(null, allVals);
                        var maxV = Math.max.apply(null, allVals);
                        var range = maxV - minV || 1;
                        var W = 340; var H = 140;
                        function toX(i) { return Math.round(i / (nPts - 1) * W); }
                        function toY(v) { return Math.round(H - (v - minV) / range * H); }
                        function curvePath(c) {
                          return c.map(function(v, i) { return (i === 0 ? 'M' : 'L') + toX(i) + ',' + toY(v); }).join(' ');
                        }
                        // Médiane
                        var medianCurve = curves[Math.floor(curves.length / 2)];
                        // 5e et 95e parmi les 50 courbes sauvées
                        var sorted50 = curves.slice().sort(function(a, b) { return a[a.length-1] - b[b.length-1]; });
                        var worstCurve = sorted50[0];
                        var bestCurve  = sorted50[sorted50.length - 1];
                        return (
                          <svg viewBox={'0 0 ' + W + ' ' + H} style={{ width: '100%', height: '100%' }} preserveAspectRatio="none">
                            {/* Lignes de fond */}
                            {[0, 0.25, 0.5, 0.75, 1].map(function(f, i) {
                              var y = Math.round(f * H);
                              return <line key={i} x1={0} y1={y} x2={W} y2={y} stroke="var(--border)" strokeWidth={0.5} />;
                            })}
                            {/* 50 courbes simulées en transparence */}
                            {curves.map(function(c, i) {
                              return <path key={i} d={curvePath(c)} fill="none" stroke="var(--accent)" strokeWidth={0.4} opacity={0.15} />;
                            })}
                            {/* Pire scénario (rouge pointillé) */}
                            <path d={curvePath(worstCurve)} fill="none" stroke="#ef4444" strokeWidth={1.2} strokeDasharray="4,3" opacity={0.8} />
                            {/* Meilleur scénario (vert pointillé) */}
                            <path d={curvePath(bestCurve)} fill="none" stroke="#10b981" strokeWidth={1.2} strokeDasharray="4,3" opacity={0.8} />
                            {/* Médiane (blanc plein) */}
                            <path d={curvePath(medianCurve)} fill="none" stroke="var(--text)" strokeWidth={1.8} opacity={0.9} />
                          </svg>
                        );
                      })()}
                      <div style={{ display: 'flex', gap: 12, marginTop: 6, fontSize: 9, color: muted }}>
                        <span style={{ color: 'var(--text)' }}>— Médiane</span>
                        <span style={{ color: '#10b981' }}>-- Meilleur (95e pct)</span>
                        <span style={{ color: '#ef4444' }}>-- Pire (5e pct)</span>
                      </div>
                    </div>
                    {/* Statistiques */}
                    <div style={{ minWidth: 160, fontSize: 12 }}>
                      {[
                        { label: 'PnL médian',         val: (mc.median_pnl >= 0 ? '+' : '') + '$' + Math.round(mc.median_pnl).toLocaleString(), color: mc.median_pnl >= 0 ? '#10b981' : '#ef4444' },
                        { label: 'Pire scénario (5%)', val: (mc.pnl_5th >= 0 ? '+' : '') + '$' + Math.round(mc.pnl_5th).toLocaleString(),   color: mc.pnl_5th >= 0 ? '#10b981' : '#ef4444' },
                        { label: 'Meilleur scénario',  val: '+$' + Math.round(mc.pnl_95th).toLocaleString(),  color: '#10b981' },
                        { label: 'Prob. rentable',     val: mc.prob_profitable + '%',   color: mc.prob_profitable >= 80 ? '#10b981' : '#f59e0b' },
                        { label: 'Risque de ruine',    val: mc.prob_ruin + '%',         color: mc.prob_ruin > 5 ? '#ef4444' : muted },
                        { label: 'Max DD médian',      val: '$' + Math.round(mc.median_dd).toLocaleString(), color: '#ef4444' },
                      ].map(function(row, i) {
                        return (
                          <div key={i} style={{ marginBottom: 7, borderBottom: i < 5 ? '1px solid var(--border)' : 'none', paddingBottom: 5 }}>
                            <div style={{ fontSize: 9, color: muted }}>{row.label}</div>
                            <div style={{ fontWeight: 700, color: row.color }}>{row.val}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="card" style={{ padding: '20px 24px', textAlign: 'center', opacity: 0.5 }}>
                  <div style={{ fontSize: 22, marginBottom: 8 }}>🎲</div>
                  <div style={{ fontSize: 12, color: muted }}>
                    Accumule <strong>20+ trades</strong> pour débloquer la simulation Monte Carlo
                    <br /><span style={{ fontSize: 10 }}>({n} / 20 trades actuellement)</span>
                  </div>
                  {/* Illustration courbes grisées */}
                  <svg viewBox="0 0 300 60" style={{ width: '100%', maxWidth: 300, marginTop: 14, opacity: 0.3 }}>
                    {[[10,50,30,40,20,55,15,45],[20,35,50,25,45,30,55,20],[15,40,20,50,35,45,25,50]].map(function(pts, pi) {
                      var path = pts.map(function(y, i) { return (i===0?'M':'L') + (i/(pts.length-1)*290+5) + ',' + y; }).join(' ');
                      return <path key={pi} d={path} fill="none" stroke="var(--muted)" strokeWidth={1.5} />;
                    })}
                  </svg>
                </div>
              )}
            </div>
          );
        })()}
      </div>

      {/* ── Backtesting ── */}
      <div style={{ marginTop: 24, borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <div className="stitle">BACKTESTING</div>

            {/* Formulaire */}
            <div className="card mb16" style={{ padding: '14px 16px' }}>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                <div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>TICKER</div>
                  <select value={btTicker} onChange={function(e) { setBtTicker(e.target.value); }}
                    style={{ background: 'var(--bg2)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '6px 10px', fontSize: 12 }}>
                    {watchTickers.map(function(t) { return <option key={t} value={t}>{t}</option>; })}
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>STRATEGIE</div>
                  <select value={btStrat} onChange={function(e) { setBtStrat(e.target.value); }}
                    style={{ background: 'var(--bg2)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '6px 10px', fontSize: 12 }}>
                    <option value="ALL">Les 3 stratégies</option>
                    <option value="DISCOUNT_ZONE">Discount Zone</option>
                    <option value="SMA200_BOUNCE">SMA200 Bounce</option>
                    <option value="VOLUME_MOMENTUM">Vol Momentum</option>
                  </select>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>PERIODE</div>
                  <select value={btPeriod} onChange={function(e) { setBtPeriod(e.target.value); }}
                    style={{ background: 'var(--bg2)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '6px 10px', fontSize: 12 }}>
                    <option value="1y">1 an</option>
                    <option value="2y">2 ans</option>
                    <option value="3y">3 ans</option>
                  </select>
                </div>
                <button className="btn btn-p" onClick={launchBacktest} disabled={btLoad} style={{ fontSize: 12, alignSelf: 'flex-end' }}>
                  {btLoad ? <span><span className="spin-anim">⟳</span> Calcul en cours...</span> : '🔬 Lancer le backtest'}
                </button>
              </div>
              <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 8 }}>
                ⚠️ Le backtest peut prendre 10-30s selon le ticker et la période.
              </div>
            </div>

            {/* Erreur */}
            {btErr && <div style={{ color: 'var(--bear)', fontSize: 12, marginBottom: 12 }}>Erreur : {btErr}</div>}

            {/* Placeholder */}
            {!btData && !btLoad && !btErr && (
              <div className="card" style={{ textAlign: 'center', padding: '32px 24px', opacity: 0.6 }}>
                <div style={{ fontSize: 28, marginBottom: 10 }}>🔬</div>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Lance un backtest</div>
                <div style={{ fontSize: 12, color: 'var(--muted)' }}>Découvre quelle stratégie a le meilleur edge historique sur tes tickers</div>
              </div>
            )}

            {/* Résultats */}
            {btData && !btData.error && (function() {
              var summary = btData.summary || {};
              var results = btData.results || {};
              var best    = btData.best_strategy;
              var strats  = Object.keys(summary);

              // Tableau comparatif
              var tableRows = strats.map(function(s) { return Object.assign({ strategy: s }, summary[s]); });
              tableRows.sort(function(a, b) { return (b.total_pnl || 0) - (a.total_pnl || 0); });

              // Equity curves pour le graphique
              var allDates = [];
              strats.forEach(function(s) {
                var r = results[s];
                if (r && r.equity_curve) r.equity_curve.forEach(function(pt) {
                  if (allDates.indexOf(pt.date) < 0) allDates.push(pt.date);
                });
              });
              allDates.sort();

              // Construire les data points Recharts
              var chartData = allDates.map(function(date) {
                var pt = { date: date };
                strats.forEach(function(s) {
                  var r = results[s];
                  if (!r || !r.equity_curve) return;
                  var found = r.equity_curve.filter(function(p) { return p.date <= date; });
                  pt[s] = found.length ? found[found.length - 1].pnl : 0;
                });
                return pt;
              });
              // Echantillonner pour limiter les points
              var step = Math.max(1, Math.floor(chartData.length / 80));
              chartData = chartData.filter(function(_, i) { return i % step === 0; });

              return (
                <div>
                  {/* Tableau */}
                  <div className="card mb16" style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
                      <thead>
                        <tr style={{ color: 'var(--muted)', fontSize: 10, letterSpacing: 1 }}>
                          {['Stratégie', 'Trades', 'WR%', 'PF', 'PnL Total', 'Max DD', 'Moy Hold'].map(function(h, i) {
                            return <th key={i} style={{ padding: '6px 10px', textAlign: i === 0 ? 'left' : 'right', borderBottom: '1px solid var(--border)', fontWeight: 600 }}>{h}</th>;
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {tableRows.map(function(r, i) {
                          var isBest = r.strategy === best;
                          var sc = STRAT_COLORS[r.strategy] || 'var(--accent)';
                          var pnlColor = r.total_pnl >= 0 ? '#10b981' : '#ef4444';
                          var pf = r.profit_factor ? r.profit_factor + 'x' : '—';
                          var pnl = r.total_pnl >= 0 ? '+$' + Math.round(r.total_pnl).toLocaleString() : '-$' + Math.round(Math.abs(r.total_pnl)).toLocaleString();
                          return (
                            <tr key={i} style={{ background: isBest ? 'rgba(16,185,129,.04)' : 'transparent', borderBottom: '1px solid var(--border)' }}>
                              <td style={{ padding: '8px 10px', color: sc, fontWeight: isBest ? 700 : 400 }}>
                                {isBest && '🏆 '}{STRAT_LABELS[r.strategy] || r.strategy}
                              </td>
                              <td style={{ padding: '8px 10px', textAlign: 'right' }}>{r.total_trades || 0}</td>
                              <td style={{ padding: '8px 10px', textAlign: 'right', color: r.winrate >= 50 ? '#10b981' : '#ef4444' }}>{r.winrate || 0}%</td>
                              <td style={{ padding: '8px 10px', textAlign: 'right', color: r.profit_factor >= 1.5 ? '#10b981' : 'var(--muted)' }}>{pf}</td>
                              <td style={{ padding: '8px 10px', textAlign: 'right', fontWeight: 700, color: pnlColor }}>{pnl}</td>
                              <td style={{ padding: '8px 10px', textAlign: 'right', color: '#ef4444' }}>{r.max_drawdown ? '-$' + Math.round(Math.abs(r.max_drawdown)).toLocaleString() : '—'}</td>
                              <td style={{ padding: '8px 10px', textAlign: 'right', color: 'var(--muted)' }}>{r.avg_hold_days || 0}j</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* Equity curves */}
                  {chartData.length > 1 && (
                    <div className="card mb16" style={{ padding: '14px 16px' }}>
                      <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, marginBottom: 12 }}>EQUITY CURVES — {btTicker} ({btPeriod})</div>
                      <ResponsiveContainer width="100%" height={180}>
                        <LineChart data={chartData} margin={{ top: 4, right: 8, bottom: 4, left: 8 }}>
                          <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
                          <XAxis dataKey="date" tick={{ fontSize: 9, fill: 'var(--muted)' }} tickFormatter={function(v) { return v ? v.slice(2, 7) : ''; }} interval="preserveStartEnd" />
                          <YAxis tick={{ fontSize: 9, fill: 'var(--muted)' }} tickFormatter={function(v) { return '$' + Math.round(v); }} width={54} />
                          <Tooltip formatter={function(v, n) { return ['$' + Math.round(v), STRAT_LABELS[n] || n]; }} contentStyle={{ background: 'var(--bg2)', border: '1px solid var(--border)', fontSize: 11 }} />
                          <ReferenceLine y={0} stroke="var(--border)" strokeDasharray="3 3" />
                          {strats.map(function(s) {
                            return <Line key={s} type="monotone" dataKey={s} stroke={STRAT_COLORS[s] || '#888'} dot={false} strokeWidth={s === best ? 2.5 : 1.5} opacity={results[s] && results[s].total_trades > 0 ? 1 : 0.3} />;
                          })}
                        </LineChart>
                      </ResponsiveContainer>
                      <div style={{ display: 'flex', gap: 14, marginTop: 8, fontSize: 10 }}>
                        {strats.map(function(s) {
                          return <span key={s} style={{ color: STRAT_COLORS[s] }}>{'— ' + (STRAT_LABELS[s] || s)}{s === best ? ' 🏆' : ''}</span>;
                        })}
                      </div>
                    </div>
                  )}

                  {/* Verdict */}
                  {best && summary[best] && (
                    <div className="card" style={{ padding: '14px 16px', border: '1px solid rgba(16,185,129,.25)', background: 'rgba(16,185,129,.04)' }}>
                      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>
                        🏆 Meilleure stratégie : <span style={{ color: '#10b981' }}>{STRAT_LABELS[best] || best}</span>
                        {' — '}WR {summary[best].winrate}%, PF {summary[best].profit_factor || 'N/A'}
                        {', '}
                        <span style={{ color: summary[best].total_pnl >= 0 ? '#10b981' : '#ef4444' }}>
                          {summary[best].total_pnl >= 0 ? '+' : '-'}${Math.round(Math.abs(summary[best].total_pnl)).toLocaleString()}
                        </span>
                        {' sur ' + btPeriod}
                      </div>
                      <div style={{ fontSize: 11, color: 'var(--muted)' }}>
                        💡 Recommandation : concentre-toi sur les setups <strong style={{ color: 'var(--text)' }}>{STRAT_LABELS[best]}</strong> en priorité sur {btTicker}.
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
      </div>
    </div>
  );
}

function AlertsTab(props) {

  var now30 = Date.now() - 30 * 60 * 1000;
  var recentNews = liveNews.filter(function(n) {
    if (!n.fetched_at) return true;   // garder si pas de timestamp
    return new Date(n.fetched_at).getTime() >= now30;

  var sevColor = function(s) { return s === 'HIGH' ? '#ef4444' : s === 'MEDIUM' ? '#f59e0b' : '#475569'; };

  return (
    <div>

              : inKZ
                ? <span className="kz-live">🔴 LIVE 14h30-16h30 CET</span>
                : <span className="kz-off">⏸️ Hors killzone</span>

            {(inKZ || testMode) && countdown !== null && (
              <span className="mc" style={{ fontSize: 11 }}>Prochain scan dans : <span style={{ color: 'var(--text)', fontWeight: 700 }}>{countdown}s</span></span>

          </div>
          {alertData.scanned_at && (
            <span className="mc" style={{ fontSize: 10 }}>Scanné à {alertData.scanned_at}</span>

        </div>
        {!inKZ && !testMode && (
          <div style={{ marginTop: 10, fontSize: 11, color: 'var(--muted)' }}>

              <button onClick={onSimulate} style={{ background: 'transparent', border: '1px solid #334155', color: '#94a3b8', borderRadius: 6, padding: '4px 10px', fontSize: 11, cursor: 'pointer', fontFamily: 'inherit' }}>
                🧪 Simuler killzone
              </button>
            </div>
          </div>
        )}
      </div>

      {/* Alertes positions */}
      {posAlerts.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div className="stitle">📊 ALERTES POSITIONS ({posAlerts.length})</div>
          {posAlerts.map(function(a, i) {
            return (
              <div key={i} className={'alert-item alert-' + a.severity}>
                <div className="rowb">
                  <div className="row g8" style={{ flex: 1 }}>
                    <a href={'https://www.tradingview.com/chart/?symbol=' + a.ticker} target="_blank" rel="noopener"
                       className="tv-link" style={{ color: sevColor(a.severity), fontSize: 12, minWidth: 42 }}>
                      {a.ticker}
                    </a>
                    <span style={{ fontSize: 12, color: 'var(--text)' }}>{a.message}</span>
                  </div>
                  <div className="row g8">
                    <span className="badge" style={{ background: sevColor(a.severity) + '20', color: sevColor(a.severity), border: '1px solid ' + sevColor(a.severity) + '40', fontSize: 9 }}>{a.severity}</span>
                    <span className="mc" style={{ fontSize: 10 }}>{a.timestamp}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Alertes intraday */}
      <div className="stitle">ALERTES INTRADAY</div>
      {alerts.length === 0
        ? <div className="card mc" style={{ textAlign: 'center', padding: 24, fontSize: 12 }}>
            {inKZ ? 'Aucune alerte pour le moment — scan en cours...' : 'Les alertes apparaîtront pendant la killzone (14h30-16h30 CET)'}
          </div>
        : <div style={{ marginBottom: 16 }}>
            {alerts.map(function(a, i) {
              return (
                <div key={i} className={'alert-item alert-' + a.severity}>
                  <div className="rowb">
                    <div className="row g8" style={{ flex: 1 }}>
                      <a href={'https://www.tradingview.com/chart/?symbol=' + a.ticker} target="_blank" rel="noopener"
                         className="tv-link" style={{ color: sevColor(a.severity), fontSize: 12, minWidth: 42 }}>
                        {a.ticker}
                      </a>
                      <span style={{ fontSize: 12, color: 'var(--text)' }}>{a.message}</span>
                    </div>
                    <div className="row g8">
                      <span className="badge" style={{ background: sevColor(a.severity) + '20', color: sevColor(a.severity), border: '1px solid ' + sevColor(a.severity) + '40', fontSize: 9 }}>{a.severity}</span>
                      <span className="mc" style={{ fontSize: 10 }}>{a.timestamp}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
      }

      {/* Breaking News 30 min */}
      <div>
        <div className="stitle">⚡ BREAKING NEWS (30 MIN)</div>
        {recentNews.length === 0
          ? <div className="card mc" style={{ textAlign: 'center', padding: 18, fontSize: 12 }}>Pas de breaking news</div>
          : <div className="card">
              {recentNews.map(function(n, i) {
                var sc = n.sentiment === 'BULL' ? '#10b981' : n.sentiment === 'BEAR' ? '#ef4444' : '#f59e0b';
                var arrivalTime = n.fetched_at ? new Date(n.fetched_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
                return (
                  <div key={i} style={{ padding: '8px 0', borderBottom: i < recentNews.length - 1 ? '1px solid rgba(30,41,59,.4)' : 'none' }}>
                    <div className="row g6" style={{ alignItems: 'flex-start', marginBottom: 4 }}>
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: sc, flexShrink: 0, marginTop: 3 }} />
                      <a href={n.link || '#'} target="_blank" rel="noopener" className="news-link">{n.title}</a>
                    </div>
                    <div className="row g6 wrap" style={{ paddingLeft: 14 }}>
                      <span className="mc" style={{ fontSize: 10 }}>{n.source}</span>
                      {arrivalTime && <span className="mc" style={{ fontSize: 10 }}>à {arrivalTime}</span>}
                      {(n.matched_tickers || []).slice(0, 2).map(function(t) {
                        return <span key={t} className="badge b-accent" style={{ fontSize: 9, padding: '1px 5px' }}>{t}</span>;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
        }
      </div>
    </div>
  );
}

function SmcTab(props) {

  var onUnified           = props.onUnified           || function() {};
  var onScan              = props.onScan              || function() {};
  var onAddTrade          = props.onAddTrade          || function() {};

  // Dropdown : watchlist + tickers temporaires (dédupliqués)
  var allTickers = _J_TICKERS.concat(extraTickers.filter(function(t) {
    return _J_TICKERS.indexOf(t) < 0;
  }));

  var selState = useState('NVDA');
  var selectedTicker = selState[0];
  var setSelectedTicker = selState[1];

  var smcPineState = useState(null);
  var smcPineModal = smcPineState[0];
  var setSmcPineModal = smcPineState[1];

  var expertModeState = useState(false);
  var expertMode      = expertModeState[0];
  var setExpertMode   = expertModeState[1];

  var freeTickerState = useState('');
  var freeTicker      = freeTickerState[0];
  var setFreeTicker   = freeTickerState[1];

  useEffect(function() {
    if (!smcData[selectedTicker]) { onAnalyze(selectedTicker); }
  }, []);

  // Quand forceTicker change (depuis "Analyser" sur une découverte Reddit)
  useEffect(function() {
    if (forceTicker && forceTicker !== selectedTicker) {
      setSelectedTicker(forceTicker);
      onClearForceTicker();
    }
  }, [forceTicker]);

  var analysis = smcData[selectedTicker] || null;
  var st  = analysis ? (analysis.structure        || {}) : {};
  var dp  = analysis ? (analysis.discount_premium || {}) : {};
  var cf  = analysis ? (analysis.confluences      || {}) : {};
  var su  = analysis ? (analysis.setup            || {}) : {};
  var liq = analysis ? (analysis.liquidity        || {}) : {};
  var obs = analysis ? (analysis.order_blocks     || []) : [];
  var fvgs = analysis ? (analysis.fvg             || []) : [];

  var inp = { background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 6, padding: '6px 10px', color: 'var(--text)', fontFamily: 'JetBrains Mono,monospace', fontSize: 12 };

  function handleAnalyze() { onAnalyze(selectedTicker); }
  function handleUnified() { onUnified(selectedTicker); }

  function handleAddTradeUnified() {
    var ud = unifiedData[selectedTicker];
    if (!ud) return;
    onAddTrade({
      ticker:       selectedTicker,
      entry_price:  ud.best_entry  ? String(ud.best_entry)  : '',
      stop_price:   ud.best_stop   ? String(ud.best_stop)   : '',
      target_price: ud.best_target ? String(ud.best_target) : '',
      setup_type:   'MANUAL',
      direction:    'LONG',
      notes:        ud.reasoning || '',
    });
  }

  function copyReport() {
    var text = analysis && analysis.report ? analysis.report : '';
    if (navigator.clipboard) { navigator.clipboard.writeText(text); }
  }

  function handleAddTrade() {
    if (!su.has_setup) return;
    onAddTrade({
      ticker:       selectedTicker,
      entry_price:  su.entry  ? String(su.entry)  : '',
      stop_price:   su.stop   ? String(su.stop)   : '',
      target_price: su.target ? String(su.target) : '',
      setup_type:   'MANUAL',
      direction:    'LONG',
      notes:        su.reasoning || '',
    });
  }

  // Barre Discount/Premium
  function DpBar() {
    if (!dp.range_high || !dp.range_low) return null;
    var rng  = dp.range_high - dp.range_low;
    if (rng <= 0) return null;
    var cp   = analysis.current_price || dp.range_low;
    var cpPct = Math.max(0, Math.min(100, (cp - dp.range_low) / rng * 100));
    var oteLowPct  = Math.max(0, Math.min(100, (dp.ote_low  - dp.range_low) / rng * 100));
    var oteHighPct = Math.max(0, Math.min(100, (dp.ote_high - dp.range_low) / rng * 100));
    var midPct     = 50;
    var zoneColor = dp.current_zone === 'DISCOUNT' ? '#10b981' : dp.current_zone === 'OTE' ? '#3b82f6' : '#ef4444';
    return (
      <div style={{ marginBottom: 12 }}>
        {/* Barre */}
        <div style={{ position: 'relative', height: 20, borderRadius: 4, overflow: 'visible', background: 'linear-gradient(to right, #10b981 0%, #10b981 ' + midPct + '%, #ef4444 ' + midPct + '%, #ef4444 100%)', opacity: .5 }}>
          {/* OTE overlay */}
          <div style={{ position: 'absolute', left: oteLowPct + '%', width: (oteHighPct - oteLowPct) + '%', top: 0, bottom: 0, background: 'rgba(59,130,246,.6)', borderLeft: '2px solid #3b82f6', borderRight: '2px solid #3b82f6' }} />
          {/* Marker prix */}
          <div style={{ position: 'absolute', left: cpPct + '%', top: -4, width: 3, height: 28, background: zoneColor, borderRadius: 2, transform: 'translateX(-50%)', boxShadow: '0 0 6px ' + zoneColor }} />
        </div>
        {/* Labels */}
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: 'var(--muted)', marginTop: 4 }}>
          <span style={{ color: '#10b981' }}>DISC ${dp.range_low.toFixed(2)}</span>
          <span style={{ color: '#3b82f6' }}>OTE ${dp.ote_low.toFixed(2)}–${dp.ote_high.toFixed(2)}</span>
          <span>50% ${dp.midpoint ? dp.midpoint.toFixed(2) : '—'}</span>
          <span style={{ color: '#ef4444' }}>PREM ${dp.range_high.toFixed(2)}</span>
        </div>
      </div>
    );
  }

  return (
    <div>
      {/* Badge mode démo */}
      <div style={{ background: 'rgba(59,130,246,.08)', border: '1px solid rgba(59,130,246,.25)', borderRadius: 6, padding: '8px 14px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
        <span className="badge b-accent">🧪 MODE DÉMO</span>
        <span style={{ fontSize: 11, color: 'var(--muted)' }}>Analyse algorithmique — passez en MODE LIVE avec Claude API pour des analyses plus fines</span>
      </div>

      {/* Sélecteur + boutons + toggle Mode */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <select value={selectedTicker}
          onChange={function(e) { setSelectedTicker(e.target.value); }}
          style={Object.assign({}, inp, { minWidth: 120 })}>
          {allTickers.map(function(tk) {
            var isExtra = extraTickers.indexOf(tk) >= 0;
            return <option key={tk} value={tk}>{isExtra ? '📌 ' + tk : tk}</option>;
          })}
        </select>
        <button className={'btn btn-p'} onClick={handleAnalyze} disabled={smcLoading || unifiedLoading}>
          {smcLoading ? <span><span className="spin-anim">⟳</span> En cours...</span> : '🧠 Analyse SMC'}
        </button>
        <button className="btn" style={{ borderColor: '#fbbf24', color: '#fbbf24' }} onClick={handleUnified} disabled={smcLoading || unifiedLoading}>
          {unifiedLoading ? <span><span className="spin-anim">⟳</span> En cours...</span> : '🎯 Score Unifié'}

        {/* Toggle Mode Simple / Expert */}
        <div style={{ display: 'flex', borderRadius: 6, overflow: 'hidden', border: '1px solid var(--border)', marginLeft: 'auto' }}>

                            </div>

            </div>
          </div>

      {analysis && analysis.error && (

        </div>

          {/* ── Sections expert uniquement ── */}

          {/* ── Section 1 : Structure de marché */}

            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', marginBottom: 12 }}>
              {/* Badge biais */}

                padding: '8px 16px', borderRadius: 8, fontWeight: 700, fontSize: 14,
                background: st.bias === 'BULL' ? 'rgba(16,185,129,.15)' : st.bias === 'BEAR' ? 'rgba(239,68,68,.15)' : 'rgba(100,116,139,.1)',
                color: st.bias === 'BULL' ? '#10b981' : st.bias === 'BEAR' ? '#ef4444' : '#64748b',
                border: '1px solid ' + (st.bias === 'BULL' ? 'rgba(16,185,129,.3)' : st.bias === 'BEAR' ? 'rgba(239,68,68,.3)' : 'rgba(100,116,139,.2)'),
              }}>
                {st.bias === 'BULL' ? '📈' : st.bias === 'BEAR' ? '📉' : '↔️'} HTF {st.bias || 'RANGE'}

                {st.last_choch && <span style={{ fontSize: 11, fontWeight: 400, marginLeft: 8 }}>CHoCH @ ${st.last_choch.price.toFixed(2)}</span>}

                <div style={{
                  padding: '8px 14px', borderRadius: 8, fontWeight: 700, fontSize: 13,

                  color: dp.current_zone === 'DISCOUNT' ? '#10b981' : dp.current_zone === 'OTE' ? '#3b82f6' : '#ef4444',

                }}>
                  {dp.current_zone === 'DISCOUNT' ? '🟢' : dp.current_zone === 'OTE' ? '🔵' : '🔴'} {dp.current_zone}

            <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap' }}>

                  <div style={{ fontSize: 10, color: '#10b981', marginBottom: 4, letterSpacing: 1 }}>SWING LOWS</div>

                  </div>
                </div>

              var isBull = ob.type === 'BULL';
              var color  = isBull ? '#3b82f6' : '#ef4444';
              var bg     = isBull ? 'rgba(59,130,246,.08)' : 'rgba(239,68,68,.08)';

                  <div style={{ fontWeight: 700, color: 'var(--text)' }}>${ob.low.toFixed(2)} – ${ob.high.toFixed(2)}</div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{ob.date}</div>
                </div>
              );
            })}
            {fvgs.map(function(fvg, i) {
              var isBull = fvg.type === 'BULL';
              var color  = isBull ? '#8b5cf6' : '#f59e0b';
              var bg     = isBull ? 'rgba(139,92,246,.08)' : 'rgba(245,158,11,.08)';
              return (
                <div key={'fvg' + i} style={{ background: bg, border: '1px solid ' + color + '30', borderRadius: 8, padding: '10px 12px' }}>

                    <span style={{ fontWeight: 700, color: color, fontSize: 11 }}>{isBull ? '📊' : '📉'} FVG {fvg.type}</span>
                    <span className="badge b-accent" style={{ fontSize: 9 }}>ACTIF</span>
                  </div>
                  <div style={{ fontWeight: 700, color: 'var(--text)' }}>${fvg.low.toFixed(2)} – ${fvg.high.toFixed(2)}</div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{fvg.date}</div>
                </div>
              );

                  ? <span className="mc" style={{ fontSize: 11 }}>Aucun niveau</span>
                  : (liq.bsl_levels || []).map(function(l, i) {
                      return (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#ef4444', flexShrink: 0 }} />
                          <span style={{ fontWeight: 700 }}>${l.toFixed(2)}</span>
                          <span className="mc" style={{ fontSize: 10 }}>equal highs</span>
                        </div>
                      );
                    })

              </div>
              <div style={{ flex: 1, minWidth: 180 }}>
                <div style={{ fontSize: 10, color: '#10b981', marginBottom: 6, letterSpacing: 1 }}>🟢 SSL — SELL-SIDE LIQUIDITY (cibles baissières)</div>
                {(liq.ssl_levels || []).length === 0
                  ? <span className="mc" style={{ fontSize: 11 }}>Aucun niveau</span>
                  : (liq.ssl_levels || []).map(function(l, i) {
                      return (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#10b981', flexShrink: 0 }} />
                          <span style={{ fontWeight: 700 }}>${l.toFixed(2)}</span>
                          <span className="mc" style={{ fontSize: 10 }}>swing low</span>
                        </div>
                      );
                    })

              </div>
            </div>
          </div>

            <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap', marginTop: 8 }}>
              {[
                { label: 'Range High',  val: dp.range_high, color: '#ef4444' },
                { label: 'OTE High (62%)', val: dp.ote_high, color: '#3b82f6' },
                { label: 'Midpoint (50%)', val: dp.midpoint, color: 'var(--muted)' },
                { label: 'OTE Low (79%)', val: dp.ote_low,  color: '#3b82f6' },
                { label: 'Range Low',   val: dp.range_low,  color: '#10b981' },

                return r.val != null ? (
                  <div key={r.label} style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 9, color: r.color, letterSpacing: 1, marginBottom: 2 }}>{r.label}</div>
                    <div style={{ fontWeight: 700, color: r.color }}>${r.val.toFixed(2)}</div>
                  </div>
                ) : null;
              })}
            </div>
          </div>

          </div>
          )} {/* fin expertMode sections 1-4 */}

          {/* ── Section 5 : Setup */}
          {su.has_setup && (
            <div>
              <div className="stitle">🎯 TRADE SETUP</div>
              <div className="card mb16" style={{ border: '1px solid rgba(59,130,246,.35)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                    <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>{selectedTicker}</span>
                    <span className="badge b-bull">LONG</span>
                    <span className={'badge ' + (cf.conviction === 'HIGH' ? 'b-bull' : cf.conviction === 'MEDIUM' ? 'b-neutral' : 'b-muted')}>
                      {cf.conviction === 'HIGH' ? '🔥' : cf.conviction === 'MEDIUM' ? '📈' : '📊'} {cf.conviction}
                    </span>
                  </div>
                  <span className="badge b-accent">R:R {su.rr_ratio ? su.rr_ratio.toFixed(2) : '—'}R</span>
                </div>

                {/* Entry / Stop / Target */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 0, marginBottom: 12, border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden' }}>
                  {[
                    { label: 'ENTRY',  val: su.entry,  color: 'var(--text)' },
                    { label: 'STOP',   val: su.stop,   color: 'var(--bear)' },
                    { label: 'TARGET', val: su.target, color: 'var(--bull)' },
                  ].map(function(p, pi) {
                    return (
                      <div key={p.label} style={{ textAlign: 'center', padding: '10px 4px', borderLeft: pi > 0 ? '1px solid var(--border)' : 'none' }}>
                        <div style={{ fontSize: 9, color: p.color, marginBottom: 3 }}>{p.label}</div>
                        <div style={{ fontWeight: 700, color: p.color, fontSize: 15 }}>{p.val ? '$' + p.val.toFixed(2) : '—'}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Confluences — Expert seulement ; Simple → badge compact */}
                {!expertMode ? (
                  <div style={{ marginBottom: 12 }}>
                    <span style={{ fontSize: 10, color: 'var(--muted)' }}>Confluences : </span>
                    {(cf.details || []).filter(function(d) { return d.startsWith('✅'); }).map(function(d, i) {
                      return <span key={i} style={{ fontSize: 10, color: '#10b981', background: 'rgba(16,185,129,.06)', borderRadius: 3, padding: '1px 5px', marginLeft: 4 }}>{d.replace('✅ ', '')}</span>;
                    })}
                  </div>
                ) : (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 6, letterSpacing: 1 }}>CONFLUENCES ({cf.count}/6)</div>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {(cf.details || []).map(function(d, i) {
                        var ok = d.startsWith('✅');
                        return (
                          <span key={i} style={{ fontSize: 10, color: ok ? '#10b981' : 'var(--muted)', background: ok ? 'rgba(16,185,129,.06)' : 'transparent', padding: '2px 0' }}>{d}</span>
                        );
                      })}
                    </div>
                  </div>
                )}

                  var od = analysis && analysis.options_data;

                  var dirColor = od.overall_direction === 'BULLISH' ? '#10b981' : od.overall_direction === 'BEARISH' ? '#ef4444' : 'var(--muted)';
                  var pcrVal = od.pcr && od.pcr.value != null ? Number(od.pcr.value).toFixed(2) : null;
                  var pcrDir = od.pcr && od.pcr.direction;
                  var pcrColor = pcrDir === 'BULLISH' ? '#10b981' : pcrDir === 'BEARISH' ? '#ef4444' : 'var(--muted)';
                  var pcrFill = pcrVal ? Math.min(100, Math.round(parseFloat(pcrVal) / 2 * 100)) : 50;
                  var mp = od.max_pain;
                  var smDir = od.smart_money && od.smart_money.direction;

                  return (
                    <div style={{ marginBottom: 12, paddingTop: 10, borderTop: '1px solid var(--border)' }}>

                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8, alignItems: 'center' }}>
                        <span style={{ fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 4, color: dirColor, background: dirColor + '18', border: '1px solid ' + dirColor + '40' }}>{od.overall_direction} ({od.conviction})</span>
                        {smDir && <span style={{ fontSize: 10, color: smDir === 'BULLISH' ? '#10b981' : smDir === 'BEARISH' ? '#ef4444' : 'var(--muted)' }}>Smart Money: {smDir}</span>}
                      </div>
                      {pcrVal && (
                        <div style={{ marginBottom: 8 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--muted)', marginBottom: 3 }}>
                            <span>Put/Call Ratio</span>
                            <span style={{ color: pcrColor, fontWeight: 700 }}>{pcrVal} — {pcrDir}</span>
                          </div>
                          <div style={{ height: 5, background: 'var(--border)', borderRadius: 3, overflow: 'hidden' }}>
                            <div style={{ height: '100%', width: pcrFill + '%', background: pcrColor, borderRadius: 3, transition: 'width .3s' }} />
                          </div>
                        </div>
                      )}
                      {mp && mp.level != null && (
                        <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 6 }}>
                          Max Pain: <span style={{ fontWeight: 700, color: mp.bias === 'BULLISH' ? '#10b981' : mp.bias === 'BEARISH' ? '#ef4444' : 'var(--text)' }}>${Number(mp.level).toFixed(0)}</span>
                          <span style={{ marginLeft: 4 }}>({mp.vs_price} prix actuel → {mp.bias})</span>
                        </div>
                      )}
                      {unusual.length > 0 && (
                        <div>
                          <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Activités inhabituelles :</div>
                          {unusual.slice(0, 3).map(function(u, i) {
                            var uc = u.type === 'CALL' ? '#10b981' : '#ef4444';
                            return (
                              <div key={i} style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 2 }}>
                                <span style={{ fontWeight: 700, color: uc }}>{u.type === 'CALL' ? '🟢' : '🔴'} {u.type}</span>
                                {' '}strike ${u.strike} — Vol {Number(u.volume).toLocaleString()} / OI {Number(u.openInterest).toLocaleString()} <span style={{ color: uc }}>({u.ratio}×)</span> {u.moneyness} — {u.expiry}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* Raisonnement */}
                {su.reasoning && (
                  <div style={{ fontSize: 11, color: 'var(--muted)', fontStyle: 'italic', marginBottom: 12, borderLeft: '2px solid var(--border)', paddingLeft: 8 }}>
                    {su.reasoning}
                  </div>
                )}
                {expertMode && su.invalidation && (
                  <div style={{ fontSize: 11, color: 'var(--bear)', marginBottom: 12 }}>Invalidation : {su.invalidation}</div>
                )}

                <button className="btn btn-p" onClick={handleAddTrade}>
                  📝 Enregistrer ce trade dans le Journal
                </button>
              </div>
            </div>
          )}

          {/* Pas de setup */}
          {!su.has_setup && (
            <div>
              <div className="stitle">🎯 SETUP</div>
              <div className="card mb16" style={{ padding: '12px 16px' }}>
                <div style={{ color: 'var(--muted)', fontSize: 12 }}>
                  {su.reasoning || 'Conditions non réunies pour un trade'}
                </div>
                {expertMode && (
                  <div style={{ marginTop: 8 }}>
                    <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 6, letterSpacing: 1 }}>CONFLUENCES ({cf.count}/6)</div>
                    {(cf.details || []).map(function(d, i) {
                      return <div key={i} style={{ fontSize: 11, color: d.startsWith('✅') ? '#10b981' : 'var(--muted)' }}>{d}</div>;
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── Section 6 : Rapport texte (expert seulement) */}
          {expertMode && (
            <div>
              <div className="stitle">RAPPORT COMPLET</div>
              <div className="card mb16">
                <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 8 }}>
                  <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={copyReport}>📋 Copier le rapport</button>
                </div>
                <pre style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: 'var(--text)', whiteSpace: 'pre-wrap', lineHeight: 1.6, margin: 0 }}>
                  {analysis.report || '—'}
                </pre>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Loading spinner */}
      {(smcLoading || unifiedLoading) && !analysis && !unifiedData[selectedTicker] && (
        <div className="card" style={{ textAlign: 'center', padding: 40, color: 'var(--muted)' }}>
          <div style={{ fontSize: 24, marginBottom: 12 }}><span className="spin-anim">⟳</span></div>
          <div>Analyse en cours pour {selectedTicker}...</div>
          <div style={{ fontSize: 11, marginTop: 6 }}>Récupération des données yfinance + détection des structures</div>
        </div>
      )}

      {/* ── Scanner Unifié ─────────────────────────────────────────────── */}
      <div style={{ marginTop: 24, marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <div className="stitle" style={{ marginBottom: 0 }}>🎯 SCANNER UNIFIÉ</div>

            {scanLoading ? <span><span className="spin-anim">⟳</span> Scan...</span> : '🎯 Scanner Top 5'}
          </button>
        </div>
        {scanLoading && (
          <div className="card mc" style={{ padding: 20 }}><span className="spin-anim">⟳</span> Analyse en cours...</div>
        )}
        {!scanLoading && scanResults.length > 0 && scanResults.map(function(r, i) {
          var gc = _gradeColor(r.grade);
          var isAP = r.grade === 'A+';
          return (
            <div key={i} className="card" style={{ border: '1px solid ' + gc + '30', padding: '10px 14px', marginBottom: 8, background: isAP ? 'rgba(251,191,36,.03)' : 'transparent' }}>

      {smcPineModal && <PineConfigModal setup={smcPineModal} shares={null} onClose={function() { setSmcPineModal(null); }} />}
    </div>
  );
}
