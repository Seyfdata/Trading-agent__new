        <div style={{ background: '#1e293b', borderRadius: 6, height: 10, marginBottom: 8, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: pct + '%', background: barClr, borderRadius: 6, transition: 'width .4s' }} />
          {/* Milestone markers */}
          {[10, 20, 50].map(function(m) {
            return <div key={m} style={{ position: 'absolute', left: (m / 50 * 100) + '%', top: 0, bottom: 0, width: 2, background: '#0a0e17', opacity: 0.6 }} />;
          })}
        </div>
        <div style={{ fontSize: 12, color: barClr, marginBottom: 12 }}>{msg || (tc >= 50 ? '🎯 50+ trades atteints ! Tes métriques sont significatives' : '')}</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 14 }}>
          {milestones.map(function(m) {
            return (
              <div key={m.n} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}>
                <span style={{ color: m.done ? '#10b981' : '#334155', fontSize: 14 }}>{m.done ? '✅' : '🔲'}</span>
                <span style={{ color: m.done ? '#10b981' : '#475569' }}>{m.label} <span style={{ color: '#334155' }}>({m.desc})</span></span>
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 12, color: '#475569', fontStyle: 'italic', lineHeight: 1.6 }}>{quote}</div>
      </div>
    );
  })();

  // ── Section 4 : Règles d'or ───────────────────────────────────────────────
  var RULES = [
    { n: 1, icon: '🛑', rule: 'STOP LOSS = SACRÉ',          detail: 'Ne le déplace JAMAIS vers le bas' },
    { n: 2, icon: '💰', rule: 'RISQUE MAX 1%',               detail: 'Si tu perds, c\'est $100 max sur $10,000 de capital' },
    { n: 3, icon: '📊', rule: 'MAX 2 TRADES PAR JOUR',       detail: 'La qualité, pas la quantité' },
    { n: 4, icon: '🎯', rule: 'R:R MINIMUM 2.5×',            detail: 'Ne prends que les trades qui rapportent 2.5× ton risque' },
    { n: 5, icon: '🚫', rule: 'PAS DE REVENGE',              detail: 'Tu perds un trade ? C\'est fini pour la journée.' },
    { n: 6, icon: '📅', rule: 'KILLZONE UNIQUEMENT',         detail: 'Trade SEULEMENT entre 14h30 et 16h30 CET' },
    { n: 7, icon: '⚡', rule: 'SI "NO TRADE" → PAS DE TRADE', detail: 'Le dashboard a toujours raison' },
  ];
  var rulesSection = (
    <div style={{ marginBottom: 20 }}>
      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--muted)', fontSize: 11, fontWeight: 700, letterSpacing: 2, textTransform: 'uppercase', padding: 0, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'JetBrains Mono' }}
              onClick={function() { setRulesOpen(!rulesOpen); }}>
        {rulesOpen ? '▼' : '▶'} 📌 LES 7 RÈGLES QUI TE PROTÈGENT
      </button>
      {rulesOpen && (
        <div style={{ display: 'grid', gap: 8 }}>
          {RULES.map(function(r) {
            return (
              <div key={r.n} style={{ display: 'flex', alignItems: 'center', gap: 12, background: '#111827', border: '1px solid #1e293b', borderRadius: 6, padding: '10px 14px' }}>
                <span style={{ fontSize: 20 }}>{r.icon}</span>
                <div>
                  <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)' }}>{r.rule}</span>
                  <span style={{ fontSize: 12, color: '#64748b', marginLeft: 8 }}>— {r.detail}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  return (
    <div style={sWrap}>
      {dayPhaseBar}
      {eventBanner}
      {verdictBlock}
      {stepNav}
      {stepContent}
      {posSection}
      {progressSection}
      {rulesSection}
      {pineModal && <PineConfigModal setup={pineModal} shares={pineModal ? (computeSizing(pineModal) || {}).shares : null} onClose={function() { setPineModal(null); }} />}
    </div>
  );
}

  var scanLoadingState    = useState(false);
  var scanLoading         = scanLoadingState[0];
  var setScanLoading      = scanLoadingState[1];

  var prefillTradeState = useState(null);
  var prefillTrade      = prefillTradeState[0];
  var setPrefillTrade   = prefillTradeState[1];

  var posMonitorState = useState({ positions: [], alerts: [], checked_at: null, count: 0 });
  var posMonitor      = posMonitorState[0];
  var setPosMonitor   = posMonitorState[1];

  var discoveriesState   = useState([]);
  var discoveries        = discoveriesState[0];
  var setDiscoveries     = discoveriesState[1];

  var discLoadingState   = useState(false);
  var discLoading        = discLoadingState[0];
  var setDiscLoading     = discLoadingState[1];

  var tempWatchlistState = useState([]);
  var tempWatchlist      = tempWatchlistState[0];
  var setTempWatchlist   = tempWatchlistState[1];

  var extraTickersState  = useState([]);
  var extraTickers       = extraTickersState[0];
  var setExtraTickers    = extraTickersState[1];

  var smcForceTickerState = useState(null);
  var smcForceTicker      = smcForceTickerState[0];
  var setSmcForceTicker   = smcForceTickerState[1];

  var tpState        = useState({ total_closed: 0, target: 50, progress_pct: 0, next_milestone: 10, milestone_message: '📊 Encore 10 trades pour débloquer Sharpe/Sortino' });
  var tradesProgress = tpState[0];
  var setTradesProgress = tpState[1];

  useEffect(function() {
    // Charger chaque endpoint indépendamment — mise à jour dès réception, timeout 15s
    var eps = ['market', 'tickers', 'reddit', 'news', 'macro', 'history'];
    eps.forEach(function(ep) {
      var ctrl = new AbortController();
      var tid  = setTimeout(function() { ctrl.abort(); }, 15000);
      fetch('/api/' + ep, { signal: ctrl.signal })
        .then(function(r) { return r.json(); })
        .then(function(json) {
          clearTimeout(tid);
          setData(function(prev) {
            var next = Object.assign({}, prev);
            next[ep] = json;
            return next;
          });
          setLastUpd(new Date());
        })
        .catch(function() { clearTimeout(tid); /* garde données démo */ });
    });

    // Progression trades (une fois au chargement)
    fetch('/api/trades?limit=1')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.total_closed != null) setTradesProgress({
          total_closed:      d.total_closed,
          target:            d.target            || 50,
          progress_pct:      d.progress_pct      || 0,
          next_milestone:    d.next_milestone,
          milestone_message: d.milestone_message || '',
        });
      })
      .catch(function() {});

    // Horloge
    var clk = setInterval(function() { setTime(new Date()); }, 1000);

    // ── Alerts auto-refresh ──────────────────────────────────────────────
    var ALERT_INTERVAL  = 5 * 60;   // 5 min en secondes
    var NEWS_INTERVAL   = 15 * 60;  // 15 min en secondes
    var alertTick       = ALERT_INTERVAL;
    var newsTick        = NEWS_INTERVAL;
    var posTick         = ALERT_INTERVAL;

    function fetchAlerts(force) {
      var url = force ? '/api/alerts?force=true' : '/api/alerts';
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(json) {
          _kzRef.active = !!json.in_killzone;
          setAlertData(function(prev) {
            var prevCount = (prev.alerts || []).length;
            var newCount  = (json.alerts || []).length;
            if (newCount > prevCount) {
              setUnread(function(u) { return u + (newCount - prevCount); });
            }
            return json;
          });
        })
        .catch(function() {});
    }

    function fetchPositions() {
      fetch('/api/positions/monitor')
        .then(function(r) { return r.json(); })
        .then(function(json) { setPosMonitor(json); })
        .catch(function() {});
    }

    function fetchAlertNews() {
      fetch('/api/alerts/news')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          if (json.new_news && json.new_news.length > 0) {
            setLiveNews(function(prev) { return json.new_news.concat(prev).slice(0, 30); });
            setUnread(function(u) { return u + json.new_news.length; });
          }
        })
        .catch(function() {});
    }

    // Premier appel immédiat
    fetchAlerts();
    fetchAlertNews();
    fetchPositions();

    // Auto-load résumé post-market si on est après 16h30 CET
    if (isCETAfterKillzone()) {
      fetch('/api/postmarket')
        .then(function(r) { return r.json(); })
        .then(function(json) { setPmData(json); })
        .catch(function() {});
    }

    var alertTimer = setInterval(function() {
      alertTick--;
      newsTick--;
      posTick--;
      setCountdown(alertTick);
      // Expiration du test mode (via ref pour éviter stale closure)
      if (_testModeRef.active && _testModeRef.expiry && Date.now() >= _testModeRef.expiry) {
        _testModeRef.active = false;
        _testModeRef.expiry = null;
        setTestMode(false);
        setTestExpiry(null);
      }
      if (alertTick <= 0) {
        fetchAlerts(_testModeRef.active);
        alertTick = ALERT_INTERVAL;
      }
      if (newsTick <= 0) {
        fetchAlertNews();
        newsTick = NEWS_INTERVAL;
      }
      if (posTick <= 0) {
        if (_testModeRef.active || _kzRef.active) { fetchPositions(); }
        posTick = ALERT_INTERVAL;
      }
    }, 1000);

    return function() { clearInterval(clk); clearInterval(alertTimer); };
  }, []);

  function activateTestMode() {
    var expiry = Date.now() + 5 * 60 * 1000;   // 5 min
    _testModeRef.active = true;
    _testModeRef.expiry = expiry;
    setTestMode(true);
    setTestExpiry(expiry);
    fetch('/api/alerts?force=true')
      .then(function(r) { return r.json(); })
      .then(function(json) {
        setAlertData(function(prev) {
          var prevCount = (prev.alerts || []).length;
          var newCount  = (json.alerts || []).length;
          if (newCount > prevCount) { setUnread(function(u) { return u + (newCount - prevCount); }); }
          return json;
        });
      })
      .catch(function() {});
  }

  function handleRefresh() {
    if (loading) return;
    setRefreshMsg('scanning');
    fetch('/api/refresh', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        var dur = json.duration != null ? Math.round(json.duration) : '?';
        // Recharger chaque endpoint indépendamment
        var eps = ['market', 'tickers', 'reddit', 'news', 'macro', 'history'];
        eps.forEach(function(ep) {
          var ctrl = new AbortController();
          var tid  = setTimeout(function() { ctrl.abort(); }, 15000);
          fetch('/api/' + ep, { signal: ctrl.signal })
            .then(function(r) { return r.json(); })
            .then(function(edata) {
              clearTimeout(tid);
              setData(function(prev) { var n = Object.assign({}, prev); n[ep] = edata; return n; });
              setLastUpd(new Date());
            })
            .catch(function() { clearTimeout(tid); });
        });
        setRefreshMsg('done:' + dur + 's');
        setTimeout(function() { setRefreshMsg('idle'); }, 3000);
      })
      .catch(function() {
        setRefreshMsg('error');
        setTimeout(function() { setRefreshMsg('idle'); }, 3000);
      });
  }

  function loadPostmarket() {
    if (pmLoading) return;
    setPmLoading(true);
    fetch('/api/postmarket')
      .then(function(r) { return r.json(); })
      .then(function(json) { setPmData(json); setPmLoading(false); })
      .catch(function() { setPmLoading(false); });
  }

  function loadSetups() {
    if (setupsLoading) return;
    setSetupsLoading(true);
    var extra = tempWatchlist.map(function(t) { return t.ticker; }).join(',');
    var url   = extra ? '/api/setups?extra_tickers=' + encodeURIComponent(extra) : '/api/setups';
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(json) { setSetupsData(json); setSetupsLoading(false); })
      .catch(function() { setSetupsLoading(false); });
  }

  function loadSmcAnalysis(ticker) {
    if (smcLoading) return;
    setSmcLoading(true);
    fetch('/api/analysis/' + encodeURIComponent(ticker))
      .then(function(r) { return r.json(); })
      .then(function(json) {
        setSmcData(function(prev) { var n = Object.assign({}, prev); n[ticker] = json; return n; });
        setSmcLoading(false);
      })
      .catch(function() { setSmcLoading(false); });
  }

  function loadUnifiedAnalysis(ticker) {
    if (unifiedLoading) return;
    setUnifiedLoading(true);
    fetch('/api/unified/' + encodeURIComponent(ticker))
      .then(function(r) { return r.json(); })
      .then(function(json) {
        setUnifiedData(function(prev) { var n = Object.assign({}, prev); n[ticker] = json; return n; });
        setUnifiedLoading(false);
      })
      .catch(function() { setUnifiedLoading(false); });
  }

  function loadScanUnified() {
    if (scanLoading) return;
    setScanLoading(true);
    fetch('/api/unified?top_n=5')
      .then(function(r) { return r.json(); })
      .then(function(json) {
        setScanResults(json.analyses || []);
        setScanLoading(false);
      })
      .catch(function() { setScanLoading(false); });
  }

  function handleAddTradeFromSmc(tradeData) {
    setPrefillTrade(tradeData);
    setTab('journal');
  }

  function loadPositionMonitor() {
    fetch('/api/positions/monitor')
      .then(function(r) { return r.json(); })
      .then(function(json) { setPosMonitor(json); })
      .catch(function() {});
  }

  function loadDiscoveries() {
    if (discLoading) return;
    setDiscLoading(true);
    fetch('/api/reddit/discoveries')
      .then(function(r) { return r.json(); })
      .then(function(json) { setDiscoveries(json.discoveries || []); setDiscLoading(false); })
      .catch(function() { setDiscLoading(false); });
  }

  function addTempTicker(ticker, name, sector) {
    fetch('/api/watchlist/temp', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ ticker: ticker, name: name || ticker, sector: sector || null }),
    }).then(function() {
      setTempWatchlist(function(prev) {
        if (prev.find(function(t) { return t.ticker === ticker; })) return prev;
        return prev.concat([{ ticker: ticker, name: name || ticker, sector: sector, is_temp: true }]);
      });
    }).catch(function() {});
  }

  function removeTempTicker(ticker) {
    fetch('/api/watchlist/temp/' + encodeURIComponent(ticker), { method: 'DELETE' })
      .then(function() {
        setTempWatchlist(function(prev) { return prev.filter(function(t) { return t.ticker !== ticker; }); });
      }).catch(function() {});
  }

  function analyzeDiscovery(ticker) {
    setExtraTickers(function(prev) {
      if (prev.indexOf(ticker) >= 0) return prev;
      return prev.concat([ticker]);
    });
    setSmcForceTicker(ticker);
    setTab('smc');
    loadSmcAnalysis(ticker);
    loadUnifiedAnalysis(ticker);
  }

  var fmtTime = function(d) { return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
  var fmtDate = function(d) { return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };

  var regime  = data.market ? data.market.regime  : null;
  var verdict = data.macro  ? data.macro.verdict   : null;
  var verdictCls = verdict === 'GO' ? 'b-bull' : verdict === 'NO TRADE' ? 'b-bear' : 'b-neutral';

  return (
    <div className="app">
      <header className="header">
        <div>
          <div className="header-title">SMC-AI MORNING BRIEF v2</div>
          <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{fmtDate(time)}</div>
        </div>
        <div className="header-right">
          {regime  && <span className={'rpill rp-' + regime}>{regime}</span>}
          {verdict && <span className={'badge ' + verdictCls}>{verdict}</span>}
          {testMode
            ? <span className="kz-live" style={{ background: 'rgba(249,115,22,.15)', color: '#f97316', borderColor: 'rgba(249,115,22,.4)' }}>🧪 TEST MODE</span>
            : alertData.in_killzone
              ? <span className="kz-live">🔴 LIVE 14h30-16h30</span>
              : <span className="kz-off">⏸️ Hors session</span>
          }
          <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--muted)' }}>{fmtTime(time)}</span>
          <button
            className={'btn btn-scan' + (loading ? ' is-scanning' : '')}
            onClick={handleRefresh}
            disabled={loading}
            style={refreshMsg === 'error' ? { color: '#ef4444', borderColor: '#ef4444' } : {}}
          >
            {loading
              ? <span><span className="spin-anim">⟳</span> Scan en cours...</span>
              : refreshMsg.startsWith('done:') ? ('✅ Scan terminé en ' + refreshMsg.slice(5))
              : refreshMsg === 'error' ? '❌ Erreur'
              : '🔄 Rafraîchir'}
          </button>
          <button
            className="btn"
            onClick={function() { setLightMode(!lightMode); }}
            title={lightMode ? 'Passer en mode sombre' : 'Passer en mode clair'}
            style={{ fontSize: 15, padding: '5px 10px', lineHeight: 1 }}
          >{lightMode ? '🌙' : '☀️'}</button>
        </div>
      </header>

      <nav className="tabs" style={{ justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex' }}>
          {TABS.map(function(t) {
            return (
              <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')} onClick={function() {
                setTab(t.id);
                if (t.id === 'alerts') { setUnread(0); }
              }}>
                {t.label}
                {t.id === 'alerts' && unread > 0 && (
                  <span className="tab-badge">{unread > 9 ? '9+' : unread}</span>
                )}
              </button>
            );
          })}
        </div>
        {lastUpd && (
          <span className="mc" style={{ fontSize: 10, padding: '0 16px', flexShrink: 0 }}>
            Dernière MAJ : {lastUpd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
          </span>
        )}
      </nav>

      <main className="content">
        {tab === 'overview'  && <OverviewTab  data={data} postmarketData={pmData} pmLoading={pmLoading} onLoadPostmarket={loadPostmarket} setupsData={setupsData} onGoToSetups={function() { setTab('setups'); }} posMonitor={posMonitor} scanResults={scanResults} onGoToSmc={function() { setTab('smc'); }} onGoToReddit={function() { setTab('reddit'); }} onGoToProposals={function() { setTab('proposals'); }} tradesProgress={tradesProgress} />}
        {tab === 'coach'     && <CoachTab data={data} posMonitor={posMonitor} scanResults={scanResults} scanLoading={scanLoading} onScan={loadScanUnified} onRefresh={handleRefresh} refreshLoading={loading} lastUpd={lastUpd} onGoToJournal={handleAddTradeFromSmc} tradesProgress={tradesProgress} />}
        {tab === 'proposals' && <PropositionsTab onGoToSmc={function(ticker) { setSmcForceTicker(ticker); setTab('smc'); }} onGoToJournal={handleAddTradeFromSmc} />}
        {tab === 'watchlist' && <WatchlistTab data={data} onGoToSmc={function(ticker) { setSmcForceTicker(ticker); setTab('smc'); }} />}
        {tab === 'reddit'    && <RedditTab data={data} discoveries={discoveries} discLoading={discLoading} onLoadDisc={loadDiscoveries} onAnalyzeTk={analyzeDiscovery} onGoToSetups={function(ticker) { setTab('setups'); }} onAddTemp={addTempTicker} tempWatchlist={tempWatchlist} />}
        {tab === 'news'      && <NewsTab      data={data} />}
        {tab === 'alerts'    && <AlertsTab alertData={alertData} liveNews={liveNews} countdown={(alertData.in_killzone || testMode) ? countdown : null} testMode={testMode} onSimulate={activateTestMode} posMonitor={posMonitor} />}
        {tab === 'setups'    && <SetupsTab    setupsData={setupsData} setupsLoading={setupsLoading} onScan={loadSetups} onAnalyzeTk={analyzeDiscovery} />}
        {tab === 'pullback'  && <PullbackTab onGoToSmc={function(ticker) { setSmcForceTicker(ticker); setTab('smc'); }} />}
        {tab === 'rs_scout'  && <RelStrengthTab onGoToSmc={function(ticker) { setSmcForceTicker(ticker); setTab('smc'); }} />}
        {tab === 'smc'       && <ErrorBoundary><SmcTab smcData={smcData} smcLoading={smcLoading} unifiedData={unifiedData} unifiedLoading={unifiedLoading} scanResults={scanResults} scanLoading={scanLoading} extraTickers={extraTickers} forceTicker={smcForceTicker} onClearForceTicker={function() { setSmcForceTicker(null); }} onAnalyze={loadSmcAnalysis} onUnified={loadUnifiedAnalysis} onScan={loadScanUnified} onAddTrade={handleAddTradeFromSmc} /></ErrorBoundary>}
        {tab === 'journal'   && <ErrorBoundary><JournalTab posMonitor={posMonitor} inKillzone={alertData.in_killzone || testMode} onRefreshPositions={loadPositionMonitor} prefillTrade={prefillTrade} onClearPrefill={function() { setPrefillTrade(null); }} /></ErrorBoundary>}
        {tab === 'history'   && <ErrorBoundary><PerformanceTab lightMode={lightMode} /></ErrorBoundary>}
        {tab === 'guide'     && <GuideTab />}
      </main>
      <footer style={{ padding: '8px 24px', borderTop: '1px solid var(--border)', background: 'var(--card)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span className="mc" style={{ fontSize: 10 }}>Données live — Killzone 14h30-16h30 CET</span>
        <span className="mc" style={{ fontSize: 10 }}>SMC-AI Trading Agent v2</span>
      </footer>
    </div>
  );
}

// ── Rendu ─────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(TradingDashboard, null)
);
</script>
</body>
</html>
