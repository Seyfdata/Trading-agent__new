class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        style: { padding: 24, background: '#1a0000', border: '1px solid #ef4444', borderRadius: 8, color: '#ef4444', fontFamily: 'monospace', fontSize: 12 }
      }, 'ERREUR COMPOSANT: ' + (this.state.error && this.state.error.message ? this.state.error.message : String(this.state.error)));
    }
    return this.props.children;
  }
}

// ── Utilitaires ───────────────────────────────────────────────────────────

const fmt    = function(n, d) { d = d == null ? 2 : d; return n != null ? Number(n).toFixed(d) : '—'; };
const fmtPct = function(n) { return n != null ? (n > 0 ? '+' : '') + fmt(n) + '%' : '—'; };
const chgClr = function(n) { return n > 0 ? '#10b981' : n < 0 ? '#ef4444' : '#64748b'; };
const sntClr = function(s) { return s === 'BULL' ? '#10b981' : s === 'BEAR' ? '#ef4444' : '#f59e0b'; };
const scrClr = function(s) { return s >= 70 ? '#10b981' : s >= 50 ? '#3b82f6' : s >= 30 ? '#f59e0b' : '#ef4444'; };

const CHART_COLORS = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444'];
const RANK_COLORS  = { 1: '#3b82f6', 2: '#8b5cf6', 3: '#10b981' };
const STYLE_COLORS = { SWING: '#3b82f6', PUMP: '#ef4444', MIXED: '#f59e0b', DAY: '#8b5cf6' };

function isCETAfterKillzone() {
  try {
    var d = new Date();
    var formatter = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', hour12: false });
    var parts = formatter.formatToParts(d);
    var h = parseInt(parts.find(function(p) { return p.type === 'hour';   }).value, 10);
    var m = parseInt(parts.find(function(p) { return p.type === 'minute'; }).value, 10);
    return h * 60 + m >= 16 * 60 + 30;
  } catch(e) { return false; }
}

// ── Composants de base ────────────────────────────────────────────────────

function ScoreBar(props) {
  var val = props.val || 0;
  var max = props.max || 25;
  var color = props.color || '#3b82f6';
  return React.createElement('div', { className: 'strack' },
    React.createElement('div', { className: 'sfill', style: { width: (val / max * 100) + '%', background: color } })
  );
}

// ── Instrument Card ───────────────────────────────────────────────────────

function InstrumentCard(props) {
  var name = props.name;
  var data = props.data || {};
  var price = data.price;
  var chg   = data.change;
  var color = chgClr(chg);
  var arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '—';
  return (
    <div className="card card-sm">
      <div className="inst-name">{name}</div>
      <div className="inst-price" style={{ color: price != null ? 'var(--text)' : 'var(--muted)' }}>
        {price != null ? fmt(price) : '—'}
      </div>
      <div className="inst-chg" style={{ color: color }}>
        {price != null ? arrow + ' ' + fmtPct(chg) : 'N/A'}
      </div>
    </div>
  );
}

// ── Barre régime + verdict ────────────────────────────────────────────────

function RegimeBar(props) {
  var market = props.market || {};
  var macro  = props.macro  || {};
  var regime  = market.regime;
  var score   = market.score;
  var sizing  = market.sizing_recommendation;
  var verdict = macro.verdict;
  var events  = macro.events || [];
  var earnings = macro.earnings_today || [];

  var verdictCls = verdict === 'GO' ? 'b-bull' : verdict === 'NO TRADE' ? 'b-bear' : 'b-neutral';

  return (
    <div className="card mb16 row wrap g12" style={{ padding: '10px 16px' }}>
      {regime && (
        <div className="row g8">
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>RÉGIME</span>
          <span className={'rpill rp-' + regime}>{regime}</span>
          {score != null && <span style={{ fontWeight: 700, color: sntClr(regime) }}>{score}/100</span>}
        </div>
      )}
      {sizing && (
        <div className="row g8">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>SIZING</span>
          <span style={{ fontWeight: 700 }}>{sizing}</span>
        </div>
      )}
      {verdict && (
        <div className="row g8">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>VERDICT</span>
          <span className={'badge ' + verdictCls}>{verdict}</span>
          {macro.risque && <span className="mc" style={{ fontSize: 10 }}>{macro.risque}</span>}
        </div>
      )}
      {events.length > 0 && (
        <div className="row g6 wrap">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>EVENTS</span>
          {events.map(function(e, i) {
            return <span key={i} className={'badge ' + (e.impact === 'FORT' ? 'b-bear' : 'b-neutral')}>{e.name}</span>;
          })}
        </div>
      )}
      {earnings.length > 0 && (
        <div className="row g6 wrap">
          <div className="vd" />
          <span className="mc" style={{ fontSize: 10, letterSpacing: 1 }}>EARNINGS</span>
          {earnings.map(function(t) { return <span key={t} className="badge b-bear">{t}</span>; })}
        </div>
      )}
    </div>
  );
}

// ── SHAP-style Score Breakdown ────────────────────────────────────────────

function ShapBar(props) {
  var label    = props.label;
  var score    = props.score != null ? props.score : 0;
  var baseline = props.baseline != null ? props.baseline : 12.5;
  var maxDev   = props.maxDev   != null ? props.maxDev   : 12.5;
  var isKey    = props.isKey;
  var dev      = score - baseline;
  var pct      = Math.min(Math.abs(dev) / maxDev * 50, 50);
  var barColor = dev >= 0 ? '#10b981' : '#ef4444';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
      <div style={{ width: 72, fontSize: 10, color: 'var(--muted)', textAlign: 'right', flexShrink: 0 }}>{label}</div>
      <div style={{ flex: 1, position: 'relative', height: 8 }}>
        <div style={{ position: 'absolute', left: '50%', top: 0, bottom: 0, width: 1, background: 'rgba(100,116,139,0.25)' }} />
        {dev >= 0
          ? <div style={{ position: 'absolute', left: '50%', top: 0, height: 8, width: pct + '%', background: barColor, borderRadius: '0 4px 4px 0', opacity: 0.85 }} />
          : <div style={{ position: 'absolute', right: '50%', top: 0, height: 8, width: pct + '%', background: barColor, borderRadius: '4px 0 0 4px', opacity: 0.85 }} />
        }
      </div>
      <div style={{ width: 30, fontSize: 11, fontWeight: 700, color: barColor, textAlign: 'right', flexShrink: 0 }}>{score}</div>
      <div style={{ width: 14, flexShrink: 0 }}>{isKey && <span title="Key Driver" style={{ fontSize: 11 }}>🔑</span>}</div>
    </div>
  );
}

function ShapScoreBreakdown(props) {
  var t = props.ticker;
  var comps = [
    { label: 'SMA200', score: t.sma200_score || 0 },
    { label: 'Volume', score: t.volume_score  || 0 },
    { label: 'Reddit', score: t.reddit_score  || 0 },
    { label: 'News',   score: t.news_score    || 0 },
  ];
  var maxScore  = Math.max.apply(null, comps.map(function(c) { return c.score; }));
  var hasCross  = t.cross_validation_score != null;
  return (
    <div>
      <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, marginBottom: 8 }}>
        SHAP — CONTRIBUTION / 25 <span style={{ opacity: 0.5, marginLeft: 4 }}>baseline 12.5</span>
      </div>
      {comps.map(function(c) {
        return <ShapBar key={c.label} label={c.label} score={c.score} isKey={c.score === maxScore} />;
      })}
      {hasCross && (
        <div style={{ marginTop: 6, borderTop: '1px solid rgba(100,116,139,0.2)', paddingTop: 6 }}>
          <ShapBar label="Cross-val" score={t.cross_validation_score} baseline={0} maxDev={10}
            isKey={false} />
          <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 2, paddingLeft: 80 }}>
            fiabilité du signal — échelle –10 / +10
          </div>
        </div>
      )}
    </div>
  );
}

// ── Top 3 ─────────────────────────────────────────────────────────────────

function Top3Section(props) {
  var tickers = props.tickers || [];
  var top3 = tickers.filter(function(t) { return t.top3; });
  if (!top3.length) return <div className="error-box mc">Pas encore de scores calculés</div>;

  return (
    <div className="g3 mb16">
      {top3.map(function(t) {
        var color = RANK_COLORS[t.rank] || '#64748b';
        var m = t.market || {};
        return (
          <div key={t.ticker} className={'t3card r' + t.rank}>
            <div className="t3bg">#{t.rank}</div>
            <div className="rowb mb12">
              <div>
                <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                   className="tv-link t3ticker" style={{ color: color }}>
                  {t.ticker} 📈
                </a>
                <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 3 }}>
                  {m.price != null ? '$' + fmt(m.price) : ''}
                  {m.change_day != null && (
                    <span style={{ color: chgClr(m.change_day), marginLeft: 6 }}>{fmtPct(m.change_day)}</span>
                  )}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="t3score" style={{ color: color }}>{Math.round(t.total_score || 0)}</div>
                <div className="t3lbl">/ 100</div>
              </div>
            </div>
            {(function() {
              var comps = [
                { label: 'SMA200', score: t.sma200_score || 0 },
                { label: 'Volume', score: t.volume_score  || 0 },
                { label: 'Reddit', score: t.reddit_score  || 0 },
                { label: 'News',   score: t.news_score    || 0 },
              ].sort(function(a, b) { return b.score - a.score; });
              var volStr = (comps[0].label === 'Volume' || comps[1].label === 'Volume') && m.vol_relative
                ? function(c) { return c.label === 'Volume' ? 'Volume ×' + fmt(m.vol_relative, 1) : c.label + ' ' + c.score + '/25'; }
                : function(c) { return c.label + ' ' + c.score + '/25'; };
              return (
                <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 10, lineHeight: 1.5 }}>
                  <span style={{ color: '#f59e0b', marginRight: 4 }}>🔑</span>
                  <span style={{ color: 'var(--text)' }}>{volStr(comps[0])}</span>
                  <span style={{ margin: '0 4px', opacity: 0.4 }}>·</span>
                  <span style={{ color: 'var(--text)' }}>{volStr(comps[1])}</span>
                </div>
              );
            })()}
            <div className="row g6 wrap">
              {m.dist_sma200 != null && (
                <span className={'badge ' + (m.dist_sma200 < 0 ? 'b-bull' : 'b-accent')}>
                  SMA200 {fmtPct(m.dist_sma200)}
                </span>
              )}
              {m.vol_relative != null && m.vol_relative >= 1.5 && (
                <span className="badge b-purple">VOL ×{fmt(m.vol_relative, 1)}</span>
              )}
              {t.reddit && t.reddit.mentions > 4 && (
                <span className="badge b-accent">Reddit ×{t.reddit.mentions}</span>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PostMarketSection(props) {
  var postmarketData   = props.postmarketData;
  var pmLoading        = props.pmLoading;
  var onLoadPostmarket = props.onLoadPostmarket || function() {};
  var afterKZ = isCETAfterKillzone();

  if (!postmarketData && !pmLoading) {
    return (
      <div className="card" style={{ marginTop: 16 }}>
        <div className="rowb">
          <div>
            <div className="stitle" style={{ marginBottom: 4 }}>RÉSUMÉ DU JOUR</div>
            <div className="mc" style={{ fontSize: 11 }}>
              {afterKZ ? 'Session terminée — données disponibles' : 'Disponible automatiquement après 16h30 CET'}
            </div>
          </div>
          <button className="btn btn-p" onClick={onLoadPostmarket}>📊 Voir le résumé</button>
        </div>
      </div>
    );
  }

  if (pmLoading) {
    return (
      <div className="card" style={{ marginTop: 16, textAlign: 'center', padding: 24 }}>
        <span className="mc" style={{ fontSize: 12 }}>Chargement du résumé du jour...</span>
      </div>
    );
  }

  if (postmarketData && postmarketData.error) {
    return (
      <div className="card" style={{ marginTop: 16 }}>
        <div className="stitle">RÉSUMÉ DU JOUR</div>
        <div className="mc" style={{ fontSize: 11 }}>Données indisponibles — {postmarketData.error}</div>
      </div>
    );
  }

  var gainers = (postmarketData && postmarketData.top_gainers) || [];
  var losers  = (postmarketData && postmarketData.top_losers)  || [];
  var mc      = (postmarketData && postmarketData.market_close) || {};
  var kzCount = (postmarketData && postmarketData.killzone_alerts_count) || 0;

  function MoverRow(mp) {
    var item  = mp.item;
    var bull  = mp.bull;

    var sign  = item.change_pct >= 0 ? '+' : '';

      <div className="rowb" style={{ padding: '6px 0', borderBottom: '1px solid rgba(30,41,59,.3)' }}>
        <div className="row g8">
          <a href={'https://www.tradingview.com/chart/?symbol=' + item.ticker} target="_blank" rel="noopener"
             className="tv-link" style={{ color: color, fontWeight: 700, minWidth: 44 }}>
            {item.ticker}
          </a>
          <span style={{ color: color, fontWeight: 600 }}>{sign}{fmt(item.change_pct)}%</span>
        </div>
        <span className="mc" style={{ fontSize: 11 }}>Vol ×{fmt(item.vol_ratio, 1)}</span>
      </div>
    );
  }

  return (

            {mc.vix && <span><span className="mc" style={{ fontSize: 10 }}>VIX </span><span style={{ fontWeight: 600 }}>{fmt(mc.vix.price)}</span><span style={{ color: chgClr(mc.vix.change_pct), fontSize: 11 }}> ({mc.vix.change_pct >= 0 ? '+' : ''}{fmt(mc.vix.change_pct)}%)</span></span>}
          </div>

function MacroIndicatorsSection(props) {
  var indicators = props.indicators || [];
  if (indicators.length === 0) return null;
  return (
    <div style={{ marginBottom: 16 }}>
      <div className="stitle">INDICATEURS MACRO</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
        {indicators.map(function(ind) {
          var chg   = ind.change_pct;
          var color = chgClr(chg);
          var arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '—';
          return (
            <div key={ind.symbol} className="card" style={{ padding: '8px 12px' }}>
              <div style={{ fontSize: 9, color: 'var(--muted)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 3 }}>
                {ind.name}
              </div>
              <div style={{ fontSize: 16, fontWeight: 700, color: ind.price != null ? 'var(--text)' : 'var(--muted)' }}>
                {ind.price != null ? fmt(ind.price) : '—'}
              </div>
              <div style={{ fontSize: 11, color: color, marginTop: 2 }}>
                {ind.price != null ? arrow + ' ' + fmtPct(chg) : 'N/A'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OverviewTab(props) {
  var data             = props.data;
  var postmarketData   = props.postmarketData;
  var pmLoading        = props.pmLoading;
  var onLoadPostmarket = props.onLoadPostmarket || function() {};
  var setupsData       = props.setupsData;
  var onGoToSetups     = props.onGoToSetups     || function() {};
  var posMonitor       = props.posMonitor        || { positions: [], count: 0 };
  var inst = (data.market && data.market.instruments) ? data.market.instruments : {};
  var macroInds = (data.market && data.market.macro_indicators) ? data.market.macro_indicators : [];
  var redditItems = (data.reddit && data.reddit.data) ? data.reddit.data.filter(function(r) { return r.in_watchlist; }).slice(0, 5) : [];
  var newsItems = data.news ? [].concat(data.news.ticker_news || [], data.news.market_news || []).slice(0, 5) : [];

  return (
    <div>
      <div className="stitle">INDICATEURS MARCHÉ</div>
      <div className="g5 mb16">
        <InstrumentCard name="S&amp;P 500"    data={inst.spy}   />
        <InstrumentCard name="NASDAQ 100"     data={inst.qqq}   />
        <InstrumentCard name="VIX"            data={inst.vix}   />
        <InstrumentCard name="DOLLAR (DXY)"   data={inst.dxy}   />
        <InstrumentCard name="US 10Y YIELD"   data={inst.us10y} />

      <MacroIndicatorsSection indicators={macroInds} />

      <div className="stitle">TOP 3 DU JOUR</div>
      <Top3Section tickers={data.tickers ? data.tickers.tickers : []} />

      {setupsData && (setupsData.setups || []).length > 0 && (
        <div className="card mb16" style={{ padding: '10px 16px' }}>
          <div className="rowb">
            <div className="row g8">
              <span className="stitle" style={{ marginBottom: 0 }}>🎯 SETUPS DÉTECTÉS</span>
              <span className="badge b-accent">{(setupsData.setups || []).length}</span>
            </div>
            <button className="btn" style={{ fontSize: 10, padding: '3px 10px' }} onClick={onGoToSetups}>
              Voir détails →
            </button>
          </div>
          <div className="row g12 wrap" style={{ marginTop: 8 }}>
            {(setupsData.setups || []).map(function(s, i) {
              var color = _SETUP_COLOR[s.setup_type] || '#64748b';
              return (
                <span key={i} style={{ fontSize: 11 }}>
                  <span style={{ color: color, fontWeight: 700 }}>{s.ticker}</span>
                  <span className="mc"> {_SETUP_SHORT[s.setup_type] || '?'}</span>
                </span>
              );
            })}
          </div>
        </div>
      )}

      {posMonitor.positions && posMonitor.positions.length > 0 && (
        <div className="card mb16" style={{ padding: '10px 16px' }}>
          <div className="rowb mb8">
            <div className="row g8">
              <span className="stitle" style={{ marginBottom: 0 }}>📊 POSITIONS OUVERTES</span>
              <span className="badge b-accent">{posMonitor.count || posMonitor.positions.length}</span>
            </div>
            {posMonitor.checked_at && (
              <span className="mc" style={{ fontSize: 10 }}>Vérif: {posMonitor.checked_at}</span>
            )}
          </div>
          {posMonitor.positions.map(function(p) {
            var pnlColor = p.pnl_latent >= 0 ? 'var(--bull)' : 'var(--bear)';
            var pnlStr   = (p.pnl_latent >= 0 ? '+' : '') + '$' + Math.abs(p.pnl_latent).toFixed(0);
            var rStr     = (p.r_current >= 0 ? '+' : '') + p.r_current.toFixed(1) + 'R';
            var alertBadge = null;
            if (p.status_alert === 'TARGET_HIT')  { alertBadge = { cls: 'b-bull', txt: '🎯 TARGET' }; }
            if (p.status_alert === 'STOP_HIT')    { alertBadge = { cls: 'b-bear', txt: '🛑 STOP' }; }
            if (p.status_alert === 'NEAR_TARGET') { alertBadge = { cls: 'b-neutral', txt: '↗ TARGET' }; }
            if (p.status_alert === 'NEAR_STOP')   { alertBadge = { cls: 'b-neutral', txt: '↘ STOP' }; }
            return (
              <div key={p.id} className="rowb" style={{ padding: '5px 0', borderBottom: '1px solid rgba(30,41,59,.3)' }}>
                <div className="row g8">
                  <span style={{ fontWeight: 700, minWidth: 48 }}>{p.ticker}</span>
                  {alertBadge && <span className={'badge ' + alertBadge.cls} style={{ fontSize: 9 }}>{alertBadge.txt}</span>}
                </div>
                <span style={{ fontWeight: 700, color: pnlColor, fontSize: 12 }}>{rStr} ({pnlStr})</span>
              </div>
            );
          })}
        </div>
      )}

      <div className="g2">
        <div>
          <div className="stitle">REDDIT BUZZ (watchlist)</div>
          <div className="card">
            {redditItems.map(function(r) {
              return (
                <div key={r.ticker} className="rowb" style={{ padding: '7px 0', borderBottom: '1px solid rgba(30,41,59,.35)' }}>
                  <div className="row g8">
                    <span style={{ fontWeight: 700, width: 48 }}>{r.ticker}</span>
                    <span className="mc" style={{ fontSize: 11 }}>{r.mentions} mentions</span>
                  </div>
                  <span className={'badge ' + (r.sentiment_label === 'BULL' ? 'b-bull' : r.sentiment_label === 'BEAR' ? 'b-bear' : 'b-neutral')}>{r.sentiment_label}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div className="stitle">NEWS RÉCENTES</div>
          <div className="card">
            {newsItems.map(function(n, i) {
              return (
                <div key={i} style={{ padding: '7px 0', borderBottom: '1px solid rgba(30,41,59,.35)' }}>
                  <div className="row g6 mb8" style={{ alignItems: 'flex-start' }}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: sntClr(n.sentiment), flexShrink: 0, marginTop: 3 }} />
                    <span style={{ fontSize: 11, lineHeight: 1.5 }}>{n.title}</span>
                  </div>
                  <div className="row g6" style={{ paddingLeft: 14 }}>
                    <span className="mc" style={{ fontSize: 10 }}>{n.source}</span>
                    {(n.matched_tickers || []).slice(0, 2).map(function(t) {
                      return <span key={t} className="badge b-accent" style={{ fontSize: 9, padding: '1px 5px' }}>{t}</span>;
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <PostMarketSection postmarketData={postmarketData} pmLoading={pmLoading} onLoadPostmarket={onLoadPostmarket} />
    </div>
  );
}

// ── Watchlist Tab ─────────────────────────────────────────────────────────

function WatchlistTab(props) {
  var tickers = (props.data.tickers && props.data.tickers.tickers) ? props.data.tickers.tickers : [];
  var expanded = useState(null);
  var openRow = expanded[0];
  var setOpen = expanded[1];

  function toggle(tk) { setOpen(openRow === tk ? null : tk); }

  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <table className="tbl">
        <thead>
          <tr>
            <th style={{ width: 36 }}>#</th>
            <th>Ticker</th>
            <th>Prix</th>
            <th>Jour %</th>
            <th>Sem. %</th>
            <th>SMA200</th>
            <th>Volume</th>
            <th style={{ textAlign: 'right', paddingRight: 16 }}>Score</th>
          </tr>
        </thead>
        <tbody>
          {tickers.map(function(t) {
            var m = t.market || {};
            var col = t.top3 ? (RANK_COLORS[t.rank] || null) : null;
            var isOpen = openRow === t.ticker;
            return [
              <tr key={t.ticker} onClick={function() { toggle(t.ticker); }} style={{ cursor: 'pointer', background: isOpen ? 'rgba(30,41,59,.25)' : undefined }}>
                <td style={{ borderLeft: col ? '3px solid ' + col : '3px solid transparent' }}>
                  <span className="mc">{t.rank}</span>
                </td>
                <td>
                  <div className="row g6">
                    <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                       className="tv-link" style={{ color: col || '#3b82f6' }}
                       onClick={function(e) { e.stopPropagation(); }}>
                      {t.ticker}
                    </a>
                    {t.top3 && <span style={{ fontSize: 9, color: col }}>★</span>}
                    <a href={'https://www.tradingview.com/chart/?symbol=' + t.ticker} target="_blank" rel="noopener"
                       style={{ fontSize: 11, textDecoration: 'none', lineHeight: 1 }}
                       onClick={function(e) { e.stopPropagation(); }}>📈</a>
                  </div>
                </td>
                <td>{m.price != null ? '$' + fmt(m.price) : '—'}</td>
                <td><span style={{ color: chgClr(m.change_day) }}>{fmtPct(m.change_day)}</span></td>
                <td><span style={{ color: chgClr(m.change_week) }}>{fmtPct(m.change_week)}</span></td>
                <td>
                  {m.dist_sma200 != null
                    ? <span style={{ color: m.above_sma200 ? 'var(--bull)' : 'var(--neutral)' }}>{m.above_sma200 ? '✓' : '▽'} {fmtPct(m.dist_sma200)}</span>
                    : <span className="mc">—</span>
                  }
                </td>
                <td>
                  <div className="row g6">
                    {m.vol_relative != null
                      ? <span style={{ color: m.vol_relative >= 1.5 ? 'var(--purple)' : m.vol_relative >= 1.2 ? 'var(--accent)' : 'var(--muted)' }}>×{fmt(m.vol_relative, 1)}</span>
                      : <span className="mc">—</span>
                    }
                    {m.vol_relative != null && m.vol_relative > 2.0 && (
                      <span className="badge b-bear badge-hot" style={{ fontSize: 9, padding: '1px 5px' }}>🔥 HOT</span>
                    )}
                  </div>
                </td>
                <td style={{ textAlign: 'right', paddingRight: 16 }}>
                  <div className="score-cell">
                    <div className="score-bar-bg" style={{ width: (t.total_score || 0) + '%', background: scrClr(t.total_score || 0) + '30' }} />
                    <span style={{ position: 'relative', fontWeight: 700, color: scrClr(t.total_score || 0), fontSize: 12 }}>{Math.round(t.total_score || 0)}</span>
                  </div>
                </td>
              </tr>,
              isOpen && (
                <tr key={t.ticker + '-x'} className="xrow">
                  <td colSpan={8}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
                      <div>
                        <ShapScoreBreakdown ticker={t} />
                      </div>
                      <div>
                        <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, marginBottom: 10 }}>DÉTAILS</div>
                        {m.sma200 && <div style={{ fontSize: 11, marginBottom: 5 }}><span className="mc">SMA200 : </span>${fmt(m.sma200)} ({fmtPct(m.dist_sma200)}) {m.above_sma200 ? '✓' : '▽'}</div>}
                        {t.reddit && t.reddit.mentions > 0 && <div style={{ fontSize: 11, marginBottom: 5 }}><span className="mc">Reddit : </span>{t.reddit.mentions} mentions</div>}
                        {t.news_count && <div style={{ fontSize: 11 }}><span className="mc">News : </span>{t.news_count.ticker_matches} ticker + {t.news_count.keyword_matches} keyword</div>}
                      </div>
                    </div>
                  </td>
                </tr>
              )
            ];
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Reddit Tab ────────────────────────────────────────────────────────────

function RedditTab(props) {
  var items = (props.data.reddit && props.data.reddit.data) ? props.data.reddit.data : [];
  var totalMent   = items.reduce(function(s, r) { return s + r.mentions; }, 0);
  var netSent     = items.reduce(function(s, r) { return s + r.net_sentiment; }, 0);
  var active      = items.filter(function(r) { return r.mentions > 0; }).length;
  var risingCount = items.filter(function(r) { return r.trend === 'RISING'; }).length;
  var confirmedCount = items.filter(function(r) { return r.verified && r.cross_validated; }).length;

  var chartData = items.slice(0, 12).map(function(r) {
    return { ticker: r.ticker, mentions: r.mentions, fill: sntClr(r.sentiment_label) };
  });

  function trendBadge(r) {
    var trend = r.trend || 'NEW';
    var pct = r.trend_pct;
    var pctStr = (pct !== null && pct !== undefined) ? (pct > 0 ? ' +' + pct + '%' : ' ' + pct + '%') : '';
    if (trend === 'RISING')  return <span style={{ color: 'var(--bull)', fontWeight: 700, fontSize: 11, whiteSpace: 'nowrap' }}>{'📈 RISING' + pctStr}</span>;
    if (trend === 'FALLING') return <span style={{ color: 'var(--bear)', fontWeight: 700, fontSize: 11, whiteSpace: 'nowrap' }}>{'📉 FALLING' + pctStr}</span>;
    if (trend === 'STABLE')  return <span style={{ color: 'var(--muted)', fontSize: 11, whiteSpace: 'nowrap' }}>{'➡️ STABLE' + pctStr}</span>;
    return <span style={{ color: 'var(--dim)', fontSize: 11 }}>🆕 NEW</span>;
  }

  return (
    <div>
      <div className="g3 mb16" style={{ gridTemplateColumns: 'repeat(5, 1fr)' }}>
        <div className="metric"><div className="mval ac">{totalMent}</div><div className="mlbl">Total Mentions</div></div>
        <div className="metric"><div className="mval" style={{ color: netSent > 0 ? 'var(--bull)' : 'var(--bear)' }}>{netSent > 0 ? '+' : ''}{netSent}</div><div className="mlbl">Sentiment Net</div></div>
        <div className="metric"><div className="mval pc">{active}</div><div className="mlbl">Tickers Actifs</div></div>
        <div className="metric"><div className="mval" style={{ color: 'var(--bull)' }}>{risingCount}</div><div className="mlbl">En Hausse</div></div>
        <div className="metric"><div className="mval" style={{ color: 'var(--bull)' }}>{confirmedCount}</div><div className="mlbl">Confirmés</div></div>
      </div>

      <div className="card mb16">
        <div className="stitle" style={{ marginBottom: 14 }}>MENTIONS PAR TICKER</div>
        <ResponsiveContainer width="100%" height={190}>
          <BarChart data={chartData} margin={{ top: 0, right: 0, left: -20, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" vertical={false} />
            <XAxis dataKey="ticker" tick={{ fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' }} axisLine={false} tickLine={false} />
            <Tooltip contentStyle={{ background: '#111827', border: '1px solid #1e293b', borderRadius: 6, fontFamily: 'JetBrains Mono', fontSize: 11 }} />
            <Bar dataKey="mentions" radius={[3, 3, 0, 0]}>
              {chartData.map(function(d, i) { return <Cell key={i} fill={d.fill} />; })}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
        <table className="tbl">
          <thead>
            <tr><th>Ticker</th><th>Tendance 5j</th><th>Mentions</th><th>Sentiment</th><th>Style</th><th>Subreddits</th></tr>
          </thead>
          <tbody>
            {items.map(function(r) {
              var sc = STYLE_COLORS[r.trade_style] || '#64748b';
              return (
                <tr key={r.ticker}>
                  <td>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                      <div className="row g6">
                        <span style={{ fontWeight: 700, color: r.in_watchlist ? 'var(--text)' : 'var(--muted)' }}>
                          {r.ticker}{r.in_watchlist && <span style={{ marginLeft: 5, fontSize: 9, color: 'var(--accent)' }}>●</span>}
                        </span>
                        <a href={'https://www.reddit.com/r/stocks/search/?q=' + r.ticker} target="_blank" rel="noopener"
                           style={{ fontSize: 10, textDecoration: 'none', color: 'var(--muted)' }}
                           title="Chercher sur Reddit">🔍</a>
                      </div>
                      <div className="row g4 wrap">
                        {r.cross_validated && r.verified &&
                          <span style={{ fontSize: 9, background: '#10b98120', color: 'var(--bull)', border: '1px solid #10b98140', borderRadius: 4, padding: '1px 5px', fontWeight: 700 }}>✅ Confirmé</span>
                        }
                        {!r.verified &&
                          <span style={{ fontSize: 9, background: '#f59e0b20', color: 'var(--neutral)', border: '1px solid #f59e0b40', borderRadius: 4, padding: '1px 5px' }}>⚠️ Non vérifié</span>
                        }
                      </div>
                    </div>
                  </td>
                  <td>{trendBadge(r)}</td>
                  <td>
                    <span style={{ fontWeight: 600 }}>{r.mentions}</span>
                    {r.mentions_avg_5d !== null && r.mentions_avg_5d !== undefined &&
                      <span className="mc" style={{ marginLeft: 5, fontSize: 10 }}>moy {r.mentions_avg_5d}</span>
                    }
                  </td>
                  <td>
                    <span style={{ color: sntClr(r.sentiment_label), fontWeight: 600 }}>{r.net_sentiment > 0 ? '+' : ''}{r.net_sentiment}</span>
                    <span className="mc" style={{ marginLeft: 6, fontSize: 10 }}>{r.sentiment_label}</span>
                  </td>
                  <td>
                    {r.trade_style && r.trade_style !== '?'
                      ? <span className="badge" style={{ background: sc + '20', color: sc, border: '1px solid ' + sc + '40' }}>{r.trade_style}</span>
                      : <span className="mc">—</span>
                    }
                  </td>
                  <td><span className="mc" style={{ fontSize: 11 }}>{(r.subreddits || []).slice(0, 3).join(', ') || '—'}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── News Tab ──────────────────────────────────────────────────────────────

function NewsTab(props) {
  var news = props.data.news || {};
  var tn = news.ticker_news || [];
  var mn = news.market_news || [];
  var total = news.total_fetched || 0;

  function NewsItem(p) {
    var n = p.n;
    return (
      <div className="nitem">
        <div className="row g6" style={{ marginBottom: 5, alignItems: 'flex-start' }}>
          <span style={{ width: 9, height: 9, borderRadius: '50%', background: sntClr(n.sentiment || 'NEUTRAL'), flexShrink: 0, marginTop: 3 }} />
          <a href={n.link || '#'} target="_blank" rel="noopener" className="news-link">
            {n.title}
          </a>
        </div>
        <div className="row g6 wrap" style={{ paddingLeft: 15 }}>
          <span className="mc" style={{ fontSize: 10 }}>{n.source}</span>
          <span className={'badge ' + (n.sentiment === 'BULL' ? 'b-bull' : n.sentiment === 'BEAR' ? 'b-bear' : 'b-neutral')} style={{ fontSize: 9, padding: '1px 5px' }}>{n.sentiment || 'NEUTRAL'}</span>
          {(n.matched_tickers || []).map(function(t) {
            return <span key={t} className="badge b-accent" style={{ fontSize: 9, padding: '1px 5px' }}>{t}</span>;
          })}
          {(n.matched_keywords || []).slice(0, 2).map(function(k, i) {
            return <span key={i} className="badge b-muted" style={{ fontSize: 9, padding: '1px 5px' }}>{k}</span>;
          })}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="row g12 mb16 wrap">
        {[{val:tn.length,lbl:'News Tickers',sub:'Match ticker',color:'var(--accent)'},
          {val:mn.length,lbl:'News Macro',  sub:'Keywords',   color:'var(--neutral)'},
          {val:total,    lbl:'Total',       sub:'Flux RSS',    color:'var(--muted)'}].map(function(c) {
          return (
            <div key={c.lbl} className="card card-sm row g12" style={{ flex: 1, minWidth: 150 }}>
              <span style={{ fontSize: 26, fontWeight: 700, color: c.color }}>{c.val}</span>
              <div>
                <div style={{ fontWeight: 600, fontSize: 12 }}>{c.lbl}</div>
                <div className="mc" style={{ fontSize: 10, marginTop: 2 }}>{c.sub}</div>
              </div>
            </div>
          );
        })}
      </div>
      {tn.length > 0 && (
        <div className="mb16">
          <div className="stitle">NEWS TICKERS</div>
          <div className="card">{tn.map(function(n, i) { return <NewsItem key={i} n={n} />; })}</div>
        </div>
      )}
      {mn.length > 0 && (
        <div>
          <div className="stitle">NEWS MACRO</div>
          <div className="card">{mn.map(function(n, i) { return <NewsItem key={i} n={n} />; })}</div>
        </div>
      )}
    </div>
  );
}

// ── Performance Tab ────────────────────────────────────────────────────────

var _MONTH_NAMES = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
var _TOOLTIP_STYLE = { background: '#111827', border: '1px solid #1e293b', borderRadius: 6, fontFamily: 'JetBrains Mono', fontSize: 11 };
var _TICK_STYLE    = { fill: '#64748b', fontSize: 10, fontFamily: 'JetBrains Mono' };
var _fmtD          = function(d) { return d ? d.slice(5).replace('-', '/') : ''; };

function PerfMetricCard(props) {
  var label = props.label;
  var value = props.value;
  var color = props.color || 'var(--text)';
  var sub   = props.sub;
  return (
    <div className="card" style={{ textAlign: 'center', padding: '16px 12px' }}>
      <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 8 }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700, lineHeight: 1, color: color }}>{value}</div>
      {sub && <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 6 }}>{sub}</div>}
    </div>
  );
}

function EquityCurve(props) {
  var data = props.data || [];
  if (!data.length) return null;
  var vals     = data.map(function(d) { return d.pnl; });
  var eMax     = Math.max.apply(null, vals.concat([0]));
  var eMin     = Math.min.apply(null, vals.concat([0]));
  var zeroOff  = (eMax > 0 && eMin < 0) ? (eMax / (eMax - eMin) * 100).toFixed(1) + '%' : (eMin >= 0 ? '0%' : '100%');
  var lastVal  = vals[vals.length - 1] || 0;
  var lineClr  = lastVal >= 0 ? '#10b981' : '#ef4444';
  return (
    <div className="card mb16">
      <div className="stitle" style={{ marginBottom: 14 }}>COURBE D'EQUITY</div>
      <ResponsiveContainer width="100%" height={220}>
        <AreaChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%"     stopColor="#10b981" stopOpacity={0.35} />
              <stop offset={zeroOff} stopColor="#10b981" stopOpacity={0.05} />
              <stop offset={zeroOff} stopColor="#ef4444" stopOpacity={0.05} />
              <stop offset="95%"    stopColor="#ef4444" stopOpacity={0.35} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
          <XAxis dataKey="date" tickFormatter={_fmtD} tick={_TICK_STYLE} axisLine={false} tickLine={false} />
          <YAxis tick={_TICK_STYLE} axisLine={false} tickLine={false} tickFormatter={function(v) { return '$' + v; }} />
          <Tooltip contentStyle={_TOOLTIP_STYLE} formatter={function(v) { return ['$' + v, 'PnL cumulé']; }} labelFormatter={_fmtD} />
          <Area type="monotone" dataKey="pnl" stroke={lineClr} strokeWidth={2} fill="url(#eqGrad)" dot={false} activeDot={{ r: 4, strokeWidth: 0 }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function MonthlyHeatmap(props) {
  var data = props.data || [];
  if (!data.length) return null;
  var monthMap = {};
  data.forEach(function(m) { monthMap[m.month] = m; });
  var years = [];
  data.forEach(function(m) { var y = m.month.slice(0, 4); if (years.indexOf(y) === -1) years.push(y); });
  years.sort();
  var allAbs = data.map(function(m) { return Math.abs(m.pnl); });
  var maxAbs = Math.max.apply(null, allAbs.concat([1]));
  return (
    <div className="card mb16">
      <div className="stitle" style={{ marginBottom: 14 }}>RETOURS MENSUELS</div>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'separate', borderSpacing: 4 }}>
          <thead>
            <tr>
              <th style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'left', paddingRight: 8, width: 40 }}>Année</th>
              {_MONTH_NAMES.map(function(mn) {
                return <th key={mn} style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'center', width: 60 }}>{mn}</th>;
              })}
              <th style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 700, textAlign: 'right', paddingLeft: 8 }}>Total</th>
            </tr>
          </thead>
          <tbody>
            {years.map(function(year) {
              var yearTotal = 0;
              return (
                <tr key={year}>
                  <td style={{ fontSize: 11, fontWeight: 700, color: 'var(--muted)', paddingRight: 8 }}>{year}</td>
                  {_MONTH_NAMES.map(function(_, mi) {
                    var key  = year + '-' + String(mi + 1).padStart(2, '0');
                    var cell = monthMap[key];
                    if (cell) yearTotal += cell.pnl;
                    var intensity = cell ? Math.min(0.8, 0.15 + Math.abs(cell.pnl) / maxAbs * 0.65) : 0;
                    var bg = cell
                      ? (cell.pnl >= 0 ? 'rgba(16,185,129,' + intensity + ')' : 'rgba(239,68,68,' + intensity + ')')
                      : 'rgba(30,41,59,0.3)';
                    return (
                      <td key={mi} style={{ textAlign: 'center', padding: '5px 2px' }}>
                        <div style={{ background: bg, borderRadius: 4, padding: '5px 2px', minHeight: 36, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                          {cell ? (
                            <>
                              <div style={{ fontSize: 11, fontWeight: 700, color: cell.pnl >= 0 ? '#10b981' : '#ef4444' }}>
                                {cell.pnl >= 0 ? '+' : ''}{Math.round(cell.pnl)}$
                              </div>
                              <div style={{ fontSize: 9, color: 'var(--muted)' }}>{cell.winrate}%</div>
                            </>
                          ) : <span style={{ color: 'var(--dim)', fontSize: 10 }}>—</span>}
                        </div>
                      </td>
                    );
                  })}
                  <td style={{ textAlign: 'right', paddingLeft: 8, fontSize: 11, fontWeight: 700, color: yearTotal >= 0 ? '#10b981' : '#ef4444' }}>
                    {yearTotal >= 0 ? '+' : ''}{Math.round(yearTotal)}$
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DrawdownChart(props) {
  var data = props.data || [];
  var maxDD = props.maxDrawdown || 0;
  if (!data.length) return null;
  var vals   = data.map(function(d) { return d.drawdown; });
  var minVal = Math.min.apply(null, vals.concat([0]));
  var domain = [Math.floor(minVal * 1.1), 0];
  return (
    <div className="card mb16">
      <div className="rowb" style={{ marginBottom: 14 }}>
        <div className="stitle" style={{ marginBottom: 0 }}>ANALYSE DRAWDOWN</div>
        <div style={{ fontSize: 11 }}>
          <span style={{ color: 'var(--muted)' }}>Max DD : </span>
          <span style={{ color: '#ef4444', fontWeight: 700 }}>${Math.abs(maxDD).toFixed(0)}</span>
        </div>
      </div>
      <ResponsiveContainer width="100%" height={160}>
        <AreaChart data={data} margin={{ top: 5, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="ddGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%"  stopColor="#ef4444" stopOpacity={0.5} />
              <stop offset="95%" stopColor="#ef4444" stopOpacity={0.05} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
          <XAxis dataKey="date" tickFormatter={_fmtD} tick={_TICK_STYLE} axisLine={false} tickLine={false} />
          <YAxis domain={domain} tick={_TICK_STYLE} axisLine={false} tickLine={false} tickFormatter={function(v) { return '$' + v; }} />
          <Tooltip contentStyle={_TOOLTIP_STYLE} formatter={function(v) { return ['$' + v, 'Drawdown']; }} labelFormatter={_fmtD} />
          <Area type="monotone" dataKey="drawdown" stroke="#ef4444" strokeWidth={2} fill="url(#ddGrad)" dot={false} activeDot={{ r: 3, strokeWidth: 0 }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function EdgeTable(props) {
  var title   = props.title;
  var rows    = props.rows || [];
  var columns = props.columns || [];
  if (!rows.length) return (
    <div className="card"><div className="stitle" style={{ marginBottom: 8 }}>{title}</div><div style={{ color: 'var(--muted)', fontSize: 11, textAlign: 'center', padding: 16 }}>Aucune donnée</div></div>
  );
  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <div className="stitle" style={{ padding: '12px 16px 10px' }}>{title}</div>
      <table className="tbl">
        <thead>
          <tr>{columns.map(function(c) { return <th key={c.key}>{c.label}</th>; })}</tr>
        </thead>
        <tbody>
          {rows.map(function(row, i) {
            return (
              <tr key={i}>
                {columns.map(function(c) {
                  var val = row[c.key];
                  var color = c.color ? c.color(val, row) : 'var(--text)';
                  return <td key={c.key} style={{ color: color, fontWeight: c.bold ? 700 : 400 }}>{c.fmt ? c.fmt(val) : val}</td>;
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function PerformanceTab() {
  var ps = useState(null);  var perf = ps[0];     var setPerf = ps[1];
  var ls = useState(true);  var loading = ls[0];  var setLoading = ls[1];
  var es = useState(null);  var err = es[0];      var setErr = es[1];

  useEffect(function() {
    setLoading(true);
    fetch('/api/performance')
      .then(function(r) { return r.json(); })
      .then(function(d) { setPerf(d); setLoading(false); })
      .catch(function(e) { setErr(String(e)); setLoading(false); });
  }, []);

  if (loading) return <div className="card" style={{ textAlign: 'center', padding: 48, color: 'var(--muted)' }}>Chargement des statistiques...</div>;
  if (err)     return <div className="card" style={{ color: 'var(--bear)', padding: 20 }}>Erreur : {err}</div>;
  if (!perf)   return null;

  var isEmpty = perf.total_trades === 0;

  var pnlColor = isEmpty ? 'var(--muted)' : (perf.total_pnl >= 0 ? '#10b981' : '#ef4444');
  var wrColor  = isEmpty ? 'var(--muted)' : (perf.winrate >= 50   ? '#10b981' : '#ef4444');
  var pfColor  = isEmpty ? 'var(--muted)' : (perf.profit_factor != null && perf.profit_factor >= 1.5 ? '#10b981' : 'var(--neutral)');
  var ddColor  = '#ef4444';
  var exColor  = isEmpty ? 'var(--muted)' : (perf.expectancy >= 0 ? '#10b981' : '#ef4444');

  return (
    <div>
      {isEmpty && (
        <div className="card mb16" style={{ textAlign: 'center', padding: '32px 24px' }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>📊</div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>Aucun trade enregistré</div>
          <div style={{ color: 'var(--muted)', fontSize: 12, maxWidth: 440, margin: '0 auto' }}>
            Utilise l'onglet Journal pour enregistrer tes premiers trades et voir tes statistiques ici !
          </div>
        </div>
      )}

      {/* ── 6 Métriques ── */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginBottom: 16 }}>
        <PerfMetricCard label="Total PnL"    value={isEmpty ? '—' : (perf.total_pnl >= 0 ? '+' : '') + '$' + Math.abs(perf.total_pnl).toFixed(0)} color={pnlColor}
          sub={isEmpty ? null : (perf.best_trade ? '↑ ' + perf.best_trade.ticker : null)} />
        <PerfMetricCard label="Winrate"      value={isEmpty ? '—' : perf.winrate + '%'} color={wrColor}
          sub={isEmpty ? null : perf.wins + 'W / ' + perf.losses + 'L' + (perf.be ? ' / ' + perf.be + 'BE' : '')} />
        <PerfMetricCard label="Profit Factor" value={isEmpty ? '—' : (perf.profit_factor != null ? perf.profit_factor + 'x' : 'N/A')} color={pfColor}
          sub={isEmpty ? null : '≥ 1.5 conseillé'} />
        <PerfMetricCard label="Max Drawdown" value={isEmpty ? '—' : '-$' + Math.abs(perf.max_drawdown).toFixed(0)} color={isEmpty ? 'var(--muted)' : ddColor}
          sub={null} />
        <PerfMetricCard label="Expectancy"   value={isEmpty ? '—' : (perf.expectancy >= 0 ? '+' : '') + '$' + perf.expectancy.toFixed(0)} color={exColor}
          sub="par trade" />
        <PerfMetricCard label="Trades"       value={isEmpty ? '0' : perf.total_trades} color="var(--accent)"
          sub={isEmpty ? null : (perf.avg_rr_realized != null ? 'Avg RR ' + perf.avg_rr_realized + 'R' : null)} />
      </div>

      {!isEmpty && (
        <>
          <EquityCurve data={perf.equity_curve} />

          <div className="g2 mb16">
            <MonthlyHeatmap data={perf.monthly_returns} />
            <DrawdownChart  data={perf.drawdown_curve} maxDrawdown={perf.max_drawdown} />
          </div>

          {/* ── Edge Tracker ── */}
          <div className="stitle">EDGE TRACKER</div>
          <div className="g2">
            <EdgeTable
              title="Par Ticker"
              rows={perf.by_ticker}
              columns={[
                { key: 'ticker',  label: 'Ticker',  bold: true },
                { key: 'trades',  label: 'Trades' },
                { key: 'winrate', label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                { key: 'pnl',     label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                { key: 'avg_rr',  label: 'Avg RR', fmt: function(v) { return v != null ? v + 'R' : '—'; }, color: function(v) { return v != null && v >= 2 ? '#10b981' : 'var(--muted)'; } },
              ]}
            />
            <EdgeTable
              title="Par Setup"
              rows={perf.by_setup}
              columns={[
                { key: 'type',          label: 'Setup',  bold: true, fmt: function(v) { return v.replace('_', ' '); } },
                { key: 'trades',        label: 'Trades' },
                { key: 'winrate',       label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                { key: 'pnl',           label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                { key: 'profit_factor', label: 'PF',     fmt: function(v) { return v != null ? v + 'x' : '—'; }, color: function(v) { return v != null && v >= 1.5 ? '#10b981' : 'var(--muted)'; } },
              ]}
            />
          </div>

          {perf.by_regime && perf.by_regime.length > 0 && (
            <div style={{ marginTop: 12 }}>
              <EdgeTable
                title="Par Régime de Marché"
                rows={perf.by_regime}
                columns={[
                  { key: 'regime',  label: 'Régime', bold: true },
                  { key: 'trades',  label: 'Trades' },
                  { key: 'winrate', label: 'WR %',   fmt: function(v) { return v + '%'; }, color: function(v) { return v >= 50 ? '#10b981' : '#ef4444'; } },
                  { key: 'pnl',     label: 'PnL',    fmt: function(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(0); }, color: function(v) { return v >= 0 ? '#10b981' : '#ef4444'; } },
                ]}
              />
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Alerts Tab ────────────────────────────────────────────────────────────

function AlertsTab(props) {
  var alertData    = props.alertData  || {};
  var liveNews     = props.liveNews   || [];
  var countdown    = props.countdown  || null;
  var testMode     = props.testMode   || false;
  var onSimulate   = props.onSimulate || function() {};
  var posMonitor   = props.posMonitor || { positions: [], alerts: [] };
  var inKZ         = !!alertData.in_killzone;
  var alerts       = alertData.alerts || [];
  var posAlerts    = posMonitor.alerts || [];
  var nextKZ       = alertData.next_killzone || '—';

  // Filtrer les news des 30 dernières minutes
  var now30 = Date.now() - 30 * 60 * 1000;
  var recentNews = liveNews.filter(function(n) {
    if (!n.fetched_at) return true;   // garder si pas de timestamp
    return new Date(n.fetched_at).getTime() >= now30;
  });

  var sevColor = function(s) { return s === 'HIGH' ? '#ef4444' : s === 'MEDIUM' ? '#f59e0b' : '#475569'; };

  return (
    <div>
      {/* Statut killzone */}
      <div className="card mb16" style={{ padding: '14px 18px' }}>
        <div className="rowb">
          <div className="row g12">
            {testMode
              ? <span className="kz-live" style={{ background: 'rgba(249,115,22,.15)', color: '#f97316', borderColor: 'rgba(249,115,22,.4)' }}>🧪 TEST MODE actif</span>
              : inKZ
                ? <span className="kz-live">🔴 LIVE 14h30-16h30 CET</span>
                : <span className="kz-off">⏸️ Hors killzone</span>
            }
            {(inKZ || testMode) && countdown !== null && (
              <span className="mc" style={{ fontSize: 11 }}>Prochain scan dans : <span style={{ color: 'var(--text)', fontWeight: 700 }}>{countdown}s</span></span>
            )}
          </div>
          {alertData.scanned_at && (
            <span className="mc" style={{ fontSize: 10 }}>Scanné à {alertData.scanned_at}</span>
          )}
        </div>
        {!inKZ && !testMode && (
          <div style={{ marginTop: 10, fontSize: 11, color: 'var(--muted)' }}>
            Prochaine session : <span style={{ color: 'var(--text)', fontWeight: 600 }}>{nextKZ}</span>
            <div style={{ marginTop: 6, color: '#475569' }}>En attendant, analyse tes Setup Candidates sur TradingView 📈</div>
            <div style={{ marginTop: 10 }}>
              <button onClick={onSimulate} style={{ background: 'transparent', border: '1px solid #334155', color: '#94a3b8', borderRadius: 6, padding: '4px 10px', fontSize: 11, cursor: 'pointer', fontFamily: 'inherit' }}>
                🧪 Simuler killzone
              </button>
            </div>
          </div>
        )}
      </div>

      {/* Alertes positions */}
      {posAlerts.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div className="stitle">📊 ALERTES POSITIONS ({posAlerts.length})</div>
          {posAlerts.map(function(a, i) {
            return (
              <div key={i} className={'alert-item alert-' + a.severity}>
                <div className="rowb">
                  <div className="row g8" style={{ flex: 1 }}>
                    <a href={'https://www.tradingview.com/chart/?symbol=' + a.ticker} target="_blank" rel="noopener"
                       className="tv-link" style={{ color: sevColor(a.severity), fontSize: 12, minWidth: 42 }}>
                      {a.ticker}
                    </a>
                    <span style={{ fontSize: 12, color: 'var(--text)' }}>{a.message}</span>
                  </div>
                  <div className="row g8">
                    <span className="badge" style={{ background: sevColor(a.severity) + '20', color: sevColor(a.severity), border: '1px solid ' + sevColor(a.severity) + '40', fontSize: 9 }}>{a.severity}</span>
                    <span className="mc" style={{ fontSize: 10 }}>{a.timestamp}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Alertes intraday */}
      <div className="stitle">ALERTES INTRADAY</div>
      {alerts.length === 0
        ? <div className="card mc" style={{ textAlign: 'center', padding: 24, fontSize: 12 }}>
            {inKZ ? 'Aucune alerte pour le moment — scan en cours...' : 'Les alertes apparaîtront pendant la killzone (14h30-16h30 CET)'}
          </div>
        : <div style={{ marginBottom: 16 }}>
            {alerts.map(function(a, i) {
              return (
                <div key={i} className={'alert-item alert-' + a.severity}>
                  <div className="rowb">
                    <div className="row g8" style={{ flex: 1 }}>
                      <a href={'https://www.tradingview.com/chart/?symbol=' + a.ticker} target="_blank" rel="noopener"
                         className="tv-link" style={{ color: sevColor(a.severity), fontSize: 12, minWidth: 42 }}>
                        {a.ticker}
                      </a>
                      <span style={{ fontSize: 12, color: 'var(--text)' }}>{a.message}</span>
                    </div>
                    <div className="row g8">
                      <span className="badge" style={{ background: sevColor(a.severity) + '20', color: sevColor(a.severity), border: '1px solid ' + sevColor(a.severity) + '40', fontSize: 9 }}>{a.severity}</span>
                      <span className="mc" style={{ fontSize: 10 }}>{a.timestamp}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
      }

      {/* Breaking News 30 min */}
      <div>
        <div className="stitle">⚡ BREAKING NEWS (30 MIN)</div>
        {recentNews.length === 0
          ? <div className="card mc" style={{ textAlign: 'center', padding: 18, fontSize: 12 }}>Pas de breaking news</div>
          : <div className="card">
              {recentNews.map(function(n, i) {
                var sc = n.sentiment === 'BULL' ? '#10b981' : n.sentiment === 'BEAR' ? '#ef4444' : '#f59e0b';
                var arrivalTime = n.fetched_at ? new Date(n.fetched_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
                return (
                  <div key={i} style={{ padding: '8px 0', borderBottom: i < recentNews.length - 1 ? '1px solid rgba(30,41,59,.4)' : 'none' }}>
                    <div className="row g6" style={{ alignItems: 'flex-start', marginBottom: 4 }}>
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: sc, flexShrink: 0, marginTop: 3 }} />
                      <a href={n.link || '#'} target="_blank" rel="noopener" className="news-link">{n.title}</a>
                    </div>
                    <div className="row g6 wrap" style={{ paddingLeft: 14 }}>
                      <span className="mc" style={{ fontSize: 10 }}>{n.source}</span>
                      {arrivalTime && <span className="mc" style={{ fontSize: 10 }}>à {arrivalTime}</span>}
                      {(n.matched_tickers || []).slice(0, 2).map(function(t) {
                        return <span key={t} className="badge b-accent" style={{ fontSize: 9, padding: '1px 5px' }}>{t}</span>;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
        }
      </div>
    </div>
  );
}

// ── Setups Tab ────────────────────────────────────────────────────────────

var _SETUP_COLOR = { DISCOUNT_ZONE: '#3b82f6', SMA200_BOUNCE: '#10b981', MOMENTUM: '#f59e0b' };
var _SETUP_LABEL = { DISCOUNT_ZONE: 'Discount Zone', SMA200_BOUNCE: 'SMA200 Bounce', MOMENTUM: 'Momentum' };
var _SETUP_SHORT = { DISCOUNT_ZONE: 'DISC', SMA200_BOUNCE: 'SMA', MOMENTUM: 'MOM' };
var _CONF_BADGE  = { HIGH: 'b-bull', MEDIUM: 'b-neutral', LOW: 'b-muted' };

    <div>

          </div>
          <button className={'btn' + (setupsLoading ? '' : ' btn-p')} onClick={onScan} disabled={setupsLoading}
            style={setupsLoading ? { opacity: 0.65, cursor: 'not-allowed' } : {}}>
            {setupsLoading
              ? <span><span className="spin-anim">⟳</span> Analyse en cours...</span>

        {setupsData && !setupsLoading && (

              : '—'}
            {' — '}{setupsData.count || 0} setup(s) détecté(s)
